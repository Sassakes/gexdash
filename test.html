<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GexDash — Test</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<!-- Palette partagée, cf. CLAUDE.md : ne pas redéclarer de token couleur ici. -->
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  /* GARDE-FOU : l'attribut hidden doit toujours l'emporter (cf. CLAUDE.md). */
  [hidden]{display:none !important}
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh}

  header{display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--surface),#0E0E11); font-family:var(--mono)}
  header h1{font-size:14px; font-weight:600; letter-spacing:.02em}
  header h1 b{color:var(--gold)}
  header span{font-size:10.5px; color:var(--faint)}

  .toolbar{display:flex; align-items:center; gap:12px; padding:9px 20px; border-bottom:1px solid var(--line);
    font-family:var(--mono)}
  .seg{display:flex; border:1px solid var(--line-strong); border-radius:6px; overflow:hidden; background:var(--surface2)}
  .seg button{font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--muted); background:transparent;
    border:0; padding:6px 14px; cursor:pointer; letter-spacing:.03em; transition:background .12s,color .12s; min-height:36px}
  .seg button+button{border-left:1px solid var(--line-strong)}
  .seg button.on{background:var(--teal-soft); color:var(--teal)}

  main{max-width:960px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:20px}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .panel h2{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
    padding:12px 14px}
  .chartBox{position:relative; width:100%; height:360px}

  /* Bandeau live NQ1! (/api/nqlive) -- experimental, cf. conversation :
     websocket TradingView authentifie cote serveur (env TV_SESSIONID/
     TV_SESSIONID_SIGN), jamais de cookie cote client. */
  .livebar{display:flex; align-items:baseline; gap:16px; padding:14px 16px; font-family:var(--mono)}
  .liveprice{font-size:28px; font-weight:600; color:var(--text)}
  .liveprice.up{color:var(--teal)} .liveprice.down{color:var(--red)}
  .livemeta{display:flex; gap:14px; font-size:11px; color:var(--muted)}
  .livemeta b{color:var(--text)}
  .livebadge{font-size:9.5px; padding:3px 8px; border-radius:20px; letter-spacing:.05em}
  .livebadge.streaming{background:var(--teal-soft); color:var(--teal)}
  .livebadge.delayed{background:var(--red-soft); color:var(--red)}
  .livebadge.off{background:var(--surface2); color:var(--faint)}
</style>
</head>
<body>
<header>
  <h1><b>Gex</b>Dash · Test</h1>
  <span>page non référencée — charts NQ / NAS100</span>
</header>

<div class="toolbar">
  <div class="seg" id="segIv">
    <button data-iv="1m">M1</button>
    <button data-iv="5m" class="on">M5</button>
    <button data-iv="15m">M15</button>
  </div>
</div>

<main>
  <div class="panel">
    <h2>NQ1! — live (TradingView, expérimental)</h2>
    <div class="livebar">
      <span class="liveprice" id="livePrice">—</span>
      <span class="livemeta">
        <span>Chg <b id="liveCh">—</b></span>
        <span>Vol <b id="liveVol">—</b></span>
      </span>
      <span class="livebadge off" id="liveBadge">off</span>
    </div>
  </div>

  <div class="panel">
    <h2>NQ (future)</h2>
    <div class="chartBox" id="chartNQ"></div>
  </div>

  <div class="panel">
    <h2>NAS100 (indice cash)</h2>
    <div class="chartBox" id="chartIdx"></div>
  </div>
</main>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
"use strict";

const COL = {up: THEME.teal, dn: THEME.red, muted: THEME.muted, line: THEME.line, faint: THEME.faint};
const IV_SEC = {"1m": 60, "5m": 300, "15m": 900};
let IV = "5m";

/* Deux charts basiques Lightweight Charts : NQ en échelle future (payload
   brut de /api/chart) et NAS100 en échelle indice (?scale=idx, cf.
   index.html/prefetchBars -- la conversion basis est faite CÔTÉ SERVEUR,
   le client ne sait pas la défaire). Même endpoint, même données sources,
   juste deux échelles d'affichage du même NQ. */
function makeChart(hostId){
  const box = document.getElementById(hostId);
  const chart = LightweightCharts.createChart(box, {
    layout:{background:{type:"solid", color:"transparent"}, textColor:COL.muted,
            fontFamily:"IBM Plex Mono, monospace", fontSize:10},
    grid:{vertLines:{color:"rgba(255,255,255,.03)"}, horzLines:{color:"rgba(255,255,255,.03)"}},
    rightPriceScale:{borderColor:COL.line},
    timeScale:{borderColor:COL.line, timeVisible:true, secondsVisible:false},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal,
      vertLine:{color:COL.faint, width:1, style:LightweightCharts.LineStyle.Dashed},
      horzLine:{color:COL.faint, width:1, style:LightweightCharts.LineStyle.Dashed}},
  });
  const series = chart.addCandlestickSeries({
    upColor:COL.up, downColor:COL.dn, borderVisible:false,
    wickUpColor:COL.up, wickDownColor:COL.dn,
  });
  new ResizeObserver(() => chart.applyOptions({width: box.clientWidth, height: box.clientHeight}))
    .observe(box);
  return {chart, series, box};
}
const NQ = makeChart("chartNQ");
const IDX = makeChart("chartIdx");

async function loadOne(target, scaleQ, out){
  try{
    const [chartRes, quoteRes] = await Promise.all([
      fetch(`/api/chart?target=${target}&interval=${IV}${scaleQ}`).then(r => r.json()),
      fetch(`/api/quote?target=${target}${scaleQ}`).then(r => r.json()).catch(() => null),
    ]);
    if (chartRes.error || !chartRes.bars) return;
    let bars = chartRes.bars;
    // Synthétise la bougie du bucket courant si la dernière est en retard,
    // pour que l'axe reste à l'heure réelle (même logique que index.html).
    if (quoteRes && quoteRes.price != null && bars.length){
      const sec = IV_SEC[IV];
      const nowB = Math.floor(Date.now() / 1000 / sec) * sec;
      const lastB = bars[bars.length - 1];
      if (lastB && nowB > lastB.time){
        bars = bars.concat([{time: nowB, open: quoteRes.price, high: quoteRes.price,
                              low: quoteRes.price, close: quoteRes.price}]);
      }
    }
    out.series.setData(bars);
  }catch(_){}
}

function loadAll(){
  loadOne("NQ", "", NQ);
  loadOne("NQ", "&scale=idx", IDX);
}

document.querySelectorAll("#segIv button").forEach(b => b.onclick = () => {
  if (b.dataset.iv === IV) return;
  IV = b.dataset.iv;
  document.querySelectorAll("#segIv button").forEach(x => x.classList.toggle("on", x === b));
  loadAll();
});

loadAll();
setInterval(() => { if (!document.hidden) loadAll(); }, 15000);

/* Bandeau live NQ1! : poll /api/nqlive (websocket TradingView cote serveur,
   cf. api/gex.py _tv_live_quote). Experimental -- pas de garantie de dispo,
   pas branche aux charts ci-dessus. */
let liveLast = null;
async function pollLive(){
  try{
    const r = await fetch("/api/nqlive");
    const d = await r.json();
    const badge = document.getElementById("liveBadge");
    if (!r.ok || d.error || d.price == null){
      badge.textContent = "off"; badge.className = "livebadge off";
      return;
    }
    const priceEl = document.getElementById("livePrice");
    priceEl.textContent = d.price.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
    priceEl.className = "liveprice" + (liveLast != null ? (d.price > liveLast ? " up" : d.price < liveLast ? " down" : "") : "");
    liveLast = d.price;
    document.getElementById("liveCh").textContent = d.ch != null ? d.ch.toFixed(2) : "—";
    document.getElementById("liveVol").textContent = d.volume != null ? Math.round(d.volume).toLocaleString() : "—";
    badge.textContent = d.update_mode || "?";
    badge.className = "livebadge " + (d.update_mode === "streaming" ? "streaming" : "delayed");
  }catch(_){
    const badge = document.getElementById("liveBadge");
    badge.textContent = "off"; badge.className = "livebadge off";
  }
}
pollLive();
setInterval(() => { if (!document.hidden) pollLive(); }, 1500);
</script>
</body>
</html>
