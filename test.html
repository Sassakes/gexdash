<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GexDash — Test</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<!-- Palette partagée, cf. CLAUDE.md : ne pas redéclarer de token couleur ici. -->
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<script src="/ui.js"></script>
<style>
  /* GARDE-FOU : l'attribut hidden doit toujours l'emporter (cf. CLAUDE.md). */
  [hidden]{display:none !important}
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh}

  header{display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--surface),#0E0E11); font-family:var(--mono)}
  header h1{font-size:14px; font-weight:600; letter-spacing:.02em}
  header h1 b{color:var(--gold)}
  header span{font-size:10.5px; color:var(--faint)}

  main{max-width:960px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:20px}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .panelhead{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px}
  .panelhead h2{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
  .seg{display:flex; border:1px solid var(--line-strong); border-radius:6px; overflow:hidden; background:var(--surface2); font-family:var(--mono)}
  .seg button{font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--muted); background:transparent;
    border:0; padding:5px 11px; cursor:pointer; letter-spacing:.03em; transition:background .12s,color .12s; min-height:30px}
  .seg button+button{border-left:1px solid var(--line-strong)}
  .seg button.on{background:var(--teal-soft); color:var(--teal)}
  .chartBox{position:relative; width:100%; height:360px}

  /* Bandeau live NQ1! (/api/nqlive) -- experimental, cf. conversation :
     websocket TradingView authentifie cote serveur (env TV_SESSIONID/
     TV_SESSIONID_SIGN), jamais de cookie cote client. */
  .livebar{display:flex; align-items:baseline; gap:16px; padding:14px 16px; font-family:var(--mono)}
  .liveprice{font-size:28px; font-weight:600; color:var(--text); transition:color .15s}
  .liveprice.up{color:var(--teal)} .liveprice.down{color:var(--red)}
  .livemeta{display:flex; gap:14px; font-size:11px; color:var(--muted)}
  .livemeta b{color:var(--text)}
  .livebadge{font-size:9.5px; padding:3px 8px; border-radius:20px; letter-spacing:.05em}
  .livebadge.streaming{background:var(--teal-soft); color:var(--teal)}
  .livebadge.delayed{background:var(--red-soft); color:var(--red)}
  .livebadge.off{background:var(--surface2); color:var(--faint)}
</style>
</head>
<body>
<header>
  <h1><b>Gex</b>Dash · Test</h1>
  <span>page non référencée — charts NQ / NAS100</span>
</header>

<main>
  <div class="panel">
    <div class="panelhead"><h2>NQ1! — live (TradingView, expérimental)</h2></div>
    <div class="livebar">
      <span class="liveprice" id="livePrice">—</span>
      <span class="livemeta">
        <span>Chg <b id="liveCh">—</b></span>
        <span>Vol <b id="liveVol">—</b></span>
      </span>
      <span class="livebadge off" id="liveBadge">off</span>
    </div>
  </div>

  <div class="panel">
    <div class="panelhead">
      <h2>NQ (future)</h2>
      <div class="seg" data-chart="NQ">
        <button data-iv="1m">M1</button>
        <button data-iv="5m" class="on">M5</button>
        <button data-iv="15m">M15</button>
      </div>
    </div>
    <div class="chartBox" id="chartNQ"></div>
  </div>

  <div class="panel">
    <div class="panelhead">
      <h2>NAS100 (indice cash)</h2>
      <div class="seg" data-chart="IDX">
        <button data-iv="1m">M1</button>
        <button data-iv="5m" class="on">M5</button>
        <button data-iv="15m">M15</button>
      </div>
    </div>
    <div class="chartBox" id="chartIdx"></div>
  </div>
</main>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
"use strict";

const COL = {up: PREFS.up, dn: PREFS.dn, muted: THEME.muted, line: THEME.line, faint: THEME.faint};
const IV_SEC = {"1m": 60, "5m": 300, "15m": 900};

/* Deux charts basiques Lightweight Charts : NQ en échelle future (payload
   brut de /api/chart) et NAS100 en échelle indice (?scale=idx, cf.
   index.html/prefetchBars -- la conversion basis est faite CÔTÉ SERVEUR,
   le client ne sait pas la défaire). Même endpoint, même données sources,
   juste deux échelles d'affichage du même NQ.

   Fluidité : même mécanique que le terminal (index.html pollQuote /
   dash.html mountCard.tick) -- un setData() complet UNIQUEMENT au
   changement d'intervalle / resync périodique, et entre-temps un
   series.update() par tick sur la seule bougie courante, glissée vers le
   nouveau prix via animatePrice() (ui.js, easeOutCubic) au lieu d'un saut
   sec. C'est ce glissement qui donne l'effet "prix qui coule" du terminal
   au lieu d'un téléport à chaque poll. */
function makeHolder(hostId, target, scaleQ){
  const box = document.getElementById(hostId);
  const chart = LightweightCharts.createChart(box, {
    layout:{background:{type:"solid", color:"transparent"}, textColor:COL.muted,
            fontFamily:"IBM Plex Mono, monospace", fontSize:10},
    grid:{vertLines:{color:"rgba(255,255,255,.03)"}, horzLines:{color:"rgba(255,255,255,.03)"}},
    rightPriceScale:{borderColor:COL.line},
    timeScale:{borderColor:COL.line, timeVisible:true, secondsVisible:false},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal,
      vertLine:{color:COL.faint, width:1, style:LightweightCharts.LineStyle.Dashed},
      horzLine:{color:COL.faint, width:1, style:LightweightCharts.LineStyle.Dashed}},
  });
  const series = chart.addCandlestickSeries({
    upColor:COL.up, downColor:COL.dn, borderVisible:false,
    wickUpColor:COL.up, wickDownColor:COL.dn,
    priceLineColor:PREFS.px, priceLineWidth:2,
    priceLineStyle:LightweightCharts.LineStyle.Dashed,
  });
  const h = {chart, series, box, target, scaleQ, iv:"5m", lastBar:null, _anim:null};
  new ResizeObserver(() => chart.applyOptions({width: box.clientWidth, height: box.clientHeight}))
    .observe(box);
  return h;
}
const NQ = makeHolder("chartNQ", "NQ", "");
const IDX = makeHolder("chartIdx", "NQ", "&scale=idx");

/* Historique : /api/nqohlc (TradingView, cf. api/gex.py _tv_ohlc_bars) --
   plus /api/chart (Yahoo, delayed ~10min). NQ et NAS100 partagent la même
   source CME_MINI:NQ1! ; NAS100 est juste décalé du BASIS courant (même
   principe que le tick live, cf. plus bas). Si nqohlc échoue (cookie
   expiré, etc.), on retombe sur /api/chart pour ne pas laisser le chart
   vide -- dégradé, mais pas cassé. */
async function loadBars(h){
  try{
    const r = await fetch(`/api/nqohlc?interval=${h.iv}`);
    const d = await r.json();
    if (r.ok && !d.error && d.bars && d.bars.length){
      let bars = d.bars.map(b => ({time: tzShift(b.time), open: b.open, high: b.high,
                                    low: b.low, close: b.close}));
      if (h === IDX) bars = bars.map(b => ({...b, open: b.open - BASIS, high: b.high - BASIS,
                                             low: b.low - BASIS, close: b.close - BASIS}));
      if (h._anim){ cancelAnimationFrame(h._anim); h._anim = null; }
      h.series.setData(bars);
      h.lastBar = bars[bars.length - 1] || null;
      return;
    }
  }catch(_){}
  // Fallback Yahoo (delayed) -- même logique que la version précédente.
  try{
    const [chartRes, quoteRes] = await Promise.all([
      fetch(`/api/chart?target=${h.target}&interval=${h.iv}${h.scaleQ}`).then(r => r.json()),
      fetch(`/api/quote?target=${h.target}${h.scaleQ}`).then(r => r.json()).catch(() => null),
    ]);
    if (chartRes.error || !chartRes.bars) return;
    let bars = chartRes.bars.map(b => ({...b, time: tzShift(b.time)}));
    if (quoteRes && quoteRes.price != null && bars.length){
      const sec = IV_SEC[h.iv];
      const nowB = Math.floor(tzShift(Date.now() / 1000) / sec) * sec;
      const lastB = bars[bars.length - 1];
      if (lastB && nowB > lastB.time){
        bars = bars.concat([{time: nowB, open: quoteRes.price, high: quoteRes.price,
                              low: quoteRes.price, close: quoteRes.price}]);
      }
    }
    if (h._anim){ cancelAnimationFrame(h._anim); h._anim = null; }
    h.series.setData(bars);
    h.lastBar = bars[bars.length - 1] || null;
  }catch(_){}
}

/* Tick léger : un seul /api/quote, jamais /api/chart -- la bougie courante
   glisse vers le nouveau prix (ou une nouvelle bougie s'ouvre si le bucket
   a changé), sans jamais recharger tout l'historique. Source du tick :
   /api/nqlive (TradingView, ~1 update/s) quand il répond -- BEAUCOUP plus
   proche du prix réel que /api/quote (Yahoo, delayed ~10min, cf.
   conversation) qui ne sert plus qu'au resync périodique et au fallback si
   nqlive tombe. */
function applyTick(h, p){
  if (!h.series || !h.lastBar || p == null || !isFinite(p)) return;
  const sec = IV_SEC[h.iv];
  const bucket = Math.floor(tzShift(Date.now() / 1000) / sec) * sec;
  if (bucket > h.lastBar.time){
    if (h._anim){ cancelAnimationFrame(h._anim); h._anim = null; }
    const prevClose = h.lastBar.close;
    h.lastBar = {time: bucket, open: prevClose, high: Math.max(prevClose, p),
                 low: Math.min(prevClose, p), close: p};
    h.series.update(h.lastBar);
  }else{
    h.lastBar.high = Math.max(h.lastBar.high, p);
    h.lastBar.low = Math.min(h.lastBar.low, p);
    // Anim raccourcie (700ms) vs le terminal (900-1100ms) : la cadence de
    // tick est ~2-3x plus rapide ici (1s), une anim trop longue ferait
    // s'empiler les glissements au lieu de coller au prix.
    animatePrice(h, h.series, h.lastBar, p, 700);
  }
}

/* Fallback /api/quote (Yahoo) par chart -- ne tourne QUE si /api/nqlive est
   indisponible (NQ_LIVE_OK=false), pour ne jamais faire lutter deux sources
   de prix sur la même bougie. */
async function pollQuoteFallback(h){
  if (!h.series || !h.lastBar || document.hidden) return;
  try{
    const r = await fetch(`/api/quote?target=${h.target}${h.scaleQ}`);
    const d = await r.json();
    if (r.ok && d.price != null) applyTick(h, d.price);
  }catch(_){}
}

// Écart future/indice (NQ - NAS100), recalé à chaque resync (30s) --
// bouge lentement (portage), donc l'appliquer à un prix NQ vieux d'1s max
// reste juste (même principe que la "basis gelée" du terminal, CLAUDE.md).
let BASIS = 0;
async function refreshBasis(){
  try{
    const [fut, idx] = await Promise.all([
      fetch("/api/quote?target=NQ").then(r => r.json()).catch(() => null),
      fetch("/api/quote?target=NQ&scale=idx").then(r => r.json()).catch(() => null),
    ]);
    if (fut && fut.price != null && idx && idx.price != null) BASIS = fut.price - idx.price;
  }catch(_){}
}

document.querySelectorAll(".seg[data-chart]").forEach(seg => {
  const h = seg.dataset.chart === "NQ" ? NQ : IDX;
  seg.querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.iv === h.iv) return;
    h.iv = b.dataset.iv;
    seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    loadBars(h);
  });
});

// refreshBasis() d'abord : le premier loadBars(IDX) doit décaler avec un
// BASIS déjà à jour, pas 0 (sinon flash NAS100 affichant les valeurs NQ
// brutes le temps du premier resync).
(async () => { await refreshBasis(); loadBars(NQ); loadBars(IDX); })();
setInterval(() => { if (!document.hidden){ refreshBasis().then(() => { loadBars(NQ); loadBars(IDX); }); } }, 30000);
setInterval(() => { if (!NQ_LIVE_OK){ pollQuoteFallback(NQ); pollQuoteFallback(IDX); } }, 2000);

/* Bandeau live NQ1! + source du tick des deux charts : un seul poll
   /api/nqlive (websocket TradingView côté serveur, cf. api/gex.py
   _tv_live_quote) alimente le badge ET applyTick(NQ/IDX) -- plus la cadence
   distincte à 1500ms d'avant, qui laissait les charts en retard sur le
   bandeau alors que la même donnée était déjà là. */
let liveLast = null, NQ_LIVE_OK = false;
async function pollLive(){
  const badge = document.getElementById("liveBadge");
  try{
    const r = await fetch("/api/nqlive");
    const d = await r.json();
    if (!r.ok || d.error || d.price == null){
      NQ_LIVE_OK = false;
      badge.textContent = "off"; badge.className = "livebadge off";
      return;
    }
    NQ_LIVE_OK = d.update_mode === "streaming";
    const priceEl = document.getElementById("livePrice");
    priceEl.textContent = d.price.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
    priceEl.className = "liveprice" + (liveLast != null ? (d.price > liveLast ? " up" : d.price < liveLast ? " down" : "") : "");
    liveLast = d.price;
    document.getElementById("liveCh").textContent = d.ch != null ? d.ch.toFixed(2) : "—";
    document.getElementById("liveVol").textContent = d.volume != null ? Math.round(d.volume).toLocaleString() : "—";
    badge.textContent = d.update_mode || "?";
    badge.className = "livebadge " + (d.update_mode === "streaming" ? "streaming" : "delayed");
    if (NQ_LIVE_OK){
      applyTick(NQ, d.price);
      applyTick(IDX, d.price - BASIS);
    }
  }catch(_){
    NQ_LIVE_OK = false;
    badge.textContent = "off"; badge.className = "livebadge off";
  }
}
pollLive();
setInterval(() => { if (!document.hidden) pollLive(); }, 1000);
</script>
</body>
</html>
