<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TheHub GEX Levels</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>TheHub <span class="accent">GEX Levels</span></h1>
      <button id="langBtn" class="lang" type="button">EN</button>
    </header>

    <label class="field">
      <span data-t="apiKeyLabel">Clé API personnelle</span>
      <div class="keyRow">
        <input id="apiKey" type="password" placeholder="colle ta clé ici" autocomplete="off" spellcheck="false">
        <button id="toggleShow" type="button" class="iconBtn" title="Afficher/masquer">👁</button>
      </div>
    </label>

    <div class="actions">
      <button id="testBtn" type="button" data-t="test">Tester la connexion</button>
      <button id="saveBtn" type="button" class="primary" data-t="save">Enregistrer</button>
    </div>

    <div id="testResult" class="result" hidden></div>

    <div class="row toggleRow">
      <span data-t="enabledLabel">Synchronisation active</span>
      <label class="switch">
        <input type="checkbox" id="enabledToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="statusBox">
      <div class="statusLine">
        <span data-t="lastSyncLabel">Dernière synchro</span> : <span id="lastSyncVal">—</span>
      </div>
      <div class="statusLine err" id="lastSyncErr" hidden></div>
    </div>

    <button id="syncBtn" type="button" class="secondary full" data-t="syncNowLabel">Synchroniser maintenant</button>

    <footer>
      <a id="whereKeyLink" href="https://gexdash.wealthbuilders.group/profile" target="_blank" rel="noopener" data-t="whereKeyLabel">Où trouver ma clé ?</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
