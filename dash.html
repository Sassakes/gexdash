<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheHub - GexDashboard</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/ui.js"></script>
<script src="/loader.js"></script>
<script src="/widget/flux-widget.js"></script>
<style>
  /* GARDE-FOU : l'attribut hidden doit toujours l'emporter sur une
     déclaration display: portée par un id ou une classe. */
  [hidden]{display:none !important}

  :root{
    --bg:#0A0A0C; --surface:#111114; --surface2:#16161A;
    --line:#212127; --line-strong:#2B2B33;
    --text:#ECEAE4; --muted:#8A8A94; --faint:#5C5C66;
    --gold:#F0B90B; --gold-soft:rgba(240,185,11,.13); --gold-glow:rgba(240,185,11,.32);
    --teal:#26A69A; --red:#EF5350;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --disp:"Space Grotesk", var(--mono);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  #empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:72px 20px; min-height:46vh;
  }
  #empty[hidden]{display:none}
  #empty .empty-t{font-family:var(--disp); font-size:16px; color:var(--text); letter-spacing:.01em}
  #empty .empty-s{color:var(--muted); font-size:12.5px; margin:6px 0 22px}
  .presets{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .presets button{
    background:var(--surface); border:1px solid var(--line-strong); color:var(--muted);
    font:inherit; font-size:12px; padding:10px 16px; cursor:pointer;
    transition:color .14s ease, border-color .14s ease, transform .14s ease;
  }
  .presets button:hover{color:var(--gold); border-color:var(--gold-glow); transform:translateY(-1px)}
  .ccount{
    font-size:10.5px; color:var(--faint); letter-spacing:.14em; text-transform:uppercase;
    padding:2px 9px; border:1px solid var(--line); border-radius:20px; white-space:nowrap;
  }
  body{
    background:
      radial-gradient(1100px 420px at 50% -180px, rgba(240,185,11,.055), transparent 62%),
      var(--bg);
    color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0 0 auto 0; height:1px; z-index:10;
    background:linear-gradient(90deg, transparent, var(--gold-glow), transparent);
  }
  main{max-width:none; margin:0; padding:26px 24px 56px}  /* plan de travail pleine largeur */
  a{color:var(--gold)}
  button, select{font-family:var(--mono)}
  header{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--line);
  }
  .mark{width:26px; height:26px; flex:none}
  header h1{
    font-family:var(--disp); font-size:15px; font-weight:700;
    letter-spacing:.2em; text-transform:uppercase; white-space:nowrap;
  }
  header h1 em{font-style:normal; color:var(--gold)}
  .topnav{margin-left:auto; display:flex; align-items:center; gap:4px}
  .topnav a{
    color:var(--muted); text-decoration:none; font-size:12px; padding:6px 10px;
    transition:color .12s ease; white-space:nowrap;
  }
  .topnav a:hover{color:var(--gold)}
  .addbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
  .addbar select{
    background:var(--surface2); border:1px solid var(--line); color:var(--text);
    font-size:12px; padding:8px 10px; cursor:pointer; min-height:36px;
  }
  .addwrap{position:relative}
  #addBtn{
    background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold);
    font-size:12px; font-weight:500; padding:8px 18px; cursor:pointer; min-height:36px;
  }
  #addBtn:hover{background:rgba(240,185,11,.24)}
  #addBtn.on{background:rgba(240,185,11,.3)}
  /* Popover d'ajout : un seul déclencheur au lieu de deux paires
     select+bouton — cliquer un format ajoute directement le chart avec le
     marché sélectionné (persistant tant que le popover reste ouvert dans la
     session), cliquer un panneau l'ajoute en un clic. */
  .addpop{
    position:absolute; top:calc(100% + 8px); left:0; z-index:30; width:250px;
    background:rgba(14,14,18,.97); border:1px solid var(--line-strong);
    box-shadow:0 14px 40px rgba(0,0,0,.7); padding:14px;
  }
  .pop-sec + .pop-sec{margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
  .pop-lab{
    font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
    margin-bottom:8px;
  }
  .chiprow{display:flex; flex-wrap:wrap; gap:6px}
  .chiprow.stack{flex-direction:column}
  .chip{
    background:var(--surface2); border:1px solid var(--line); color:var(--muted);
    font:inherit; font-size:12px; padding:7px 10px; cursor:pointer; flex:1 1 calc(25% - 5px);
    text-align:center; white-space:nowrap;
    transition:color .12s ease, border-color .12s ease, background .12s ease;
  }
  #ivChips .chip{flex-basis:calc(33.333% - 4px)}
  .chip:hover{color:var(--text); border-color:var(--line-strong)}
  .chip.on{
    color:var(--gold); border-color:rgba(240,185,11,.5);
    background:linear-gradient(180deg, rgba(240,185,11,.16), rgba(240,185,11,.07));
  }
  .chip.wide{flex:1 1 100%; text-align:left}
  .pop-authmsg{font-size:11.5px; color:var(--muted); line-height:1.5}
  .pop-authmsg a{color:var(--gold); text-decoration:none}
  .pop-authmsg a:hover{text-decoration:underline}
  #editBtn{
    background:var(--surface); border:1px solid var(--line-strong); color:var(--muted);
    font-size:12px; padding:8px 16px; cursor:pointer; min-height:36px;
    transition:color .12s ease, border-color .12s ease;
  }
  #editBtn:hover{color:var(--gold)}
  #editBtn.on{background:var(--gold-soft); color:var(--gold); border-color:var(--gold)}
  .hint{color:var(--faint); font-size:11.5px}
  #board{position:relative}
  .card{
    position:absolute; background:linear-gradient(180deg, #131317, #101013);
    border:1px solid var(--line);
  }
  .card .head{
    display:flex; align-items:center; gap:10px; height:37px;
    padding:0 12px; border-bottom:1px solid var(--line);
  }
  .card .head .t{
    font-family:var(--disp); font-size:10px; font-weight:600; letter-spacing:.18em;
    text-transform:uppercase; color:var(--gold);
  }
  .card .head .n{font-size:10.5px; color:var(--faint)}
  .cpanel{
    position:absolute; top:8px; right:8px; z-index:9; width:220px;
    background:rgba(14,14,18,.97); border:1px solid var(--line-strong);
    box-shadow:0 14px 40px rgba(0,0,0,.7); padding:12px; font-size:11px;
  }
  .cpanel .cp-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .cpanel .cp-head b{
    font-family:var(--disp); font-size:9.5px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--gold);
  }
  .cpanel .cp-x{background:none; border:none; color:var(--faint); cursor:pointer; font-size:13px}
  .cpanel .cp-x:hover{color:var(--text)}
  .cp-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; color:var(--muted)}
  .cp-sw{display:flex; gap:6px; align-items:center}
  .cpanel input[type=color]{
    width:22px; height:22px; padding:0; border:1px solid var(--line-strong);
    background:var(--surface2); cursor:pointer; border-radius:4px;
  }
  .cp-rst{
    width:100%; margin-top:8px; background:var(--surface2); border:1px solid var(--line);
    color:var(--muted); font:inherit; font-size:10.5px; padding:6px; cursor:pointer;
  }
  .cp-rst:hover{color:var(--gold)}
  #tzDash{
    background:var(--surface2); border:1px solid var(--line); color:var(--text);
    font-size:12px; padding:8px 10px; cursor:pointer; min-height:36px;
  }
  .cchips{display:inline-flex; gap:5px; margin-left:auto}
  .cchips button{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--surface2); border:1px solid var(--line); color:var(--faint);
    font:inherit; font-size:9px; letter-spacing:.06em; padding:3px 8px;
    cursor:pointer; transition:all .12s ease;
  }
  .cchips button:hover{color:var(--text)}
  .cchips button.on{
    color:var(--gold); border-color:rgba(240,185,11,.5);
    background:linear-gradient(180deg, rgba(240,185,11,.14), rgba(240,185,11,.06));
  }
  .cchips .led{width:5px; height:5px; border-radius:50%; background:#33333B; flex:none}
  .cchips button.on .led{background:var(--gold); box-shadow:0 0 5px var(--gold-glow)}
  /* même code couleur que le terminal : or = GEX, teal = EM, violet = Open */
  .cchips button[data-g="gex"] .led{background:rgba(240,185,11,.28)}
  .cchips button[data-g="gex"].on{color:#F0B90B; border-color:rgba(240,185,11,.5)}
  .cchips button[data-g="gex"].on .led{background:#F0B90B; box-shadow:0 0 6px rgba(240,185,11,.6)}
  .cchips button[data-g="em"] .led{background:rgba(38,166,154,.28)}
  .cchips button[data-g="em"].on{color:#26A69A; border-color:rgba(38,166,154,.5)}
  .cchips button[data-g="em"].on .led{background:#26A69A; box-shadow:0 0 6px rgba(38,166,154,.6)}
  .cchips button[data-g="open"] .led{background:rgba(139,92,246,.28)}
  .cchips button[data-g="open"].on{color:#8B5CF6; border-color:rgba(139,92,246,.5)}
  .cchips button[data-g="open"].on .led{background:#8B5CF6; box-shadow:0 0 6px rgba(139,92,246,.6)}
  .card .head .gh{display:flex}
  .card .head .gh .cgear{width:26px; height:26px; font-size:12px}
  .card .head .rm{
    background:none; border:none; color:var(--faint);
    font-size:13px; cursor:pointer; padding:4px 8px;
  }
  .card .head .rm:hover{color:var(--red)}
  /* Fenêtres d'information : même densité que les colonnes de /news, mais
     compactées pour tenir dans une carte du dashboard. */
  .newsbox{overflow:auto; -webkit-overflow-scrolling:touch}
  .nload{padding:20px; text-align:center; color:var(--faint); font-size:11px}
  .nitem{display:block; padding:8px 11px; border-bottom:1px solid var(--line);
    text-decoration:none; color:inherit}
  .nitem:hover{background:rgba(255,255,255,.03)}
  .nitem.hot{border-left:2px solid var(--red); background:rgba(239,83,80,.05)}
  .nitem .ntop{display:flex; align-items:center; gap:6px; margin-bottom:2px}
  .nitem .nsrc{font-size:8.5px; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); background:var(--surface2); padding:1px 5px; border-radius:2px}
  .nitem.hot .nsrc{color:var(--red)}
  .nitem .nago{margin-left:auto; font-size:9px; color:var(--faint);
    font-family:var(--mono)}
  .nitem .ntitle{font-size:11.5px; line-height:1.4; color:var(--text)}
  .mag7row{display:flex; align-items:center; gap:8px; padding:3px 10px;
    border-bottom:1px solid var(--line); font-family:var(--mono); font-size:10.5px;
    line-height:1.5}
  /* Colonnes fluides : les libellés du panorama sont plus longs que les
     tickers du MAG7, et des largeurs fixes faisaient déborder le texte hors
     de la carte dès qu'on la rétrécissait. */
  .mag7row .ms{color:var(--text); font-weight:600; flex:1 1 auto; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mag7row .mp{color:var(--muted); flex:0 0 auto; text-align:right}
  .mag7row .md{flex:0 0 auto; text-align:right; min-width:52px}
  .mag7row .md.up{color:var(--teal)} .mag7row .md.dn{color:var(--red)}
  .mag7sep{padding:4px 10px 3px; font-size:8.5px; letter-spacing:.13em;
    text-transform:uppercase; color:var(--faint); background:var(--surface2);
    border-top:1px solid var(--line-strong)}
  .mag7agg{display:flex; gap:12px; padding:5px 10px; background:var(--surface2);
    border-bottom:1px solid var(--line-strong); font-family:var(--mono); font-size:10.5px}
  .mag7agg span{color:var(--muted)} .mag7agg b{margin-left:5px}
  .mag7warn{padding:4px 10px; font-size:9.5px; color:var(--red);
    border-bottom:1px solid var(--line)}
  .ecowrap{height:100%; min-height:280px; overflow:auto;
    -webkit-overflow-scrolling:touch; display:flex}
  .ecowrap > *{flex:1 1 auto; width:100% !important; max-width:100% !important; min-width:0}
  .ecowrap iframe{border:0 !important; width:100% !important; height:100% !important;
    min-height:280px; display:block; flex:1 1 auto}

  /* Carte heatmap : même palette et même lecture que la page /heatmap,
     y compris le rectangle de prix qui glisse (.pxbox, porté tel quel de
     heatmap.html) plutôt que sauter d'un palier à l'autre. */
  .hmbox{position:relative; overflow:auto; -webkit-overflow-scrolling:touch}
  .cchips .hmnoise{font-size:11px; padding:2px 7px; line-height:1.4}
  .cchips .hmnoise.on{color:var(--gold); border-color:rgba(240,185,11,.5)}
  .hmload{padding:22px; text-align:center; color:var(--faint); font-size:11px}
  .hmt{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:9.5px}
  .hmt th{position:sticky; top:0; z-index:2; background:var(--surface2); color:var(--muted);
    font-size:8px; letter-spacing:.1em; font-weight:600; padding:4px 3px;
    border-bottom:1px solid var(--line-strong); text-transform:uppercase}
  .hmt th:first-child{text-align:right; padding-right:7px}
  .hmt td{padding:0 3px; height:17px; text-align:center; white-space:nowrap}
  .hmt td.k{text-align:right; padding-right:7px; color:var(--muted);
    border-right:1px solid var(--line)}
  .hmt tr.live td.k{color:var(--gold); font-weight:600}
  .hmt tr.live{background:transparent; position:relative; z-index:1}
  .hmt .cell{display:block; padding:2px 4px; border-radius:1px}
  .hmt .chip{font-size:6.5px; font-weight:600; padding:1px 2px; margin-right:3px;
    border:1px solid; border-radius:2px; letter-spacing:.02em; vertical-align:middle}
  .pxbox{position:absolute; left:0; right:0; z-index:0; pointer-events:none;
    border:1px solid var(--gold); border-radius:2px;
    background:rgba(240,185,11,.06); box-shadow:0 0 10px rgba(240,185,11,.16);
    transition:top .4s cubic-bezier(.22,.61,.36,1), height .2s ease; will-change:top}
  .pxbox.noanim{transition:none}
  /* Carte Flux : le widget public (widget/flux-widget.js) a son propre
     cadre/badge pensés pour un site tiers -- ici on le fond dans le chrome
     de la carte (bordure déjà posée par .card, pas de double-cadre) et on
     laisse son wrap (canvas) suivre la hauteur réelle de la carte au lieu
     du px figé passé à la construction, pour rester redimensionnable comme
     les autres cartes. */
  .card .thub-flux{height:100%; display:flex; flex-direction:column; border:0; background:transparent; overflow-y:auto}
  .card .thub-flux .tb,.card .thub-flux .tb2,.card .thub-flux .synth{flex:none}
  .card .thub-flux .wrap{flex:1 1 auto; height:auto !important; min-height:180px}
  .card .box{height:calc(100% - 37px); position:relative}
  body.editing .card{outline:1px dashed rgba(240,185,11,.55)}
  body.editing .card .head{cursor:grab}
  body.editing .card .box{pointer-events:none; opacity:.85}
  .card .rsz{
    position:absolute; right:0; bottom:0; width:18px; height:18px; display:none;
    cursor:nwse-resize; z-index:8;
    background:linear-gradient(135deg, transparent 50%, rgba(240,185,11,.7) 50%);
  }
  body.editing .card .rsz{display:block}
  .card.dragging{outline:1px dashed var(--gold); z-index:20; opacity:.92}
  #empty{
    color:var(--muted); padding:40px 16px; text-align:center;
    border:1px dashed var(--line); background:var(--surface);
  }
  @media(max-width:640px){
    .cchips button{min-height:34px; padding:5px 10px}
    .addbar select, #addBtn, #editBtn{min-height:42px; font-size:16px}
    .chip{min-height:42px; font-size:13.5px}
    .addpop{width:min(84vw, 270px)}
    .addbar{gap:6px}
    .card .head{flex-wrap:wrap; row-gap:6px}
    main{padding:16px 12px 40px}
    .topnav{width:100%; margin-left:0}
    #board{position:static}
    .card{position:static !important; width:auto !important; height:380px !important; margin-bottom:14px}
    /* Les fenêtres d'information sont des LISTES : 380px n'affiche que deux
       ou trois entrées et impose un défilement interne pénible au pouce.
       On leur donne plus de hauteur, et le calendrier davantage encore
       puisque le widget tiers a sa propre densité. */
    .card:has(.newsbox), .card.kind-news{height:520px !important}
    .card:has(.ecowrap), .card.kind-eco{height:600px !important}
    .newsbox{-webkit-overflow-scrolling:touch}
    .nitem{padding:11px 13px}
    .nitem .ntitle{font-size:12.5px; line-height:1.45}
    .mag7row{padding:10px 13px; font-size:12px}
    .card .rsz{display:none !important}
    #editBtn{display:none}
  }

  /* ═══════════════ couche de raffinement ═══════════════ */
  body{
    background:
      radial-gradient(1100px 420px at 50% -180px, rgba(240,185,11,.055), transparent 62%),
      radial-gradient(900px 500px at 50% 118%, rgba(38,166,154,.035), transparent 60%),
      var(--bg);
  }
  ::-webkit-scrollbar{width:9px; height:9px}
  ::-webkit-scrollbar-thumb{background:#26262E; border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#33333D}
  header h1 em{text-shadow:0 0 22px var(--gold-glow)}
  .topnav a{position:relative}
  .topnav a::after{
    content:""; position:absolute; left:10px; right:10px; bottom:3px; height:1px;
    background:var(--gold); transform:scaleX(0); transform-origin:left;
    transition:transform .16s ease;
  }
  .topnav a:hover::after{transform:scaleX(1)}
  .addbar select, #addBtn, #editBtn{min-height:36px}
  #addBtn{background:linear-gradient(180deg, rgba(240,185,11,.2), rgba(240,185,11,.1))}
  #addBtn:hover{background:linear-gradient(180deg, rgba(240,185,11,.3), rgba(240,185,11,.16))}
  #addBtn:active, #editBtn:active{transform:translateY(1px)}
  .card{
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 14px 34px -18px rgba(0,0,0,.65);
    transition:box-shadow .16s ease;
  }
  .card:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 18px 44px -18px rgba(0,0,0,.8)}
  .card .head{background:linear-gradient(180deg, rgba(255,255,255,.015), transparent)}
  .card.dragging{box-shadow:0 24px 60px -16px rgba(0,0,0,.85), 0 0 0 1px var(--gold-glow)}
  .card .rsz{
    background:linear-gradient(135deg, transparent 55%, var(--gold) 55%);
    opacity:.55; transition:opacity .12s ease;
  }
  .card .rsz:hover{opacity:1}
  /* la grille d'ancrage se révèle en mode édition (fond posé par JS) */
  body.editing #board{
    outline:1px dashed rgba(240,185,11,.18); outline-offset:8px;
  }
  #empty{letter-spacing:.02em}

  /* ═══════════════ couche premium ═══════════════ */
  html::before, html::after{
    content:""; position:fixed; z-index:-2; border-radius:50%;
    filter:blur(90px); pointer-events:none;
  }
  html::before{
    width:820px; height:520px; top:-260px; left:50%; margin-left:-500px;
    background:radial-gradient(closest-side, rgba(240,185,11,.13), transparent 70%);
    animation:drift1 46s ease-in-out infinite alternate;
  }
  html::after{
    width:760px; height:560px; bottom:-320px; right:-180px;
    background:radial-gradient(closest-side, rgba(38,166,154,.1), transparent 70%);
    animation:drift2 58s ease-in-out infinite alternate;
  }
  @keyframes drift1{from{transform:translate(0,0)} to{transform:translate(140px,60px) scale(1.1)}}
  @keyframes drift2{from{transform:translate(0,0)} to{transform:translate(-120px,-80px) scale(1.08)}}
  body{
    background:
      linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px),
      radial-gradient(1100px 420px at 50% -180px, rgba(240,185,11,.05), transparent 62%),
      var(--bg);
    background-size:44px 44px, 44px 44px, auto, auto;
  }
  .card{
    background:
      linear-gradient(180deg, #141419, #101014) padding-box,
      linear-gradient(135deg, rgba(240,185,11,.3), rgba(255,255,255,.05) 40%,
                      rgba(38,166,154,.2)) border-box;
    border:1px solid transparent;
  }

  header h1 em{
    background:linear-gradient(100deg, var(--gold) 42%, #FFE9A3 50%, var(--gold) 58%);
    background-size:230% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 7s ease-in-out infinite;
  }

<script>
"use strict";
const $ = id => document.getElementById(id);
const C = {gold:"#F0B90B", muted:"#8A8A94", faint:"#5C5C66", line:"#212127", text:"#ECEAE4",
           teal:"#26A69A", red:"#EF5350"};
const KIND_COLOR = {res:C.teal, sup:C.red, res0:C.teal, sup0:C.red, flip:C.gold, hgex:C.gold,
                    gpos:C.teal, gneg:C.red, emh:C.text, eml:C.text,
                    ivh:C.muted, ivl:C.muted, mpain:C.gold, emb:C.text};
const SHORT = {res:"CW", sup:"PW", res0:"CW0", sup0:"PW0", flip:"Flip", hgex:"HGEX",
               emh:"EM+", eml:"EM−", mpain:"MP"};
const DASH_KINDS = ["flip","emh","eml","res0","sup0","mpain","emb","ivh","ivl"];
const GROUP_KINDS = {
  gex: ["res","sup","res0","sup0","flip","hgex","gpos","gneg","mpain"],
  em:  ["emh","eml","emb","ivh","ivl"],
};
/* PREFS, tzShift, TZ_CITY, CANDLE_PAIRS, PRICE_COLORS : fournis par /ui.js */
let LANG = "fr";
try{ LANG = localStorage.getItem("gexLang") || "fr"; }catch(_){}
const TXT = {
  fr: {mkts:"Panorama marché", needAuth:"Connexion requise", goSignIn:"Se connecter", noise:"Zones fortes", hmNone:"Données indisponibles", title:"Mon dashboard", term:"Terminal", heat:"Heatmap", news:"News", doc:"Doc", add:"Ajouter",
       mkt:"Marché", fmt:"Format · clique pour ajouter", panelsLab:"Panneaux",
       pnFeed:"Flux direct", pnNews:"Actualités", pnEco:"Calendrier éco", pnMag:"MAG7 + marchés",
       hint:"Disposition sauvegardée dans ce navigateur.",
       empty:"Aucun chart pour l'instant — clique sur + Ajouter ci-dessus.",
       feedKo:"flux indisponible", edit:"Éditer", done:"Terminé",
       magIncomplete:"Échantillon incomplet"},
  en: {mkts:"Market snapshot", needAuth:"Sign-in required", goSignIn:"Sign in", noise:"Strong zones", hmNone:"Data unavailable", title:"My dashboard", term:"Terminal", heat:"Heatmap", news:"News", doc:"Doc", add:"Add",
       mkt:"Market", fmt:"Format · click to add", panelsLab:"Panels",
       pnFeed:"Live feed", pnNews:"News", pnEco:"Economic calendar", pnMag:"MAG7 + markets",
       hint:"Layout saved in this browser.",
       empty:"No charts yet — click + Add above.",
       feedKo:"feed unavailable", edit:"Edit", done:"Done",
       magIncomplete:"Incomplete sample"},
};
const tx = k => (TXT[LANG] || TXT.fr)[k];

let CARDS = [];
try{ CARDS = JSON.parse(localStorage.getItem("gexDashCards")||"[]"); }catch(_){}
if (!Array.isArray(CARDS)) CARDS = [];
CARDS.forEach((c, i) => {
  if (c.w == null){ c.x = (i % 2) * 6; c.y = Math.floor(i / 2) * 4; c.w = 6; c.h = 4; }
  if (!c.lv) c.lv = {gex: true, em: true, open: true};
  if (c.lv.xr == null) c.lv.xr = false;
  if (!c.type) c.type = "chart";
  if (!c.id) c.id = "c" + Date.now().toString(36) + i;
  if (!c.colors) c.colors = {up: PREFS.up, dn: PREFS.dn, px: PREFS.px};
});
function saveCards(){ try{ localStorage.setItem("gexDashCards", JSON.stringify(CARDS)); }catch(_){} }

/* ---- plan de travail : grille 12 colonnes, ancrage au lâcher ---- */
const COLS = 12, CELL_H = 82, GAP = 12;
let EDIT = false;
const board = $("board");
function cellW(){ return (board.clientWidth - GAP * (COLS - 1)) / COLS; }
function px(c){
  const cw = cellW();
  return {left: c.x * (cw + GAP), top: c.y * (CELL_H + GAP),
          width: c.w * cw + (c.w - 1) * GAP, height: c.h * CELL_H + (c.h - 1) * GAP};
}
function clampCard(c){
  // 2 colonnes minimum au lieu de 3 : une liste de valeurs comme le MAG7 n'a
  // pas besoin du quart de l'écran, et la contrainte empêchait de la réduire.
  c.w = Math.max(2, Math.min(COLS, Math.round(c.w)));
  c.h = Math.max(2, Math.round(c.h));
  c.x = Math.max(0, Math.min(COLS - c.w, Math.round(c.x)));
  c.y = Math.max(0, Math.round(c.y));
}
function boardHeight(){
  const rows = CARDS.reduce((m, c) => Math.max(m, c.y + c.h), 0);
  board.style.height = (rows * (CELL_H + GAP) + 40) + "px";
}

const LEVELS_CACHE = {};
async function getLevels(target){
  if (LEVELS_CACHE[target] !== undefined) return LEVELS_CACHE[target];
  try{
    const d = await (await fetch("levels.json?target=" + target + "&t=" + Date.now())).json();
    LEVELS_CACHE[target] = d && !d.error ? d : null;
  }catch(_){ LEVELS_CACHE[target] = null; }
  return LEVELS_CACHE[target];
}

const IVSEC = {"1m":60, "5m":300, "15m":900};
/* ---- chaque carte est INDÉPENDANTE : ses couleurs, ses filtres,
        son timer et ses lignes vivent sur son élément DOM ---- */

const pxTxt = p => Math.round(p).toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g, " ");
const IS_TOUCH = matchMedia("(hover: none), (pointer: coarse)").matches;
const LV_MAJOR = ["res","sup","flip","res0","sup0","hgex"];

/* Les lignes ne portent aucune étiquette : tout passe par le calque
   drawCardLabels (mêmes règles que la page principale). */
function drawGroup(series, pay, grp, meta){
  const lines = [];
  if (!pay) return lines;
  const push = (price, color, code, tier, solid) => {
    lines.push(series.createPriceLine({
      price, color, lineWidth: 1,
      lineStyle: solid ? LightweightCharts.LineStyle.Solid
                       : LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: false, title: ""}));
    if (meta) meta.push({price, color, code, tier, grp});
  };
  if (grp === "open"){
    if (pay.open_grid){
      push(pay.open_grid.anchor, C.gold, "Open", 3, true);
      for (const g of pay.open_grid.levels){
        const m = g.mult != null ? g.mult : "";
        push(g.up,   "#EF5350", "σ+" + m, 3, false);
        push(g.down, "#26A69A", "σ−" + m, 3, false);
      }
    }
    return lines;
  }
  for (const L of pay.levels || []){
    const g = GROUP_KINDS.gex.includes(L.kind) ? "gex"
            : GROUP_KINDS.em.includes(L.kind) ? "em" : null;
    if (g !== grp) continue;
    push(L.price_nq, KIND_COLOR[L.kind] || C.muted, SHORT[L.kind] || "",
         LV_MAJOR.includes(L.kind) ? 1 : 2, !DASH_KINDS.includes(L.kind));
  }
  return lines;
}

/* Étiquettes de niveaux d'une carte : mêmes règles que la page principale
   (priorité, anti-collision, décalage au-dessus/en dessous de l'ancre,
   révélation au survol ou au toucher). */
function drawCardLabels(host){
  const cv = host._lblCv, box = host.querySelector(".box");
  if (!cv || !host._chart || !host._series || !box) return;
  const w = host._cvW || box.clientWidth, h = host._cvH || box.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + "px"; cv.style.height = h + "px";
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const meta = (host._lvMeta || []).filter(m => !host._cfg || host._cfg.lv[m.grp]);
  if (!meta.length) return;

  const fs = PREFS.lblSize || 10;
  const padX = 6, rowH = fs + 9, bh = fs + 7, off = bh / 2 + 3;
  const MODE = PREFS.lblMode || (IS_TOUCH ? "all" : "auto");
  let scaleW = 58;
  try{ scaleW = host._chart.priceScale("right").width() || 58; }catch(_){}
  const xRight = w - scaleW - 5;
  const hoverY = host._hoverY;
  const ref = (host._pay && host._pay.open_grid) ? host._pay.open_grid.anchor
            : (host._lastClose != null ? host._lastClose : null);

  const items = [];
  for (const m of meta){
    const y = host._series.priceToCoordinate(m.price);
    if (y == null || y < 6 || y > h - 6) continue;
    const above = ref == null ? true : m.price >= ref;
    const ly = Math.min(h - bh / 2 - 2, Math.max(bh / 2 + 2, y + (above ? -off : off)));
    items.push({...m, y, ly, near: false});
  }
  if (!items.length) return;

  const REACH = IS_TOUCH ? 34 : 22;
  let anyHover = false;
  if (hoverY != null){
    let best = null, bd = REACH;
    for (const it of items){
      const d = Math.abs(it.y - hoverY);
      if (d < bd || (d === bd && best && it.tier < best.tier)){ bd = d; best = it; }
    }
    if (best){ best.near = true; anyHover = true; }
  }

  const order = [...items].sort((a, b) =>
    (b.near - a.near) || (a.tier - b.tier) || (a.y - b.y));
  const taken = [], placed = new Set();
  const fits = y => !taken.some(t => Math.abs(t - y) < rowH);
  for (const it of order){
    if (anyHover){
      if (!it.near && MODE !== "all") continue;
      if (!it.near && MODE === "all" && !fits(it.ly)) continue;
    } else {
      if (MODE === "hover") continue;
      if (!fits(it.ly)) continue;
    }
    taken.push(it.ly); placed.add(it);
  }

  ctx.font = `${fs}px "IBM Plex Mono", monospace`;
  ctx.textBaseline = "middle";
  for (const it of items){
    if (!placed.has(it)){
      ctx.globalAlpha = anyHover ? 0.12 : 0.5;
      ctx.fillStyle = it.color;
      ctx.beginPath(); ctx.arc(xRight - 2, it.y, 1.7, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    const txt = (it.code ? it.code + "  " : "") + pxTxt(it.price);
    const bw = ctx.measureText(txt).width + padX * 2 + 3;
    const x0 = xRight - bw, y0 = it.ly - bh / 2;
    ctx.globalAlpha = it.near ? 1 : (anyHover ? 0.35 : (it.tier === 3 ? 0.62 : 0.9));
    ctx.fillStyle = "rgba(12,12,15,.9)";
    ctx.fillRect(x0, y0, bw, bh);
    ctx.fillStyle = it.color;
    ctx.fillRect(x0, y0, 2, bh);
    ctx.fillStyle = it.near ? "#FFFFFF" : it.color;
    ctx.fillText(txt, x0 + padX + 3, it.ly + 0.5);
  }
  ctx.globalAlpha = 1;
}

function toggleGroup(card, cfg, grp, btn){
  cfg.lv[grp] = !cfg.lv[grp];
  btn.classList.toggle("on", cfg.lv[grp]);
  saveCards();
  if (!card._series) return;
  if (!cfg.lv[grp]){
    (card._lines[grp] || []).forEach(l => { try{ card._series.removePriceLine(l); }catch(_){} });
    card._lines[grp] = [];
    card._lvMeta = (card._lvMeta || []).filter(m => m.grp !== grp);
  } else {
    const meta = [];
    card._lines[grp] = drawGroup(card._series, card._pay, grp, meta);
    card._lvMeta = (card._lvMeta || []).filter(m => m.grp !== grp).concat(meta);
  }
  drawCardLabels(card);
}

/* panneau de réglages À L'INTÉRIEUR de la carte (couleurs de CE chart) */
function buildCardPanel(host, cfg){
  const gh = host.querySelector(".gh");
  const btn = document.createElement("button");
  btn.className = "cgear";
  btn.textContent = "⚙";
  btn.title = "Réglages de ce chart";
  gh.appendChild(btn);
  const panel = document.createElement("div");
  panel.className = "cpanel";
  panel.hidden = true;
  host.querySelector(".box").appendChild(panel);

  function renderPanel(){
    const pairs = CANDLE_PAIRS.map(([a, b], k) =>
      `<button class="dsw pair${cfg.colors.up===a && cfg.colors.dn===b ? " on" : ""}"
        style="--a:${a};--b:${b}" data-pair="${k}"></button>`).join("");
    const prices = PRICE_COLORS.map(c =>
      `<button class="dsw${cfg.colors.px===c ? " on" : ""}" style="background:${c}" data-px="${c}"></button>`).join("");
    panel.innerHTML = `
      <div class="cp-head"><b>${cfg.t} · ${cfg.iv}</b><button class="cp-x">✕</button></div>
      <div class="cp-row"><span>Palette</span><span class="cp-sw">${pairs}</span></div>
      <div class="cp-row"><span>Corps ↑</span><input type="color" data-k="up" value="${cfg.colors.up}"></div>
      <div class="cp-row"><span>Corps ↓</span><input type="color" data-k="dn" value="${cfg.colors.dn}"></div>
      <div class="cp-row"><span>Prix</span><span class="cp-sw">${prices}<input type="color" data-k="px" value="${cfg.colors.px}"></span></div>
      <button class="cp-rst">↺ Réinitialiser</button>`;
    const apply = () => {
      host._series.applyOptions({upColor: cfg.colors.up, downColor: cfg.colors.dn,
        wickUpColor: cfg.colors.up, wickDownColor: cfg.colors.dn,
        priceLineColor: cfg.colors.px});
      saveCards();
    };
    panel.querySelector(".cp-x").onclick = () => { panel.hidden = true; };
    panel.querySelectorAll("[data-pair]").forEach(b => b.onclick = () => {
      const [a, c2] = CANDLE_PAIRS[+b.dataset.pair];
      cfg.colors.up = a; cfg.colors.dn = c2; apply(); renderPanel();
    });
    panel.querySelectorAll("[data-px]").forEach(b => b.onclick = () => {
      cfg.colors.px = b.dataset.px; apply(); renderPanel();
    });
    panel.querySelectorAll("input[data-k]").forEach(inp => inp.oninput = () => {
      cfg.colors[inp.dataset.k] = inp.value; apply();
    });
    panel.querySelector(".cp-rst").onclick = () => {
      cfg.colors = {up: "#26A69A", dn: "#EF5350", px: "#FFD84D"};
      apply(); renderPanel();
    };
  }
  btn.onclick = () => {
    if (panel.hidden){ renderPanel(); panel.hidden = false; }
    else panel.hidden = true;
  };
}

/* Heatmap GEX par strike : bandes horizontales sous les bougies.
   Vert = gamma positif (aimant), rouge = négatif (accélérant),
   opacité = magnitude relative au strike dominant. */
function bandHalf(series, prof){
  const gaps = [];
  for (let i = 1; i < prof.length; i++){
    const a = series.priceToCoordinate(prof[i - 1][0]);
    const b = series.priceToCoordinate(prof[i][0]);
    if (a != null && b != null) gaps.push(Math.abs(b - a));
  }
  if (!gaps.length) return 4;
  gaps.sort((x, y) => x - y);
  return Math.max(1.5, Math.min(10, gaps[Math.floor(gaps.length / 2)] / 2 - 0.6));
}
/* Style X-Ray THE HUB : échelle par PERCENTILES (immunisée aux walls
   géants qui écrasaient tout), rangées de points RONDS dont le diamètre,
   la densité et l'alpha portent le rang d'exposition, halo lumineux sur
   le top décile. rk(g) -> rang [0..1] dans la distribution du jour. */
/* Séparateurs de session sur les cartes chart (canvas sous les bougies) */
function drawSess(host){
  const cv = host._heat, chart = host._chart;
  if (!cv || !chart) return;
  const box = host.querySelector(".box");
  const w = box.clientWidth, h = box.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + "px"; cv.style.height = h + "px";
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  drawSessionLines(ctx, chart, host._times, w, h);
}

async function mountCard(cfg, host){
  const box = host.querySelector(".box"), note = host.querySelector(".n");
  const heat = document.createElement("canvas");
  heat.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:0";
  box.appendChild(heat);                       // AVANT le chart -> rendu dessous
  host._heat = heat;
  const chart = LightweightCharts.createChart(box, {
    layout:{background:{type:"solid", color:"transparent"}, textColor:C.muted,
            fontFamily:"IBM Plex Mono, monospace",
            fontSize: PREFS.lblSize || 10},
    grid:{vertLines:{color:"rgba(255,255,255,.03)"}, horzLines:{color:"rgba(255,255,255,.03)"}},
    crosshair:{mode: LightweightCharts.CrosshairMode.Normal},
    rightPriceScale:{borderColor:C.line},
    timeScale:{borderColor:C.line, timeVisible:true, secondsVisible:false},
  });
  const series = chart.addCandlestickSeries({
    upColor: cfg.colors.up, downColor: cfg.colors.dn, borderVisible: false,
    wickUpColor: cfg.colors.up, wickDownColor: cfg.colors.dn,
    priceLineColor: cfg.colors.px, priceLineWidth: 2,
    priceLineStyle: LightweightCharts.LineStyle.Dashed,
  });
  host._chart = chart; host._series = series; host._lines = {}; host._pay = null;
  host._cfg = cfg; host._lvMeta = [];
  const lbl = document.createElement("canvas");
  lbl.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:3";
  box.appendChild(lbl);
  host._lblCv = lbl;
  new ResizeObserver(es => {
    const r = es[0].contentRect;
    if (r.width && r.height){ host._cvW = r.width; host._cvH = r.height; }
    drawCardLabels(host);
  }).observe(box);
  chart.timeScale().subscribeVisibleLogicalRangeChange(
    () => { drawSess(host); drawCardLabels(host); });
  chart.subscribeCrosshairMove(p => {
    const y = p && p.point ? p.point.y : null;
    if (y === host._hoverY) return;
    host._hoverY = y; drawCardLabels(host);
  });
  const touchAt = e => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    host._hoverY = t.clientY - box.getBoundingClientRect().top;
    drawCardLabels(host);
    clearTimeout(host._touchT);
    host._touchT = setTimeout(() => { host._hoverY = null; drawCardLabels(host); }, 3000);
  };
  box.addEventListener("touchstart", touchAt, {passive: true});
  box.addEventListener("touchmove", touchAt, {passive: true});
  /* suivi de l'échelle de prix (drag/zoom n'émettent aucun événement) */
  const geoTick = () => {
    if (host.isConnected && host._series && (host._lvMeta || []).length){
      const y = host._series.priceToCoordinate(host._lvMeta[0].price);
      const sig = `${y}|${box.clientHeight}|${box.clientWidth}`;
      if (sig !== host._geoSig){ host._geoSig = sig; drawCardLabels(host); }
    }
    if (host.isConnected) host._geoRaf = requestAnimationFrame(geoTick);
  };
  geoTick();
  new ResizeObserver(() => {
    chart.applyOptions({width: box.clientWidth, height: box.clientHeight});
    drawSess(host); drawCardLabels(host);
  }).observe(box);
  buildCardPanel(host, cfg);

  // Rond de marque unifié : masque la grille vide (sans bougies) le temps du
  // tout premier fetch de la carte, plutôt que de laisser un chart nu.
  const _t0 = PageLoader.begin(box);
  let lastBar = null;

  // Bougies + cotation courante, en parallèle (même mécanisme que loadBars()
  // côté terminal, index.html) : on synthétise la bougie du bucket ACTUEL si
  // /api/chart est en retard sur l'horloge, pour ne jamais démarrer -- ou
  // reprendre après une réouverture de marché, cf. armCard(reopen) plus bas
  // -- décalé d'un bucket avant le premier tick.
  const loadBars = async (reopen) => {
    const [cr, qr] = await Promise.all([
      fetch(`/api/chart?target=${cfg.t}&interval=${cfg.iv}`).then(r => r.json())
        .catch(e => ({error: e.message})),
      fetch(`/api/quote?target=${cfg.t}`).then(r => r.json()).catch(() => null),
    ]);
    if (cr.error) throw new Error(cr.error);
    const bars = cr.bars.map(b => ({...b, time: tzShift(b.time)}));
    if (qr && qr.price != null && bars.length){
      const sec0 = IVSEC[cfg.iv];
      const nowB = Math.floor(tzShift(Date.now() / 1000) / sec0) * sec0;
      const lastB = bars[bars.length - 1];
      if (nowB > lastB.time)
        bars.push({time: nowB, open: qr.price, high: qr.price, low: qr.price, close: qr.price});
    }
    series.setData(bars);
    lastBar = bars[bars.length - 1] || null;
    if (bars.length){
      const nView = {"1m": 180, "5m": 150, "15m": 120}[cfg.iv] || 150;
      host._reframe = () => {
        chart.priceScale("right").applyOptions({autoScale: true});
        chart.timeScale().setVisibleLogicalRange({
          from: Math.max(0, bars.length - nView), to: bars.length + 6});
      };
      host._reframe();
      if (!reopen){
        let tries = 0;
        const settle = () => { host._reframe(); if (++tries < 15) requestAnimationFrame(settle); };
        requestAnimationFrame(settle);
      }
    } else chart.timeScale().fitContent();
    note.textContent = TZ_CITY[PREFS.tz] || PREFS.tz;
    if (!host._draw)
      host._draw = attachDrawTools(box, chart, series,
                                   "gexDraw:card:" + cfg.id, IVSEC[cfg.iv]);
    if (bars.length) host._draw.setBars(bars.map(b => b.time), IVSEC[cfg.iv]);
    host._times = bars.map(b => b.time);
    host._ivSec = IVSEC[cfg.iv];
  };

  try{
    await loadBars();
    box.addEventListener("dblclick", () => host._reframe && host._reframe());
  }catch(e){ note.textContent = tx("feedKo"); await PageLoader.end(box, _t0); return; }

  host._pay = await getLevels(cfg.t);
  host._lvMeta = [];
  for (const grp of ["gex", "em", "open"])
    if (cfg.lv[grp]){
      const meta = [];
      host._lines[grp] = drawGroup(series, host._pay, grp, meta);
      host._lvMeta = host._lvMeta.concat(meta);
    }
  drawSess(host);
  drawCardLabels(host);
  await PageLoader.end(box, _t0);

  const tick = async () => {
    if (document.hidden || !lastBar) return;
    try{
      const r = await fetch(`/api/quote?target=${cfg.t}`);
      const d = await r.json();
      if (!r.ok || d.price == null) return;
      const sec = IVSEC[cfg.iv], p = d.price;
      // bucket sur l'HORLOGE, jamais sur d.time (parfois le regularMarketTime
      // du future différé ~10 min) -- même raison que pollQuote() côté
      // terminal : la bougie live doit suivre l'heure réelle, pas la source.
      const bucket = Math.floor(tzShift(Date.now() / 1000) / sec) * sec;
      if (bucket > lastBar.time){
        if (host._anim) cancelAnimationFrame(host._anim);
        host._anim = null;
        // nouvelle bougie : on fige la précédente à son close, on ouvre la
        // neuve dessus -- pas un doji plat au prix courant (même logique que
        // pollQuote() côté terminal).
        const prevClose = lastBar.close;
        lastBar = {time:bucket, open:prevClose, high:Math.max(prevClose, p),
                   low:Math.min(prevClose, p), close:p};
        series.update(lastBar);
      } else {
        animatePrice(host, series, lastBar, p, 900);
      }
      if (host._draw) host._draw.pushTime(lastBar.time);
      if (host._times && lastBar.time > host._times[host._times.length - 1])
        host._times.push(lastBar.time);
    }catch(_){}
  };
  // départ décalé par carte : pas de rafale simultanée quand la grille est pleine
  const offset = (Array.prototype.indexOf.call(board.children, host) % 8) * 250;
  host._timer = null;
  const armCard = (reopen) => {
    clearInterval(host._timer);
    const prevMs = host._pollMs;
    host._pollMs = marketPollMs();
    if (host._pollMs){
      // Passage fermé -> ouvert : le prix seul ne suffit pas, il faut aussi
      // RECHARGER LES BOUGIES -- sans ça, une carte restée au premier plan
      // pendant la bascule garde des bougies basse-fidélité synthétisées à
      // partir des polls de 60s d'avant l'ouverture (même logique que
      // armPoll(reopen) côté terminal, index.html).
      if (reopen && !prevMs) loadBars(true).catch(() => {});
      tick(); host._timer = setInterval(tick, host._pollMs);
    }
  };
  setTimeout(() => { if (host.isConnected) armCard(); }, offset);
  clearInterval(host._pollWatch);
  host._pollWatch = setInterval(() => {
    if (!host.isConnected){ clearInterval(host._pollWatch); clearInterval(host._timer); return; }
    if (marketPollMs() !== host._pollMs) armCard(true);
  }, 60000);
}

/* ═══ FENÊTRES D'INFORMATION ═══════════════════════════════════════════
   Flux direct, actualités, calendrier et MAG7 — mêmes sources que la page
   /news, dans une carte redimensionnable. Les données sont protégées par la
   session : une carte affichée sans compte connecté invite à se connecter
   plutôt que de rester vide sans explication. */
function nEsc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function nAgo(ts){
  if (!ts) return "";
  const d = Math.floor(Date.now() / 1000) - ts;
  if (d < 60) return d + "s";
  if (d < 3600) return Math.floor(d / 60) + "min";
  if (d < 86400) return Math.floor(d / 3600) + "h";
  return Math.floor(d / 86400) + "j";
}
function nPct(v){
  if (v == null) return "—";
  const s = v >= 0 ? "+" : "";
  return `<span class="md ${v >= 0 ? "up" : "dn"}">${s}${Number(v).toFixed(2)}%</span>`;
}

async function mountNewsCard(cfg, host){
  const box = host.querySelector(".newsbox");

  // le calendrier est un widget tiers : il gère son propre rafraîchissement
  if (cfg.iv === "eco"){
    box.innerHTML = `<div class="ecowrap" id="eco_${Math.random().toString(36).slice(2, 9)}"></div>`;
    const wrap = box.querySelector(".ecowrap");
    const build = () => {
      if (!window.FJWidgets) return;
      requestAnimationFrame(() => {
      const r = wrap.getBoundingClientRect();
      try{
        new window.FJWidgets.createWidget({
          container: wrap.id, mode: "standard",
          width: Math.max(240, Math.round(r.width)) + "px",
          height: Math.max(280, Math.round(r.height)) + "px",
          backColor: "111114", fontColor: "8A8A94", widgetType: "ECOCAL",
        });
      }catch(e){ wrap.innerHTML = `<div class="nload">${tx("hmNone")}</div>`; }
      });
    };
    if (window.FJWidgets) return build();
    const s = document.createElement("script");
    s.id = "FJ-Widgets";
    s.src = "https://feed.financialjuice.com/widgets/widgets.js?r="
          + Math.floor(Math.random() * 10000);
    s.onload = build;
    s.onerror = () => { wrap.innerHTML = `<div class="nload">${tx("hmNone")}</div>`; };
    document.head.appendChild(s);
    return;
  }

  const TYPE = {feed: "feed", news: "news", mag7: "mag7"}[cfg.iv];
  // Le parametre envoye au serveur differe de la cle lue dans la reponse pour
  // "news" : /api/news?type=fj tente FinancialJuice puis Finnhub puis le flux
  // institutionnel en repli -- MEME pipeline que loadNews() sur /news -- mais
  // repond toujours sous la cle "news". ?type=news tout court retombe sur
  // UNIQUEMENT Finnhub "general", un flux distinct qui affichait des depeches
  // differentes de l'onglet "Market News" de /news pour la meme carte.
  const QTYPE = TYPE === "news" ? "fj" : TYPE;
  const draw = async () => {
    try{
      const r = await fetch(`/api/news?type=${QTYPE}`);
      if (r.status === 401){
        box.innerHTML = `<div class="nload">${tx("needAuth")}
          <br><a href="/" style="color:var(--gold)">${tx("goSignIn")}</a></div>`;
        clearInterval(host._timer);       // inutile d'insister sans session
        return;
      }
      const d = await r.json();
      if (TYPE === "mag7"){
        const rows = (d.mag7 && d.mag7.rows) || [];
        const agg = (d.mag7 && d.mag7.agg) || {};
        if (!rows.length){ box.innerHTML = `<div class="nload">${tx("hmNone")}</div>`; return; }
        const mkts = (d.mag7 && d.mag7.markets) || [];
        const line = x => `<div class="mag7row">
            <span class="ms">${nEsc(x.name || x.sym)}</span>
            <span class="mp">${x.price != null ? Number(x.price).toFixed(2) : "—"}</span>
            ${nPct(x.dp)}</div>`;
        box.innerHTML =
          `<div class="mag7agg"><span>J${nPct(agg.day)}</span>
             <span>S${nPct(agg.week)}</span><span>M${nPct(agg.month)}</span></div>` +
          (agg.complete === false
            ? `<div class="mag7warn">${tx("magIncomplete")}</div>` : "") +
          rows.map(line).join("") +
          (mkts.length ? `<div class="mag7sep">${tx("mkts")}</div>`
                         + mkts.map(line).join("") : "");
        return;
      }
      const rows = d[TYPE] || [];
      if (!rows.length){ box.innerHTML = `<div class="nload">${tx("hmNone")}</div>`; return; }
      box.innerHTML = rows.slice(0, 60).map(x => {
        const hot = x.impact === "high";
        const title = x.title || x.headline || "";
        const ts = x.ts || x.datetime || 0;
        return `<a class="nitem${hot ? " hot" : ""}" href="${nEsc(x.url || "#")}"
          target="_blank" rel="noopener">
          <div class="ntop"><span class="nsrc">${nEsc(x.source || "")}</span>
          <span class="nago">${nAgo(ts)}</span></div>
          <div class="ntitle">${nEsc(title)}</div></a>`;
      }).join("");
    }catch(e){
      box.innerHTML = `<div class="nload">${tx("hmNone")}</div>`;
    }
  };
  host._redraw = draw;
  await draw();
  // même rythme que la page /news, et rien le week-end
  const MS = {feed: 120000, news: 90000, mag7: 30000}[cfg.iv] || 120000;
  const arm = () => {
    clearInterval(host._timer);
    if (marketPollMs()) host._timer = setInterval(draw, MS);
  };
  arm();
  clearInterval(host._pollWatch);
  host._pollWatch = setInterval(() => {
    if (!host.isConnected){ clearInterval(host._pollWatch); clearInterval(host._timer); return; }
    arm();
  }, 120000);
}

/* ═══ CARTE HEATMAP ═══════════════════════════════════════════════════
   Même source (/api/matrix), même palette et mêmes repères que la page
   /heatmap -- signe $, glow doré p99, puces CW/PW/Flip et ligne de prix qui
   GLISSE d'un palier à l'autre au lieu de sauter (cf. movePxLine ci-dessous,
   porté de heatmap.html). Les contrôles fins (échelle, fenêtre, expiries)
   restent sur la page dédiée — ici on veut un coup d'œil fidèle, pas un
   poste de pilotage. */
function hmCellStyle(v, p95, p99){
  if (!v || !p95) return "";
  const x = Math.pow(Math.min(1, Math.abs(v) / p95), 0.7);
  if (Math.abs(v) >= p99)
    return "background:#F0B90B;color:#0A0A0C;font-weight:600;box-shadow:0 0 9px rgba(240,185,11,.45)";
  if (v > 0){
    const R = Math.round(15 + 23*x), G = Math.round(26 + 140*x), B = Math.round(24 + 130*x);
    return `background:rgb(${R},${G},${B});color:${x > .5 ? "#05140F" : "#7FCDBF"}`;
  }
  const R = Math.round(28 + 211*x), G = Math.round(18 + 65*x), B = Math.round(18 + 62*x);
  return `background:rgb(${R},${G},${B});color:${x > .5 ? "#1C0707" : "#E6A6A4"}`;
}
function hmFmt(v){
  const a = Math.abs(v), s = v < 0 ? "-" : "";
  if (a >= 1e9) return `$${s}${(a/1e9).toFixed(1)}B`;
  if (a >= 1e6) return `$${s}${(a/1e6).toFixed(0)}M`;
  if (a >= 1e3) return `$${s}${(a/1e3).toFixed(0)}k`;
  return a > 0 ? `$${s}${a.toFixed(0)}` : "";
}
/* Niveaux CW/PW/Flip en puces sur la colonne prix -- même parsing (chaîne
   Pine, pas le tableau levels[]) et mêmes libellés que heatmap.html, pour
   que les deux vues restent visuellement identiques. */
const HM_KEEP = {res:1, sup:1, res0:1, sup0:1, flip:1, mpain:1, emh:1, eml:1};
const HM_KCOL = {res:"#26A69A", sup:"#EF5350", res0:"#26A69A", sup0:"#EF5350",
                 flip:"#F0B90B", mpain:"#B9903A", emh:"#8A8A94", eml:"#8A8A94"};
const HM_KLAB = {res:"CW", sup:"PW", res0:"CW·0", sup0:"PW·0", flip:"FLIP", mpain:"MP", emh:"EM▲", eml:"EM▼"};
function hmParseLevels(pine){
  if (!pine) return [];
  return pine.split(";").map(s => { const [p, , k] = s.split(","); return {price: +p, kind: k}; })
             .filter(x => HM_KEEP[x.kind] && isFinite(x.price));
}
/* Carte Flux : délègue entièrement au widget public (widget/flux-widget.js,
   cf. docs/BRIEF-flux.md) plutôt qu'au flux-panel.js du terminal -- celui-ci
   est un singleton à globals FLUX_* pensé pour une seule instance par page,
   incompatible avec plusieurs cartes Flux simultanées sur le dashboard. Le
   widget, lui, porte son état par instance (this.state/this.gfx/this.dom) et
   s'y prête nativement. apiBase:"" + pas de clé -> lit /api/flow en direct
   (même origine, même route que le terminal, aucune auth requise côté
   Flux), au lieu du chemin public /api/embed/flow réservé aux sites tiers.
   advanced:true (réservé aux pages même origine, cf. widget) déverrouille
   CW/PW/Flip (toujours affichés), strikes et historique de séance (bascules
   Strikes/Historique, état persisté par carte comme le mode gamma/vanna/
   charm) et un panneau de synthèse volontairement minimal -- verdict +
   lecture gamma/vanna/charm, pas le détail calls/puts. Feature parity avec
   flux-panel.js hormis la ligne de prix réalisé, qui demanderait un flux de
   bougies séparé que cette carte n'a pas. */
function mountFlux(cfg, host){
  const box = host.querySelector(".box");
  const w = new TheHubFluxWidget(box, {
    target: cfg.t, mode: cfg.fluxMode || "gamma", lang: LANG,
    apiBase: "", showBadge: false, height: 240, advanced: true,
    strikesOn: cfg.strikesOn !== false, histOn: cfg.histOn !== false,
  });
  const setMode0 = w.setMode.bind(w);
  w.setMode = m => { setMode0(m); cfg.fluxMode = m; saveCards(); };
  const setStrikes0 = w.setStrikesOn.bind(w);
  w.setStrikesOn = on => { setStrikes0(on); cfg.strikesOn = on; saveCards(); };
  const setHist0 = w.setHistOn.bind(w);
  w.setHistOn = on => { setHist0(on); cfg.histOn = on; saveCards(); };
  host._fluxWidget = w;
}

async function mountHeatCard(cfg, host){
  const box = host.querySelector(".hmbox");
  const tbl = box.querySelector(".hmtbl");

  /* Rectangle de prix qui GLISSE d'un palier à l'autre (transition CSS,
     cf. .pxbox) au lieu de sauter -- porté de movePxLine (heatmap.html).
     .pxbox vit dans .hmbox, JAMAIS dans .hmtbl (dont l'innerHTML est
     réécrit à chaque tir) : sans cette séparation il serait recréé à
     chaque poll et perdrait la transition. */
  function movePxLine(price){
    if (price == null) return;
    const rows = [...tbl.querySelectorAll("tr[data-p]")];
    if (!rows.length) return;
    let best = null, bd = Infinity;
    for (const r of rows){
      const d = Math.abs(+r.dataset.p - price);
      if (d < bd){ bd = d; best = r; }
    }
    if (!best) return;
    let pbox = box.querySelector(".pxbox");
    if (!pbox){
      pbox = document.createElement("div");
      pbox.className = "pxbox noanim";
      box.appendChild(pbox);
      requestAnimationFrame(() => requestAnimationFrame(() => pbox.classList.remove("noanim")));
    }
    pbox.style.top = best.offsetTop + "px";
    pbox.style.height = best.offsetHeight + "px";
    const cur = tbl.querySelector("tr.live");
    if (cur !== best){
      if (cur) cur.classList.remove("live");
      best.classList.add("live");
    }
  }

  const draw = async () => {
    try{
      const [m, q, lv] = await Promise.all([
        fetch(`/api/matrix?target=${cfg.t}`).then(r => r.json()).catch(() => null),
        fetch(`/api/quote?target=${cfg.t}`).then(r => r.json()).catch(() => null),
        getLevels(cfg.t),
      ]);
      if (!m || !m.rows || !m.rows.length){
        tbl.innerHTML = `<div class="hmload">${tx("hmNone")}</div>`;
        return;
      }
      const price = (q && q.price) || m.spot;
      const nc = m.cols.length;
      const p95 = [], p99 = [];
      for (let c = 0; c < nc; c++){
        const mags = m.rows.map(r => Math.abs(r.v[c])).filter(x => x > 0).sort((a, b) => a - b);
        const at = t => mags.length ? mags[Math.min(mags.length - 1, Math.floor(mags.length * t))] : 0;
        p95.push(at(.95)); p99.push(at(.99));
      }
      /* Seuil « zones fortes » calculé sur les magnitudes DU MARCHÉ affiché :
         un seuil en dollars ne vaut pas pour NQ, ES et SPX à la fois. */
      let flt = 0;
      if (cfg.nz){
        const all = [];
        for (const r of m.rows) for (let c = 0; c < nc; c++){
          const v = Math.abs(r.v[c] || 0); if (v > 0) all.push(v);
        }
        all.sort((a, b) => a - b);
        flt = all.length ? all[Math.min(all.length - 1, Math.floor(all.length * 0.70))] : 0;
      }
      // Puces CW/PW/Flip : niveau -> ligne de prix la plus proche.
      const chipByRow = {};
      if (lv && lv.pine) hmParseLevels(lv.pine).forEach(lvl => {
        let bi = -1, bd = Infinity;
        m.rows.forEach((r, i) => { const dd = Math.abs(r.p - lvl.price); if (dd < bd){ bd = dd; bi = i; } });
        if (bi >= 0) (chipByRow[bi] = chipByRow[bi] || []).push(lvl);
      });
      let h = `<table class="hmt"><thead><tr><th>PX</th>`
            + m.cols.map(c => `<th>${c.label}</th>`).join("") + `</tr></thead><tbody>`;
      m.rows.forEach((r, i) => {
        const chips = (chipByRow[i] || []).map(lvl =>
          `<span class="chip" style="color:${HM_KCOL[lvl.kind]};border-color:${HM_KCOL[lvl.kind]}55">${HM_KLAB[lvl.kind]}</span>`).join("");
        h += `<tr data-p="${r.p}"><td class="k">${chips}${Math.round(r.p).toLocaleString("fr-FR")}</td>`;
        for (let c = 0; c < nc; c++){
          const v = r.v[c];
          const dim = flt && Math.abs(v || 0) < flt;
          h += `<td><span class="cell" style="${dim ? "opacity:.12" : hmCellStyle(v, p95[c], p99[c])}">${dim ? "" : hmFmt(v)}</span></td>`;
        }
        h += `</tr>`;
      });
      tbl.innerHTML = h + `</tbody></table>`;
      movePxLine(price);
      const lr = tbl.querySelector("tr.live");
      if (lr) box.scrollTop = lr.offsetTop - box.clientHeight / 2 + lr.offsetHeight / 2;
      const n = host.querySelector(".n");
      if (n) n.textContent = price ? Math.round(price).toLocaleString("fr-FR") : "";
    }catch(e){
      tbl.innerHTML = `<div class="hmload">${tx("hmNone")}</div>`;
    }
  };
  host._redraw = draw;
  await draw();

  // même rythme que le reste : rien le week-end, lent hors séance. Deux
  // horloges séparées, comme heatmap.html : le rectangle de prix glisse au
  // rythme du quote (3 s en séance), la grille (recalcul gamma complet) se
  // reconstruit bien moins souvent -- sans ça le rectangle sauterait par
  // à-coups toutes les 20 s au lieu de suivre le prix en continu.
  const armQuote = () => {
    clearInterval(host._qtimer);
    const ms = marketPollMs();
    if (ms) host._qtimer = setInterval(async () => {
      try{
        const q = await fetch(`/api/quote?target=${cfg.t}`).then(r => r.json());
        if (q && q.price){
          movePxLine(q.price);
          const n = host.querySelector(".n");
          if (n) n.textContent = Math.round(q.price).toLocaleString("fr-FR");
        }
      }catch(_){}
    }, ms <= 3000 ? 3000 : ms);
  };
  const arm = () => {
    clearInterval(host._timer);
    const ms = marketPollMs();
    // aligné sur la page heatmap : 20 s en séance, sinon le rythme général
    if (ms) host._timer = setInterval(draw, ms <= 3000 ? 20000 : Math.max(ms, 60000));
  };
  arm(); armQuote();
  clearInterval(host._pollWatch);
  host._pollWatch = setInterval(() => {
    if (!host.isConnected){
      clearInterval(host._pollWatch); clearInterval(host._timer); clearInterval(host._qtimer);
      return;
    }
    arm(); armQuote();
  }, 120000);
}

function wireEdit(card, cfg){
  const handle = document.createElement("div");
  handle.className = "rsz";
  card.appendChild(handle);

  function startDrag(ev, mode){
    if (!EDIT) return;
    ev.preventDefault();
    card.classList.add("dragging");
    const cw = cellW();
    const startX = ev.clientX, startY = ev.clientY;
    const orig = {...cfg};
    function move(e){
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (mode === "move"){
        cfg.x = orig.x + dx / (cw + GAP);
        cfg.y = orig.y + dy / (CELL_H + GAP);
      } else {
        cfg.w = orig.w + dx / (cw + GAP);
        cfg.h = orig.h + dy / (CELL_H + GAP);
      }
      const p = px({x:Math.max(0,cfg.x), y:Math.max(0,cfg.y),
                    w:Math.max(3,cfg.w), h:Math.max(3,cfg.h)});
      Object.assign(card.style, {left:p.left+"px", top:p.top+"px",
                                 width:p.width+"px", height:p.height+"px"});
    }
    function up(){
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      card.classList.remove("dragging");
      clampCard(cfg);        // ancrage : snap sur la grille
      saveCards();
      layoutCard(card, cfg);
      boardHeight();
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }
  card.querySelector(".head").addEventListener("pointerdown", e => {
    if (e.target.tagName !== "BUTTON") startDrag(e, "move");
  });
  handle.addEventListener("pointerdown", e => startDrag(e, "resize"));
}

function layoutCard(card, cfg){
  const p = px(cfg);
  Object.assign(card.style, {left:p.left+"px", top:p.top+"px",
                             width:p.width+"px", height:p.height+"px"});
}

/* Dimensions par défaut selon le contenu : un graphique est large et bas, une
   liste est étroite et haute, le MAG7 tient en peu de lignes. Toutes les
   cartes naissaient en 6x4, d'où les grands espaces vides. */
const CARD_SIZE = {
  heat: {w: 5, h: 6},
  flux: {w: 7, h: 7},
  feed: {w: 4, h: 7},
  news: {w: 4, h: 7},
  eco:  {w: 4, h: 7},
  mag7: {w: 2, h: 5},
};
function cardSize(kind){
  return CARD_SIZE[kind] || {w: 6, h: 4};
}

function render(){
  for (const el of Array.from(board.children)){
    // Nettoyage EXHAUSTIF : _pollWatch et _geoRaf manquaient, donc chaque
    // ajout ou déplacement de carte laissait des surveillances actives sur
    // des éléments détachés — elles s'arrêtaient d'elles-mêmes, mais une à
    // deux minutes plus tard, en recréant des minuteurs entre-temps.
    if (el._timer) clearInterval(el._timer);
    if (el._timer2) clearInterval(el._timer2);
    if (el._qtimer) clearInterval(el._qtimer);
    if (el._pollWatch) clearInterval(el._pollWatch);
    if (el._geoSafe) clearInterval(el._geoSafe);
    if (el._touchT) clearTimeout(el._touchT);
    if (el._anim) cancelAnimationFrame(el._anim);
    if (el._geoRaf) cancelAnimationFrame(el._geoRaf);
    try{ el._chart && el._chart.remove(); }catch(_){}
    try{ el._fluxWidget && el._fluxWidget.destroy(); }catch(_){}
  }
  board.innerHTML = "";
  $("empty").hidden = CARDS.length > 0;
  const emptyT = $("empty").querySelector(".empty-t");
  if (emptyT) emptyT.textContent = tx("empty");
  CARDS.forEach((cfg, idx) => {
    clampCard(cfg);
    const card = document.createElement("div");
    card.className = "card";
    if (["feed", "news", "eco", "mag7"].includes(cfg.iv)){
      const TITLES = {feed: "▤ " + tx("pnFeed"), news: "▤ " + tx("pnNews"),
                      eco: "▤ " + tx("pnEco"), mag7: "▤ MAG7"};
      card.classList.add(cfg.iv === "eco" ? "kind-eco" : "kind-news");
      card.innerHTML = `<div class="head"><span class="t">${TITLES[cfg.iv]}</span>
        <span class="n"></span><span class="gh"></span>
        <button class="rm" title="Retirer">✕</button></div>
        <div class="box newsbox"><div class="nload">…</div></div>`;
      card.querySelector(".rm").onclick = () => {
        if (card._timer) clearInterval(card._timer);
        if (card._pollWatch) clearInterval(card._pollWatch);
        CARDS.splice(idx, 1); saveCards(); render();
      };
      board.appendChild(card);
      layoutCard(card, cfg);
      wireEdit(card, cfg);
      mountNewsCard(cfg, card);
      return;
    }
    if (cfg.iv === "heat"){
      card.innerHTML = `<div class="head"><span class="t">${cfg.t} · ▦ GEX</span>
        <span class="n"></span>
        <span class="cchips"><button class="hmnoise${cfg.nz ? " on" : ""}">⚡</button></span>
        <span class="gh"></span>
        <button class="rm" title="Retirer">✕</button></div>
        <div class="box hmbox"><div class="hmtbl"><div class="hmload">…</div></div></div>`;
      const nb = card.querySelector(".hmnoise");
      nb.title = tx("noise");
      nb.onclick = () => {
        cfg.nz = !cfg.nz;
        nb.classList.toggle("on", cfg.nz);
        saveCards();
        if (card._redraw) card._redraw();
      };
      card.querySelector(".rm").onclick = () => {
        if (card._timer) clearInterval(card._timer);
        if (card._qtimer) clearInterval(card._qtimer);
        if (card._pollWatch) clearInterval(card._pollWatch);
        CARDS.splice(idx, 1); saveCards(); render();
      };
      board.appendChild(card);
      layoutCard(card, cfg);
      wireEdit(card, cfg);
      mountHeatCard(cfg, card);
      return;
    }
    if (cfg.iv === "flux"){
      card.innerHTML = `<div class="head"><span class="t">${cfg.t} · Γ Flux</span>
        <span class="n"></span><span class="gh"></span>
        <button class="rm" title="Retirer">✕</button></div>
        <div class="box"></div>`;
      card.querySelector(".rm").onclick = () => {
        try{ card._fluxWidget && card._fluxWidget.destroy(); }catch(_){}
        CARDS.splice(idx, 1); saveCards(); render();
      };
      board.appendChild(card);
      layoutCard(card, cfg);
      wireEdit(card, cfg);
      mountFlux(cfg, card);
      return;
    }
    card.innerHTML = `<div class="head"><span class="t">${cfg.t} · ${cfg.iv}</span>
      <span class="n"></span>
      <span class="cchips">
        <button data-g="gex"><i class="led"></i>GEX</button>
        <button data-g="em"><i class="led"></i>EM</button>
        <button data-g="open"><i class="led"></i>Open</button>
      </span>
      <span class="gh"></span><button class="rm" title="Retirer">✕</button></div>
      <div class="box"></div>`;
    card.querySelectorAll(".cchips button").forEach(b => {
      b.classList.toggle("on", !!cfg.lv[b.dataset.g]);
      b.onclick = () => toggleGroup(card, cfg, b.dataset.g, b);   // CETTE carte uniquement
    });
    card.querySelector(".rm").onclick = () => {
      if (card._timer) clearInterval(card._timer);
      try{ card._chart && card._chart.remove(); }catch(_){}
      CARDS.splice(idx, 1); saveCards(); render();
    };
    board.appendChild(card);
    layoutCard(card, cfg);
    wireEdit(card, cfg);
    mountCard(cfg, card);
  });
  boardHeight();
  updateCount();
}

function firstFreeSpot(w, h){
  for (let y = 0; y < 60; y++)
    for (let x = 0; x <= COLS - w; x++){
      const clash = CARDS.some(c => x < c.x + c.w && x + w > c.x && y < c.y + c.h && y + h > c.y);
      if (!clash) return {x, y};
    }
  return {x: 0, y: 0};
}

/* ═══ Ajout de charts/panneaux : un seul bouton "+", un popover à puces ═══
   Avant : deux paires select+bouton côte à côte (chart, puis panneau),
   qui obligeaient à scanner trois menus déroulants avant de cliquer. Le
   marché reste sélectionné tant que le popover est ouvert (pas besoin de le
   re-choisir entre deux ajouts) ; cliquer un format ajoute directement le
   chart, cliquer un panneau l'ajoute directement — plus de bouton de
   confirmation séparé. */
let ADD_MKT = "NQ";
const addPop = $("addPop"), addBtn = $("addBtn");
function openAddPop(){ addPop.hidden = false; addBtn.classList.add("on"); }
function closeAddPop(){ addPop.hidden = true; addBtn.classList.remove("on"); }
addBtn.onclick = e => {
  e.stopPropagation();
  if (addPop.hidden) openAddPop(); else closeAddPop();
};
addPop.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => closeAddPop());
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAddPop(); });

function pushCard(t, iv){
  if (CARDS.length >= 10) return;
  const sz = cardSize(iv);
  const spot = firstFreeSpot(sz.w, sz.h);
  CARDS.push({t, iv, x: spot.x, y: spot.y, w: sz.w, h: sz.h,
              id: "c" + Date.now().toString(36) + Math.floor(Math.random() * 1e4),
              lv: {gex: true, em: true, open: true},
              colors: {up: PREFS.up, dn: PREFS.dn, px: PREFS.px}});
  saveCards(); render();
}

document.querySelectorAll("#mktChips .chip").forEach(b => b.onclick = () => {
  ADD_MKT = b.dataset.v;
  document.querySelectorAll("#mktChips .chip").forEach(x => x.classList.toggle("on", x === b));
});
document.querySelectorAll("#ivChips .chip").forEach(b => b.onclick = () => {
  pushCard(ADD_MKT, b.dataset.v);
  closeAddPop();
});
document.querySelectorAll("#panelChips .chip").forEach(b => b.onclick = () => {
  pushCard("NQ", b.dataset.v);
  closeAddPop();
});

/* Les panneaux d'information (dont Actualités marché) sont réservés aux
   membres. Avant : la section "Panneaux" entière disparaissait du popover
   sans trace tant que fetch("/api/auth") n'avait pas résolu "ok" -- un
   visiteur dont la session avait expiré (ou qui arrivait sur /dash sans être
   jamais passé par la connexion du terminal, cf. index.html #authBtn, que
   /dash n'a pas) ne voyait tout simplement plus l'option, sans indice pour
   comprendre pourquoi ni comment la récupérer. On affiche maintenant TOUJOURS
   la section, avec soit les puces, soit un lien de connexion explicite vers
   le terminal (seul endroit où /dash permet de s'authentifier). */
(async function gatePanels(){
  let ok = false;
  try{ ok = (await fetch("/api/auth")).ok; }catch(_){}
  $("panelChips").hidden = !ok;
  $("panelAuthMsg").hidden = ok;
  const nl = $("navNews"); if (nl) nl.hidden = !ok;
})();


function paintBoardGrid(){
  if (EDIT){
    const cw = cellW();
    board.style.backgroundImage =
      "radial-gradient(circle, rgba(240,185,11,.22) 1px, transparent 1.6px)";
    board.style.backgroundSize = (cw + GAP) + "px " + (CELL_H + GAP) + "px";
    board.style.backgroundPosition = "-" + (GAP/2) + "px -" + (GAP/2) + "px";
  } else {
    board.style.backgroundImage = "";
  }
}

           {t:"SPX", iv:"5m", x:0, y:5, w:12, h:4}],

           {t:"NQ", iv:"15m", x:0, y:5, w:12, h:4}],
  // Desk complet : colonne charts (NQ 1m -> SPX 5m -> Heatmap NQ -> Flux NQ)
  // + colonne Flux direct pleine hauteur a droite -- le combo demande le

  context: [

  fluxfocus: [
    {t:"NQ", iv:"5m",   x:0, y:0,  w:7, h:5},

    {t:"NQ", iv:"news", x:0, y:12, w:12, h:6},
  ],
};
function applyPreset(name){
  const p = PRESETS[name]; if (!p) return;
  CARDS = p.map((c, i) => ({...c,
    id: "c" + Date.now().toString(36) + i,
    lv: {gex: true, em: true, open: true},
    colors: {up: PREFS.up, dn: PREFS.dn, px: PREFS.px}}));
  saveCards(); render();
}
document.querySelectorAll(".presets [data-preset]").forEach(b =>
  b.onclick = () => applyPreset(b.dataset.preset));

function updateCount(){
  const c = $("ccount");
  if (c) c.textContent = CARDS.length ? `${CARDS.length} chart${CARDS.length > 1 ? "s" : ""}` : "";
}

      if (document.hidden){ hiddenAt = Date.now(); return; }
      const away = hiddenAt ? Date.now() - hiddenAt : 0;
      hiddenAt = null;
      if (away > 60000 && marketPollMs()) render();   // rien à recharger le week-end
    });
  }
    render();
}
