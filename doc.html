<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheHub - Documentation</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* GARDE-FOU : l'attribut hidden doit toujours l'emporter. Sans cette règle,
     une déclaration display: sur un id ou une classe le neutralise — c'est ce
     qui affichait la fenêtre de connexion en permanence, sans pouvoir la
     fermer. Le !important est ici volontaire et sûr. */
  [hidden]{display:none !important}

  :root{
    --bg:#0A0A0C; --surface:#111114; --surface2:#16161A; --surface3:#1B1B20;
    --line:#212127; --line-strong:#2E2E36;
    --text:#ECEAE4; --muted:#8A8A94; --faint:#5C5C66;
    --gold:#F0B90B; --teal:#26A69A; --red:#EF5350; --blue:#5B8DEF;
    --mono:"IBM Plex Mono",monospace; --sans:"Space Grotesk",sans-serif;
  }
  *{box-sizing:border-box; margin:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.6}
  a{color:var(--gold)}

  /* ── barre du haut ── */
  header{
    display:flex; align-items:center; gap:12px; padding:13px 20px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30;
    background:rgba(10,10,12,.95); backdrop-filter:blur(10px);
  }
  header h1{font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; font-weight:600}
  header h1 b{color:var(--gold)}
  .nav{display:flex; gap:3px; margin-left:auto; align-items:center; flex-wrap:wrap}
  .nav a{color:var(--muted); font-size:12px; text-decoration:none; padding:6px 10px;
         border:1px solid transparent}
  .nav a:hover{color:var(--text); border-color:var(--line-strong); background:var(--surface2)}
  .lang{display:flex; border:1px solid var(--line-strong); margin-left:5px}
  .lang button{background:none; border:none; color:var(--muted); font:inherit;
               font-size:11px; padding:5px 10px; cursor:pointer}
  .lang button.on{background:var(--gold); color:#0A0A0C; font-weight:600}

  /* ── hero + compteurs ── */
  .hero{padding:30px 20px 4px; max-width:1180px; margin:0 auto}
  .hero h2{font-size:23px; font-weight:600; letter-spacing:-.01em}
  .hero p{color:var(--muted); font-size:14px; margin-top:7px; max-width:620px}
  .cds{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
       gap:11px; margin-top:22px}
  .cd{background:var(--surface); border:1px solid var(--line); padding:15px 17px;
      position:relative; overflow:hidden}
  .cd::after{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--gold)}
  .cd.b::after{background:var(--teal)}
  .cd .k{font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--faint)}
  .cd .n{font-family:var(--mono); font-size:25px; color:var(--gold); margin:5px 0 1px;
         font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .cd.b .n{color:var(--teal)}
  .cd .s{font-size:11.5px; color:var(--muted)}
  .cd .h{font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-top:2px}

  /* ── mise en page sommaire + contenu ── */
  .wrap{display:grid; grid-template-columns:216px 1fr; gap:34px;
        max-width:1180px; margin:0 auto; padding:26px 20px 90px; align-items:start}
  .toc{position:sticky; top:70px; max-height:calc(100vh - 92px); overflow-y:auto}
  .toc .lbl{font-size:9px; letter-spacing:.16em; text-transform:uppercase;
            color:var(--faint); padding:0 10px 8px}
  .toc a{display:flex; gap:9px; align-items:baseline; padding:7px 10px; font-size:12.5px;
         color:var(--muted); text-decoration:none; border-left:2px solid transparent}
  .toc a i{font-family:var(--mono); font-size:10px; color:var(--faint); font-style:normal}
  .toc a:hover{color:var(--text); background:var(--surface)}
  .toc a.on{color:var(--gold); border-left-color:var(--gold); background:var(--surface)}
  .toc a.on i{color:var(--gold)}

  /* ── sections ── */
  section{margin-bottom:16px; scroll-margin-top:74px;
          background:var(--surface); border:1px solid var(--line)}
  .shead{display:flex; align-items:center; gap:12px; padding:16px 22px;
         border-bottom:1px solid var(--line); background:var(--surface2)}
  .shead i{font-family:var(--mono); font-size:11px; color:var(--gold); font-style:normal;
           border:1px solid rgba(240,185,11,.35); padding:3px 8px}
  .shead h3{font-size:15px; font-weight:600; letter-spacing:.01em}
  .sbody{padding:20px 22px}
  .sbody > * + *{margin-top:14px}
  p.tx{font-size:13.5px; color:var(--muted); max-width:70ch}
  p.tx b, li b{color:var(--text); font-weight:600}
  code{font-family:var(--mono); font-size:12px; background:var(--surface3);
       border:1px solid var(--line-strong); padding:1px 6px; color:var(--text)}

  /* blocs : chips explicatifs */
  .chips{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:11px}
  .chip{background:var(--surface2); border:1px solid var(--line); padding:14px 16px}
  .chip .tg{font-family:var(--mono); font-size:11px; padding:2px 9px; border:1px solid;
            display:inline-block; margin-bottom:9px}
  .chip.g .tg{color:var(--gold); border-color:rgba(240,185,11,.5)}
  .chip.t .tg{color:var(--teal); border-color:rgba(38,166,154,.5)}
  .chip.r .tg{color:var(--red); border-color:rgba(239,83,80,.5)}
  .chip p{font-size:12.5px; color:var(--muted)}

  /* blocs : scénarios Flux (mini-chart + explication) -- même vocabulaire de
     badge que .chip, mais empilés (le SVG a besoin de toute la largeur pour
     rester lisible, contrairement aux chips texte-seul en grille) */
  .scen{display:flex; flex-direction:column; gap:14px}
  .scen-card{background:var(--surface2); border:1px solid var(--line); padding:14px 16px}
  .scen-card .tg{font-family:var(--mono); font-size:11px; padding:2px 9px; border:1px solid;
                 display:inline-block; margin-bottom:10px}
  .scen-card.t .tg{color:var(--teal); border-color:rgba(38,166,154,.5)}
  .scen-card.r .tg{color:var(--red); border-color:rgba(239,83,80,.5)}
  .scen-card.g .tg{color:var(--gold); border-color:rgba(240,185,11,.5)}
  .scen-card svg{width:100%; height:auto; display:block; background:#0C0C0F;
                 border:1px solid var(--line); margin:0 0 10px}
  .scen-card p{font-size:12.5px; color:var(--muted)}

  /* blocs : sélecteur de familles interactif */
  .fam{border:1px solid var(--line); background:var(--surface2)}
  .famtabs{display:flex; flex-wrap:wrap; gap:0; border-bottom:1px solid var(--line)}
  .famtabs button{
    flex:1 1 150px; background:none; border:none; border-bottom:2px solid transparent;
    color:var(--faint); font:inherit; font-size:12px; letter-spacing:.05em;
    padding:13px 14px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:9px; transition:all .14s ease;
  }
  .famtabs button i{width:8px; height:8px; border-radius:50%; background:currentColor;
                    opacity:.35; transition:opacity .14s ease}
  .famtabs button:hover{color:var(--text); background:rgba(255,255,255,.02)}
  .famtabs button.on{background:rgba(255,255,255,.03)}
  .famtabs button.on i{opacity:1; box-shadow:0 0 8px currentColor}
  .fampane{padding:16px 18px}
  .fampane .fx{font-size:13px; color:var(--muted); margin-bottom:14px; max-width:70ch}
  .fampane svg{width:100%; height:auto; display:block; background:#0C0C0F;
               border:1px solid var(--line)}
  .famcodes{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
            gap:8px; margin-top:14px}

  /* blocs : grille de codes */
  .codes{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:9px}
  .cx{display:flex; gap:12px; background:var(--surface2); border:1px solid var(--line);
      padding:11px 13px}
  .cx .kk{font-family:var(--mono); font-size:12px; color:var(--gold); min-width:52px;
          padding-top:1px}
  .cx .nn{font-size:12.5px; color:var(--text); font-weight:500}
  .cx .dd{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5}

  /* blocs : étapes */
  .steps{counter-reset:st}
  .steps li{list-style:none; counter-increment:st; position:relative;
            padding:11px 0 11px 42px; font-size:13px; color:var(--muted);
            border-bottom:1px solid rgba(255,255,255,.05)}
  .steps li:last-child{border-bottom:none}
  .steps li::before{content:counter(st); position:absolute; left:0; top:10px;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:11px; color:var(--gold);
    border:1px solid rgba(240,185,11,.35)}

  /* blocs : horloges */
  .clocks{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:11px}
  .clk{background:var(--surface2); border:1px solid var(--line); padding:15px 17px}
  .clk .hh{font-family:var(--mono); font-size:19px; color:var(--gold)}
  .clk.b .hh{color:var(--teal)}
  .clk .tt{font-size:12.5px; color:var(--text); font-weight:500; margin:2px 0 11px}
  .clk .rw{font-size:12px; color:var(--muted); padding:7px 0;
           border-top:1px solid rgba(255,255,255,.055)}
  .clk .rw span{display:block; font-size:9px; letter-spacing:.13em;
                text-transform:uppercase; color:var(--faint); margin-bottom:2px}

  /* blocs : liste simple */
  ul.pl{list-style:none}
  ul.pl li{font-size:13px; color:var(--muted); padding:6px 0 6px 17px; position:relative}
  ul.pl li::before{content:"—"; position:absolute; left:0; color:var(--faint)}

  /* blocs : note */
  .note{background:var(--surface2); border:1px solid var(--line);
        border-left:2px solid var(--gold); padding:13px 16px; font-size:12.5px;
        color:var(--muted)}

  /* blocs : accordéon */
  .faq{border:1px solid var(--line)}
  .faq details{border-bottom:1px solid var(--line)}
  .faq details:last-child{border-bottom:none}
  .faq summary{cursor:pointer; padding:13px 16px; font-size:13px; color:var(--text);
    list-style:none; display:flex; align-items:center; gap:11px; background:var(--surface2)}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::before{content:"+"; font-family:var(--mono); color:var(--gold); font-size:14px}
  .faq details[open] summary::before{content:"−"}
  .faq summary:hover{color:var(--gold)}
  .faq .ans{padding:2px 16px 15px 40px; font-size:12.5px; color:var(--muted)}

  footer{border-top:1px solid var(--line); padding:20px; text-align:center;
         color:var(--faint); font-size:11px}

  @media (max-width:560px){
    .hero{padding:20px 14px 2px}
    .hero h2{font-size:18px}
    .hero p{font-size:13px}
    .cds{gap:9px}
    .cd{padding:13px 14px}
    .cd .n{font-size:22px}
    .wrap{padding:16px 14px 60px}
    .shead{padding:13px 15px; gap:10px}
    .shead h3{font-size:14px}
    .sbody{padding:16px 15px}
    p.tx{font-size:13px}
    .famtabs button{flex:1 1 100%; justify-content:flex-start; padding:12px 15px}
    .famcodes, .codes, .chips, .clocks{grid-template-columns:1fr}
    .steps li{padding-left:38px; font-size:12.5px}
    .faq summary{padding:12px 14px; font-size:12.5px}
    .faq .ans{padding-left:36px}
    header{padding:11px 14px; gap:9px}
    header h1{font-size:11px; letter-spacing:.14em}
    .nav a{padding:6px 8px; font-size:11.5px}
  }
  @media (max-width:860px){
    .wrap{grid-template-columns:1fr; gap:18px}
    .toc{position:static; display:flex; gap:6px; overflow-x:auto; padding-bottom:6px}
    .toc .lbl{display:none}
    .toc a{border-left:none; border:1px solid var(--line-strong); white-space:nowrap;
           padding:6px 11px}
    .toc a.on{border-color:var(--gold)}
    .toc a i{display:none}
    .hero{padding-top:22px}
    .hero h2{font-size:20px}
  }
</style>

<script>
"use strict";
const $ = id => document.getElementById(id);
let LANG = "fr";
try{ LANG = localStorage.getItem("gexLang") || "fr"; }catch(_){}

/* ───── comptes à rebours (heure de Paris, lundi→vendredi) ───── */
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function parisParts(){
  const f = new Intl.DateTimeFormat("en-US", {timeZone:"Europe/Paris", hour12:false,
    weekday:"short", hour:"2-digit", minute:"2-digit", second:"2-digit"});
  const p = {};
  for (const x of f.formatToParts(new Date())) p[x.type] = x.value;
  return p;
}
function secsUntil(hh, mm){
  const p = parisParts();
  const now = (+p.hour % 24) * 3600 + (+p.minute) * 60 + (+p.second);
  let delta = hh * 3600 + mm * 60 - now;
  let d = WD.indexOf(p.weekday);
  if (delta <= 0){ delta += 86400; d = (d + 1) % 7; }
  while (d === 0 || d === 6){ delta += 86400; d = (d + 1) % 7; }
  return delta;
}
function fmtDur(s){
  const j = Math.floor(s / 86400); s %= 86400;
  const h = String(Math.floor(s / 3600)).padStart(2, "0"); s %= 3600;
  const m = String(Math.floor(s / 60)).padStart(2, "0");
  return (j ? j + (LANG === "fr" ? " j " : "d ") : "") + h + ":" + m + ":" +
         String(s % 60).padStart(2, "0");
}
function localOf(hh, mm){
  return new Date(Date.now() + secsUntil(hh, mm) * 1000)
    .toLocaleTimeString(LANG === "fr" ? "fr-FR" : "en-GB", {hour:"2-digit", minute:"2-digit"});
}
function tickCd(){
  const L = T[LANG];
  $("cd1").textContent = fmtDur(secsUntil(0, 11));
  $("cd2").textContent = fmtDur(secsUntil(15, 25));
  $("cd1h").textContent = L.cdLocal + " " + localOf(0, 11);
  $("cd2h").textContent = L.cdLocal + " " + localOf(15, 25);
}

/* ───── contenu structuré en blocs ───── */
const T = {
fr: {
  title:"Documentation", term:"Terminal", dash:"Dashboard", heat:"Heatmap",
  heroT:"Comment lire et utiliser le terminal",
  heroP:"Les niveaux, leur signification, l'export vers TradingView et le calendrier exact des mises à jour.",
  cd1k:"Prochain recalcul daily · Open + EM", cd1s:"00h11 Paris · lundi → vendredi",
  cd2k:"Prochaine publication gamma", cd2s:"15h25 Paris · lundi → vendredi",
  cdLocal:"chez toi :", toc:"Sommaire",
  foot:"gexdash · TheHub — niveaux fournis à titre informatif, ne constituent pas un conseil en investissement.",
  secs:[
  {id:"quoi", t:"À quoi ça sert", b:[
    {t:"p", x:"gexdash calcule chaque jour les <b>niveaux d'exposition gamma des dealers</b> pour le NQ, l'ES et le SPX, à partir des chaînes d'options du NDX et du SPX."},
    {t:"p", x:"Ce sont les prix où les market makers doivent couvrir leurs positions. C'est ce qui explique qu'ils agissent si souvent comme des <b>aimants</b> ou des <b>murs</b>."},
    {t:"note", x:"Les prix sont convertis à l'échelle du future via la <b>basis</b> (écart indice ↔ future), recalibrée automatiquement en continu : les niveaux tombent directement aux bons prix sur ton graphique NQ ou ES."}]},

  {id:"boutons", t:"Les trois familles de niveaux", b:[
    {t:"p", x:"Au-dessus du graphique, trois boutons activent chacun une famille. Chacune a sa <b>couleur</b>, reprise à l'identique sur le terminal et sur les cartes du dashboard. Clique une famille ci-dessous pour voir ce qu'elle trace."},
    {t:"families", items:[
      {k:"gex", tag:"GEX", x:"La structure gamma du moment, recalculée <b>une fois par jour</b> juste avant l'ouverture US. C'est la carte du terrain : où les market makers doivent couvrir, donc où le prix ralentit, rebondit ou accélère.",
       codes:[
        {k:"CW", n:"Call Wall", d:"Plus grosse concentration de gamma call : plafond, résistance de référence."},
        {k:"PW", n:"Put Wall", d:"Plus grosse concentration de gamma put : plancher, support de référence."},
        {k:"CW0 / PW0", n:"Walls 0DTE", d:"Mêmes murs, sur les options du jour uniquement. Très réactifs, décisifs en intraday."},
        {k:"Flip", n:"Gamma Flip", d:"Bascule gamma positif ↔ négatif. Au-dessus : volatilité amortie. En dessous : mouvements amplifiés."},
        {k:"HGEX", n:"High GEX", d:"Strike au gamma absolu maximal : zone de forte friction."},
        {k:"MP", n:"Max Pain", d:"Prix où le plus grand nombre d'options expirent sans valeur."}]},
      {k:"em", tag:"EM · 1D", x:"L'amplitude que le marché price pour la journée, dérivée de l'IV ATM (0,8σ) et centrée sur le Daily Open. Sortir de la bande signale une séance hors norme ; y revenir est le comportement le plus fréquent.",
       codes:[
        {k:"EM+ / EM−", n:"Expected Move", d:"Bornes de la journée « normale », calculées à l'ouverture et figées ensuite."},
        {k:"EM ±50%", n:"Demi-bande", d:"Repère intermédiaire : souvent atteint en séance calme."},
        {k:"EM ±150%", n:"Extension", d:"Au-delà : journée de forte expansion, régime différent."}]},
      {k:"open", tag:"Open", x:"La grille des multiples de σ ancrée sur l'<b>ouverture Globex</b>, où σ est l'écart-type implicite du jour. Elle mesure la distance parcourue depuis l'open — un repère purement statistique, indépendant du positionnement des dealers.",
       codes:[
        {k:"Open", n:"Daily Open", d:"Ouverture de la séance Globex : l'ancre de toute la grille."},
        {k:"σ±0.5", n:"Demi-écart-type", d:"Premier palier, franchi la plupart des séances."},
        {k:"σ±1", n:"Un écart-type", d:"Séance déjà large : environ deux tiers des jours restent dedans."},
        {k:"σ±2 → ±3", n:"Extrêmes", d:"Rarement atteints : journées de tendance ou d'événement."}]}]},
    {t:"note", x:"Chaque ligne porte son prix. Quand des niveaux se croisent, les plus importants restent affichés et les autres deviennent un point coloré : <b>approche la souris</b> (ou <b>touche l'écran</b> sur mobile) pour révéler celui que tu vises. Le tiroir ⚙ propose « Auto / Toujours / Au survol » et la taille du texte."}]},

  {id:"tv", t:"Exporter vers TradingView", b:[
    {t:"p", x:"Le terminal génère une <b>string Pine</b> contenant tous les niveaux du jour, à injecter dans l'indicateur <b>GEX Daily Levels</b>."},
    {t:"steps", items:[
      "Ajoute l'indicateur à ton graphique — lien <b>TradingView</b> dans la barre du haut.",
      "Sélectionne le bon marché (NQ / ES / SPX) : la string est spécifique à l'instrument.",
      "Clique <b>⧉ Pine string</b> en haut à droite du terminal : elle est copiée dans le presse-papier.",
      "Dans TradingView, ouvre les réglages de l'indicateur et colle-la dans le champ prévu.",
      "Valide : tous les niveaux s'affichent aux bons prix sur ton graphique."]},
    {t:"p", x:"À refaire <b>une fois par jour</b>, idéalement après la publication de 15h25."}]},

  {id:"dash", t:"Le dashboard", b:[
    {t:"p", x:"Plusieurs graphiques côte à côte — marchés et unités de temps différents, chacun avec ses propres niveaux."},
    {t:"ul", items:[
      "Ajoute une carte en choisissant marché et unité de temps, puis réorganise-les librement.",
      "Chaque carte a ses propres boutons GEX / EM / Open, indépendants des autres.",
      "<b>Outils de dessin</b> intégrés : tes tracés sont conservés d'une session à l'autre.",
      "<b>Double-clic</b> sur un graphique pour le recentrer sur le prix."]},
    {t:"p", x:"Les graphiques se recadrent automatiquement au changement de marché et rechargent les bougies manquées quand tu reviens sur l'onglet."}]},


  {id:"heat", t:"La heatmap", b:[
    {t:"p", x:"Une vue d'ensemble du gamma sur les <b>trois marchés en parallèle</b> (NQ, ES, SPX) : les <b>strikes en lignes</b>, les <b>échéances en colonnes</b> (0DTE, 1DTE… puis le cumul). L'intensité donne la magnitude — teal pour le gamma positif, rouge pour le négatif, or pour les extrêmes."},
    {t:"h", x:"Les contrôles"},
    {t:"codes", items:[
      {k:"Échelle", n:"Easy / Medium / Expert", d:"Regroupement des strikes : 20, 10 ou 5 points. Plus fin = plus de détail, plus large = les grandes masses ressortent."},
      {k:"Range", n:"±5 à ±100", d:"Amplitude affichée autour du prix. Resserre pour l'intraday, élargis pour voir les murs lointains."},
      {k:"Filtre", n:"Seuil de bruit", d:"Estompe les cellules sous le seuil choisi (±1M à ±50M) : seules les vraies zones restent lisibles."},
      {k:"Échéances", n:"Filtre de colonnes", d:"Isole une échéance — le 0DTE seul est souvent le plus parlant en séance."},
      {k:"Sync", n:"Verrou de défilement", d:"Fait défiler les trois marchés ensemble pour comparer les structures."},
      {k:"Overlay", n:"Niveaux GEX", d:"Superpose Call Wall, Put Wall, Flip, Max Pain et Expected Move sur l'échelle."}]},
    {t:"note", x:"Chaque grille défile <b>à l'intérieur</b> de son panneau et se recentre automatiquement sur le prix courant. Un compte à rebours indique le temps restant avant la prochaine ouverture US. Le bouton <b>?</b> rappelle la signification des couleurs à tout moment."},
    {t:"p", x:"C'est la vue à privilégier pour repérer <b>où la masse se concentre</b>, et surtout si un mur repose sur une seule échéance — donc fragile après son expiration — ou sur toutes à la fois."}]},

  {id:"portee", t:"Portée", b:[
    {t:"p", x:"La bande EM du jour est posée à l'ouverture et ne bouge plus : elle dit combien le marché est censé parcourir sur la séance. Mais elle ne dit pas ce qui reste possible <b>maintenant</b>. La portée répond à cette question : centrée sur le prix courant, elle se resserre au fil des heures."},
    {t:"p", x:"Deux sources de contraction sont prises en compte : le temps qui passe, et l'IV qui se comprime en séance."},
    {t:"h", x:"Comment le lire"},
    {t:"note", x:"Ce n'est <b>pas</b> un niveau à jouer — il suit le prix, on ne le touche jamais. C'est une jauge de distance encore atteignable, à croiser avec tes vrais niveaux."},
    {t:"chips", items:[
      {c:"r", tag:"Cible hors d'atteinte", x:"Il est 19h. Le Call Wall est 150 points au-dessus, la portée n'autorise plus que 80. La cible est inatteignable aujourd'hui : réduire l'objectif ou sortir, plutôt que d'attendre un mouvement que le marché n'a plus le carburant de faire."},
      {c:"t", tag:"Extension encore possible", x:"Il est 17h, le prix a déjà parcouru 76% de la bande du jour. La bande semble épuisée — mais la borne haute de la portée dépasse la borne haute de la bande. Le marché peut encore sortir de l'extension attendue : signature d'une journée de tendance, ne pas contrer."}]},
    {t:"p", x:"L'horloge n'est pas linéaire : la nuit Globex consomme peu de variance, l'ouverture cash et la clôture en brûlent l'essentiel. À midi il ne reste pas la moitié de la portée, mais environ 71%."}]},

  {id:"flux", t:"Flux", b:[
    {t:"p", x:"Le plus gros vendeur d'une séance est rarement directionnel : c'est un teneur de marché qui se couvre. Un client achète des puts, le dealer se retrouve long delta, il vend des futures pour rester neutre — et le prix baisse sans qu'une conviction soit en jeu."},
    {t:"p", x:"La vue Flux projette cette couverture sur une grille prix × temps : si le prix arrivait ici, à telle heure, quel flux les dealers seraient contraints d'exécuter."},
    {t:"h", x:"Deux zones, deux natures de données"},
    {t:"p", x:"Le panneau est coupé en deux de part et d'autre de \"maintenant\". À <b>gauche</b> : ce qui s'est réellement passé depuis l'ouverture — le prix (ligne blanche) et, bouton <b>Historique</b> activé, l'exposition dealer reconstruite au prix réellement traversé à chaque instant. À <b>droite</b> : la projection — si le prix restait exactement où il est maintenant, comment cette même exposition évoluerait mécaniquement d'ici la clôture."},
    {t:"note", x:"Ne pas confondre les deux. La gauche dit <b>ce qui est arrivé</b> ; la droite dit <b>ce qui arriverait si rien ne bougeait</b>. Un prix qui casse un mur peut rendre toute la projection obsolète en un tick — elle n'est recalculée qu'au tir de cron suivant, jamais entre deux."},
    {t:"h", x:"Lire le dégradé"},
    {t:"chips", items:[
      {c:"t", tag:"Vert · gamma positif", x:"La couverture va CONTRE le mouvement, elle amortit. Compression, pin, ranges. Les zones vertes intenses tiennent."},
      {c:"r", tag:"Rouge · gamma négatif", x:"La couverture va AVEC le mouvement, elle amplifie. Accélérations, cassures. Les zones rouges intenses lâchent vite."}]},
    {t:"h", x:"L'effet sur le prix, en image"},
    {t:"p", x:"La théorie ci-dessus, vue sur un vrai mouvement de prix. Trois situations qui reviennent chaque séance :"},
    {t:"scen", items:[
      {k:"pin", c:"t", tag:"GAMMA POSITIF · LE PRIX PIN",
       x:"Le prix monte vers le mur, le touche, redescend — trois fois de suite sans jamais casser. Chaque approche est vendue en retour par les dealers qui se couvrent : la mèche se referme au lieu de continuer. Plus le vert est intense à cet endroit sur le dégradé, plus ce rejet a des chances d'être franc."},
      {k:"brk", c:"r", tag:"GAMMA NÉGATIF · LA CASSURE S'AUTO-ALIMENTE",
       x:"Le prix approche le même type de niveau, mais cette fois le franchit — et au lieu de ralentir, il ACCÉLÈRE (zone ombrée). Une fois de l'autre côté, les dealers doivent vendre (ou acheter) DANS le sens du mouvement pour rester couverts : la cassure se nourrit elle-même. C'est la signature d'une zone rouge intense sur le dégradé, pas d'une actualité ou d'un gros ordre."},
      {k:"drift", c:"g", tag:"CHARM/VANNA · LA DÉRIVE SANS CATALYSEUR",
       x:"Rien ne se passe pendant les trois quarts de la séance (zone claire) — puis une dérive lente et régulière démarre en fin de journée (zone ombrée), sans news, sans volume inhabituel. C'est le rééquilibrage mécanique des dealers à mesure que le temps s'écoule (charm) ou que l'IV bouge (vanna). Le panneau Flux est le seul endroit du terminal qui montre ce mouvement AVANT qu'il n'arrive."}]},
    {t:"h", x:"Les trois grecques"},
    {t:"codes", items:[
      {k:"Γ", n:"Gamma", d:"Flux provoqué par le mouvement du prix."},
      {k:"V", n:"Vanna", d:"Flux provoqué par une variation d'IV, à prix constant."},
      {k:"Θ", n:"Charm", d:"Flux provoqué par l'écoulement du temps, à prix constant."}]},
    {t:"note", x:"Le charm croît réellement à l'approche de la clôture — la décroissance du delta s'accélère mécaniquement en fin de vie d'une option. Son échelle de couleur est donc recalibrée <b>heure par heure</b> pour rester lisible toute la séance. Gamma et vanna, eux, partagent une échelle commune : leur intensité est directement comparable d'une heure à l'autre — celle du charm ne l'est pas."},
    {t:"p", x:"Vanna et charm forcent des rehedges <b>sans que le prix bouge</b>. C'est ce qui explique les dérives de fin de séance sans catalyseur."},
    {t:"note", x:"<b>Exemple — dérive de fin de séance.</b> 16h : gamma positif, le marché compresse. Le charm est nettement positif sur la colonne de 21h. Traduction : même sans mouvement, les dealers devront acheter en fin de séance. Une dérive haussière lente est probable vers la clôture, sans qu'aucune nouvelle ne l'explique."},
    {t:"h", x:"Construire un biais à partir du flux"},
    {t:"p", x:"La méthode, dans l'ordre :"},
    {t:"steps", items:[
      "Regarde le signe du gamma à la colonne \"maintenant\" : positif, la couverture amortit — attends-toi à un range. Négatif, elle amplifie — attends-toi à de l'accélération sur toute cassure.",
      "Suis ce même signe vers la droite (projection) : le régime se renforce-t-il, s'inverse-t-il, ou reste-t-il stable jusqu'à la clôture ? Un flip de couleur en cours de journée est le signal le plus actionnable du panneau.",
      "Vérifie le vanna : si l'IV bouge dans la journée (elle compresse presque toujours en séance calme), un vanna fort confirme ou contredit le biais gamma. Une contradiction nette impose la prudence.",
      "Vérifie le charm : une dérive mécanique de fin de séance existe indépendamment de tout mouvement de prix — regarde la colonne des dernières heures avant clôture.",
      "Historique activé : compare la gauche à la projection. Si la réaction réelle de ce matin a été plus violente que ce qu'un gamma \"modéré\" laissait attendre, le marché se comporte comme si l'exposition était plus fragile que le modèle ne le dit — à prendre au sérieux."]},
    {t:"p", x:"Le badge de synthèse (ci-dessous) fait exactement ce calcul pour toi, mais seulement sur la colonne \"maintenant\" — utile en lecture rapide. La méthode manuelle reste la seule qui montre <b>comment ce biais évolue dans le temps</b>, pas seulement son état à l'instant T."},
    {t:"h", x:"Le verdict de synthèse"},
    {t:"p", x:"COMPRESSION, DÉRIVE, ACCÉLÉRATION ou DIVERGENCE. Quand les composantes se contredisent, le verdict affiche DIVERGENCE plutôt que de moyenner — un gamma positif avec un charm fortement négatif, c'est une compression qui se dégrade, et c'est le signal le plus utile."},
    {t:"h", x:"Le contexte volume"},
    {t:"p", x:"L'open interest est figé depuis la veille : le dégradé montre l'exposition héritée. Le volume du jour montre où les positions se construisent <b>maintenant</b>. Un strike dont le volume dépasse l'encours accumulé est un endroit où le hedging naît sous tes yeux."},
    {t:"note", x:"Réserve : le volume dit <b>où</b> ça bouge, pas dans quel sens. Un gros volume peut être de l'achat ou de la vente client, avec des implications opposées."},
    {t:"h", x:"Prise en main"},
    {t:"codes", items:[
      {k:"🖱", n:"Survol", d:"Prix, heure et valeur $ exacte de la cellule sous le curseur — même lecture que le croisillon du chart de prix."},
      {k:"⚙", n:"Molette", d:"Zoom centré sur le prix survolé, pour isoler une zone étroite sans que les extrêmes n'écrasent l'échelle."},
      {k:"✋", n:"Glisser", d:"Décale la fenêtre de prix visible sans changer le niveau de zoom."},
      {k:"⟲", n:"Double-clic", d:"Réinitialise le zoom sur la grille complète."},
      {k:"🕐", n:"Historique", d:"Affiche, à gauche de \"maintenant\", l'exposition réellement traversée depuis l'ouverture — reconstruite au prix réel de chaque tir passé, pas une projection."}]},
    {t:"note", x:"<b>Exemple.</b> Tu veux comparer précisément l'intensité juste avant et juste après \"maintenant\" : molette pour zoomer entre −0,5σ et +1σ autour du prix courant, puis survole des deux côtés de la frontière — la valeur $ exacte de chaque cellule est bien plus nette qu'à l'œil sur un dégradé plein écran."},
    {t:"p", x:"Le bouton <b>Strikes</b> superpose les niveaux d'options les plus actifs (volume/OI du jour) au dégradé — trait plein pour un call, pointillé pour un put, opacité proportionnelle au ratio volume/OI. Seuls les plus significatifs restent étiquetés ; le reste est réduit à un point discret en bord de grille pour ne pas noyer les niveaux qui comptent."},
    {t:"note", x:"Portée et Flux donnent un <b>contexte</b>, pas des signaux. Ils indiquent dans quel régime on se trouve et ce qui reste possible — l'entrée et la sortie restent la méthode du trader."}]},

  {id:"rythme", t:"Le calendrier des mises à jour", b:[
    {t:"p", x:"Chaque famille est recalculée <b>au moment où son information existe</b>, et jamais entre-temps. Un niveau qui bouge sous tes pieds n'est pas un niveau."},
    {t:"clocks", items:[
      {h:"00h11", c:"", t:"Recalcul daily", a:"Daily Open, grille σ et Expected Move, sur l'ouverture Globex de la nouvelle séance.",
       b:"Les niveaux gamma de la veille sont conservés — ce sont eux qui servent la session de Londres."},
      {h:"15h25", c:"b", t:"Publication gamma", a:"Toute la structure gamma, sur la chaîne d'options fraîche, juste avant l'ouverture US. Publication sur Discord.",
       b:"Le bloc daily calculé la nuit est repris tel quel : l'Open et l'EM ne sautent pas à l'ouverture de New York."}]},
    {t:"note", x:"Après la publication de 15h25, les niveaux gamma sont <b>verrouillés automatiquement</b> jusqu'au lendemain. Un rafraîchissement en journée met à jour le prix, la basis et l'IV, mais ne déplace aucun niveau. Des exécutions de secours rattrapent toute tâche échouée."}]},

  {id:"prix", t:"Le prix affiché", b:[
    {t:"p", x:"Pendant la <b>séance américaine</b>, les bougies sont reconstruites à partir de l'ETF correspondant (QQQ pour le NQ, SPY pour l'ES et le SPX) converti à l'échelle du future : le prix est alors <b>quasi temps réel</b>."},
    {t:"p", x:"En dehors de la séance US — nuit Globex, tôt le matin — l'ETF ne cote pas : on retombe sur le future, propre mais retardé de quelques minutes. C'est une limite des sources gratuites, pas un défaut de réglage."},
    {t:"p", x:"L'écart indice ↔ future est mesuré en continu et corrigé automatiquement, pour coller au vrai NQ à quelques points près."}]},

  {id:"faq", t:"Questions fréquentes", b:[
    {t:"faq", items:[
      {q:"Je rafraîchis et les niveaux ne changent pas. Normal ?",
       a:"Oui. Après 15h25 ils sont volontairement verrouillés pour la journée : seuls le prix, la basis et l'IV se mettent à jour. C'est ce qui garantit que tu travailles toute la séance sur les mêmes repères."},
      {q:"Mon prix diffère légèrement de TradingView.",
       a:"Normal en dehors de la séance US, où l'on affiche le future retardé. Pendant la séance, l'écart doit rester de l'ordre de un à deux points."},
      {q:"Ces niveaux valent-ils pour du swing sur plusieurs jours ?",
       a:"Non. Ce sont des repères intrajournaliers : la structure gamma est recalculée chaque jour et peut changer fortement d'une séance à l'autre."},
      {q:"Pourquoi l'Expected Move est-il centré sur l'ouverture et pas sur le prix actuel ?",
       a:"Parce qu'il mesure l'amplitude attendue de la séance entière. Le centrer sur le prix courant le ferait glisser toute la journée et lui ferait perdre son sens."},
      {q:"Que se passe-t-il si une mise à jour échoue ?",
       a:"Des exécutions de secours prennent le relais dans la foulée. Le système préfère conserver les niveaux valides plutôt que d'en publier de périmés."}]}]}
]},

en: {
  title:"Documentation", term:"Terminal", dash:"Dashboard", heat:"Heatmap",
  heroT:"How to read and use the terminal",
  heroP:"The levels, what they mean, exporting to TradingView, and the exact update schedule.",
  cd1k:"Next daily recompute · Open + EM", cd1s:"00:11 Paris · Monday → Friday",
  cd2k:"Next gamma publication", cd2s:"15:25 Paris · Monday → Friday",
  cdLocal:"your time:", toc:"Contents",
  foot:"gexdash · TheHub — levels are provided for information only and are not investment advice.",
  secs:[
  {id:"quoi", t:"What it does", b:[
    {t:"p", x:"gexdash computes the <b>dealer gamma exposure levels</b> for NQ, ES and SPX every day, from the NDX and SPX option chains."},
    {t:"p", x:"These are the prices where market makers must hedge. That is why they so often act as <b>magnets</b> or <b>walls</b>."},
    {t:"note", x:"Prices are converted to futures scale through the <b>basis</b> (index ↔ futures spread), continuously auto-calibrated, so levels land at the right prices on your NQ or ES chart."}]},

  {id:"boutons", t:"The three level families", b:[
    {t:"p", x:"Above the chart, three buttons each toggle one family. Each has its own <b>colour</b>, used identically on the terminal and on the dashboard cards. Click a family below to see what it draws."},
    {t:"families", items:[
      {k:"gex", tag:"GEX", x:"The current gamma structure, recomputed <b>once a day</b> just before the US open. This is the map of the terrain: where market makers must hedge, hence where price stalls, bounces or accelerates.",
       codes:[
        {k:"CW", n:"Call Wall", d:"Largest call gamma concentration: ceiling, reference resistance."},
        {k:"PW", n:"Put Wall", d:"Largest put gamma concentration: floor, reference support."},
        {k:"CW0 / PW0", n:"0DTE walls", d:"Same walls, today's options only. Highly reactive, decisive intraday."},
        {k:"Flip", n:"Gamma Flip", d:"Positive ↔ negative gamma switch. Above: dampened volatility. Below: amplified moves."},
        {k:"HGEX", n:"High GEX", d:"Strike with peak absolute gamma: heavy friction zone."},
        {k:"MP", n:"Max Pain", d:"Price where the most options expire worthless."}]},
      {k:"em", tag:"EM · 1D", x:"The range priced by the market for the day, derived from ATM IV (0.8σ) and centred on the Daily Open. Leaving the band flags an unusual session; returning inside it is the most common behaviour.",
       codes:[
        {k:"EM+ / EM−", n:"Expected Move", d:"Bounds of a normal day, computed at the open then frozen."},
        {k:"EM ±50%", n:"Half band", d:"Intermediate marker: often reached on quiet sessions."},
        {k:"EM ±150%", n:"Extension", d:"Beyond it: strong expansion day, different regime."}]},
      {k:"open", tag:"Open", x:"The σ multiples grid anchored on the <b>Globex open</b>, σ being the day's implied standard deviation. It measures distance travelled since the open — a purely statistical marker, independent of dealer positioning.",
       codes:[
        {k:"Open", n:"Daily Open", d:"Globex session open: the anchor of the whole grid."},
        {k:"σ±0.5", n:"Half standard deviation", d:"First step, cleared on most sessions."},
        {k:"σ±1", n:"One standard deviation", d:"Already a wide session: about two thirds of days stay inside."},
        {k:"σ±2 → ±3", n:"Extremes", d:"Rarely reached: trend or event days."}]}]},
    {t:"note", x:"Every line carries its price. When levels cluster, the most important stay labelled and the others become a coloured dot: <b>hover</b> (or <b>tap</b> on mobile) to reveal the one you are aiming at. The ⚙ drawer offers \"Auto / Always / On hover\" and text size."}]},

  {id:"tv", t:"Exporting to TradingView", b:[
    {t:"p", x:"The terminal generates a <b>Pine string</b> holding every level of the day, to be fed into the <b>GEX Daily Levels</b> indicator."},
    {t:"steps", items:[
      "Add the indicator to your chart — <b>TradingView</b> link in the top bar.",
      "Select the right market (NQ / ES / SPX): the string is instrument-specific.",
      "Click <b>⧉ Pine string</b> at the top right of the terminal — it is copied to your clipboard.",
      "In TradingView, open the indicator settings and paste it into the dedicated field.",
      "Confirm: every level appears at the right price on your chart."]},
    {t:"p", x:"Repeat <b>once a day</b>, ideally after the 15:25 publication."}]},

  {id:"dash", t:"The dashboard", b:[
    {t:"p", x:"Several charts side by side — different markets and timeframes, each with its own levels."},
    {t:"ul", items:[
      "Add a card by picking a market and timeframe, then rearrange them freely.",
      "Each card has its own GEX / EM / Open buttons, independent from the others.",
      "Built-in <b>drawing tools</b>: your drawings persist across sessions.",
      "<b>Double-click</b> a chart to recentre it on price."]},
    {t:"p", x:"Charts reframe automatically when you switch market and reload missed candles when you return to the tab."}]},


  {id:"heat", t:"The heatmap", b:[
    {t:"p", x:"A bird's-eye view of gamma across <b>all three markets at once</b> (NQ, ES, SPX): <b>strikes as rows</b>, <b>expiries as columns</b> (0DTE, 1DTE… then the aggregate). Intensity carries magnitude — teal for positive gamma, red for negative, gold for extremes."},
    {t:"h", x:"Controls"},
    {t:"codes", items:[
      {k:"Scale", n:"Easy / Medium / Expert", d:"Strike bucketing: 20, 10 or 5 points. Finer shows more detail, wider makes the big masses stand out."},
      {k:"Range", n:"±5 to ±100", d:"Span displayed around price. Tighten for intraday, widen to see distant walls."},
      {k:"Filter", n:"Noise threshold", d:"Dims cells below the chosen level (±1M to ±50M) so only real zones remain legible."},
      {k:"Expiries", n:"Column filter", d:"Isolate one expiry — 0DTE alone is often the most telling intraday."},
      {k:"Sync", n:"Scroll lock", d:"Scrolls all three markets together to compare structures."},
      {k:"Overlay", n:"GEX levels", d:"Overlays Call Wall, Put Wall, Flip, Max Pain and Expected Move on the ladder."}]},
    {t:"note", x:"Each grid scrolls <b>inside</b> its panel and auto-centres on the live price. A countdown shows the time left before the next US open. The <b>?</b> button recalls what the colours mean at any time."},
    {t:"p", x:"It is the view of choice to spot <b>where mass concentrates</b>, and above all whether a wall rests on a single expiry — hence fragile once it expires — or on all of them."}]},

  {id:"portee", t:"Range", b:[
    {t:"p", x:"The day's EM band is set at the open and never moves again: it tells you how far the market is priced to travel over the session. But it doesn't say what's still possible <b>right now</b>. Range answers that question: centred on the current price, it tightens hour by hour."},
    {t:"p", x:"Two sources of contraction are accounted for: time passing, and IV compressing intraday."},
    {t:"h", x:"How to read it"},
    {t:"note", x:"This is <b>not</b> a level to trade off — it follows price, you never touch it. It's a gauge of distance still reachable, to be cross-checked against your real levels."},
    {t:"chips", items:[
      {c:"r", tag:"Target out of reach", x:"It's 7pm. The Call Wall is 150 points above, and range no longer allows more than 80. The target is unreachable today: scale back the objective or exit, rather than waiting for a move the market no longer has the fuel to make."},
      {c:"t", tag:"Extension still possible", x:"It's 5pm, price has already covered 76% of the day's band. The band looks spent — but range's upper bound extends beyond the band's upper bound. The market can still break out of the expected extension: the signature of a trend day, don't fade it."}]},
    {t:"p", x:"The clock isn't linear: overnight Globex burns little variance, the cash open and the close consume most of it. At noon there isn't half the range left, but about 71%."}]},

  {id:"flux", t:"Flow", b:[
    {t:"p", x:"The biggest seller in a session is rarely directional: it's a market maker hedging. A client buys puts, the dealer ends up long delta, and sells futures to stay neutral — and price drops without any conviction behind it."},
    {t:"p", x:"The Flow view projects that hedging onto a price × time grid: if price got there, at that hour, what flow would dealers be forced to execute."},
    {t:"h", x:"Two zones, two kinds of data"},
    {t:"p", x:"The panel is split in two on either side of \"now\". On the <b>left</b>: what actually happened since the open — price (white line) and, with the <b>History</b> button on, dealer exposure reconstructed at the price actually traded at each moment. On the <b>right</b>: the projection — if price stayed exactly where it is now, how that same exposure would mechanically evolve until the close."},
    {t:"note", x:"Don't mix the two up. The left says <b>what happened</b>; the right says <b>what would happen if nothing moved</b>. A price breaking through a wall can make the whole projection stale within one tick — it's only recomputed on the next cron run, never in between."},
    {t:"h", x:"Reading the gradient"},
    {t:"chips", items:[
      {c:"t", tag:"Green · positive dealer gamma", x:"Hedging goes AGAINST the move, it dampens. Compression, pins, ranges. Intense green zones hold."},
      {c:"r", tag:"Red · negative dealer gamma", x:"Hedging goes WITH the move, it amplifies. Accelerations, breaks. Intense red zones give way fast."}]},
    {t:"h", x:"The effect on price, in pictures"},
    {t:"p", x:"The theory above, on an actual price move. Three situations that recur every session:"},
    {t:"scen", items:[
      {k:"pin", c:"t", tag:"POSITIVE GAMMA · PRICE PINS",
       x:"Price rallies into the wall, touches it, drops back — three times in a row without ever breaking. Each approach gets sold back by dealers hedging: the wick closes instead of continuing. The more intense the green at that spot on the gradient, the cleaner that rejection tends to be."},
      {k:"brk", c:"r", tag:"NEGATIVE GAMMA · THE BREAK FEEDS ITSELF",
       x:"Price approaches the same kind of level, but this time breaks through it — and instead of slowing down, it ACCELERATES (shaded zone). Once on the other side, dealers must sell (or buy) WITH the move to stay hedged: the break feeds itself. That's the signature of an intense red zone on the gradient, not a headline or a large order."},
      {k:"drift", c:"g", tag:"CHARM/VANNA · THE DRIFT WITH NO CATALYST",
       x:"Nothing happens for three quarters of the session (light zone) — then a slow, steady drift kicks in late in the day (shaded zone), with no news, no unusual volume. That's dealers mechanically rebalancing as time passes (charm) or as IV moves (vanna). The Flow panel is the only place on the terminal that shows this move BEFORE it happens."}]},
    {t:"h", x:"The three greeks"},
    {t:"codes", items:[
      {k:"Γ", n:"Gamma", d:"Flow triggered by price movement."},
      {k:"V", n:"Vanna", d:"Flow triggered by a change in IV, at constant price."},
      {k:"Θ", n:"Charm", d:"Flow triggered by the passage of time, at constant price."}]},
    {t:"note", x:"Charm genuinely grows as the close approaches — delta decay mechanically accelerates late in an option's life. Its colour scale is therefore recalibrated <b>hour by hour</b> to stay legible all session. Gamma and vanna share a common scale: their intensity IS directly comparable from one hour to the next — charm's isn't."},
    {t:"p", x:"Vanna and charm force rehedges <b>without price moving at all</b>. That's what explains end-of-session drifts with no catalyst."},
    {t:"note", x:"<b>Example — end-of-session drift.</b> 4pm: positive gamma, the market compresses. Charm is strongly positive in the 9pm column. Translation: even with no move, dealers will have to buy late in the session. A slow bullish drift into the close is likely, with no news to explain it."},
    {t:"h", x:"Building a bias from the flow"},
    {t:"p", x:"The method, in order:"},
    {t:"steps", items:[
      "Check the gamma sign at the \"now\" column: positive, hedging dampens — expect a range. Negative, it amplifies — expect acceleration on any break.",
      "Follow that same sign to the right (projection): does the regime strengthen, flip, or stay stable into the close? A colour flip during the day is the panel's single most actionable signal.",
      "Check vanna: if IV moves during the day (it almost always compresses on a quiet session), a strong vanna confirms or contradicts the gamma bias. A clear contradiction calls for caution.",
      "Check charm: a mechanical end-of-session drift exists independently of any price move — look at the last hours' column before the close.",
      "With History on: compare the left side to the projection. If this morning's real reaction was sharper than a \"moderate\" gamma reading suggested, the market is behaving as if exposure were more fragile than the model says — worth taking seriously."]},
    {t:"p", x:"The summary badge below does exactly this calculation for you, but only on the \"now\" column — useful for a quick read. The manual method is the only one that shows <b>how this bias evolves over time</b>, not just its state at this instant."},
    {t:"h", x:"The summary verdict"},
    {t:"p", x:"COMPRESSION, DRIFT, ACCELERATION or DIVERGENCE. When components contradict each other, the verdict shows DIVERGENCE rather than averaging them out — positive gamma with strongly negative charm is a compression that's degrading, and that's the most useful signal."},
    {t:"h", x:"Volume context"},
    {t:"p", x:"Open interest is frozen from the prior day: the gradient shows inherited exposure. Today's volume shows where positions are being built <b>right now</b>. A strike whose volume exceeds accumulated open interest is a place where hedging is being born in front of you."},
    {t:"note", x:"Caveat: volume tells you <b>where</b> it's moving, not which direction. Heavy volume can be client buying or selling, with opposite implications."},
    {t:"h", x:"Getting started"},
    {t:"codes", items:[
      {k:"🖱", n:"Hover", d:"Price, time and the exact $ value of the cell under the cursor — same reading as the price chart's crosshair."},
      {k:"⚙", n:"Wheel", d:"Zoom centered on the hovered price, to isolate a narrow band without the extremes crushing the scale."},
      {k:"✋", n:"Drag", d:"Pans the visible price window without changing the zoom level."},
      {k:"⟲", n:"Double-click", d:"Resets the zoom to the full grid."},
      {k:"🕐", n:"History", d:"Shows, left of \"now\", the exposure actually traded through since the open — reconstructed at the real price of each past tick, not a projection."}]},
    {t:"note", x:"<b>Example.</b> You want to compare intensity precisely just before and just after \"now\": wheel-zoom between −0.5σ and +1σ around the current price, then hover both sides of the boundary — the exact $ value of each cell is far clearer than eyeballing a full-panel gradient."},
    {t:"p", x:"The <b>Strikes</b> button overlays the day's most active option levels (volume/OI) on the gradient — solid line for a call, dashed for a put, opacity scaled to the volume/OI ratio. Only the most significant stay labeled; the rest collapse into a discreet dot at the grid's edge so they don't drown out the levels that matter."},
    {t:"note", x:"Range and Flow give <b>context</b>, not signals. They show which regime you're in and what's still possible — entry and exit remain the trader's job."}]},

  {id:"rythme", t:"Update schedule", b:[
    {t:"p", x:"Each family is recomputed <b>when its information exists</b>, and never in between. A level that moves under your feet is not a level."},
    {t:"clocks", items:[
      {h:"00:11", c:"", t:"Daily recompute", a:"Daily Open, σ grid and Expected Move, on the new session's Globex open.",
       b:"The previous day's gamma levels are kept — they are what serves the London session."},
      {h:"15:25", c:"b", t:"Gamma publication", a:"The whole gamma structure, on the fresh option chain, just before the US open. Published to Discord.",
       b:"The daily block computed overnight is carried over: Open and EM do not jump at the New York open."}]},
    {t:"note", x:"After the 15:25 publication, gamma levels are <b>locked automatically</b> until the next day. An intraday refresh updates price, basis and IV but moves no level. Backup runs cover any failed task."}]},

  {id:"prix", t:"The displayed price", b:[
    {t:"p", x:"During the <b>US session</b>, candles are rebuilt from the matching ETF (QQQ for NQ, SPY for ES and SPX) converted to futures scale: price is then <b>near real time</b>."},
    {t:"p", x:"Outside the US session — overnight Globex, early morning — the ETF does not trade, so we fall back to the futures feed: clean, but a few minutes delayed. That is a free-data limitation, not a misconfiguration."},
    {t:"p", x:"The index ↔ futures spread is measured continuously and auto-corrected, staying within a couple of points of the real NQ."}]},

  {id:"faq", t:"FAQ", b:[
    {t:"faq", items:[
      {q:"I refresh and the levels don't change. Is that normal?",
       a:"Yes. After 15:25 they are deliberately locked for the day: only price, basis and IV update. That is what guarantees you work off the same markers all session."},
      {q:"My price differs slightly from TradingView.",
       a:"Expected outside the US session, where the delayed futures feed is shown. During the session the gap should stay within a point or two."},
      {q:"Can I use these levels for multi-day swing trades?",
       a:"No. They are intraday markers: the gamma structure is recomputed daily and can change sharply from one session to the next."},
      {q:"Why is the Expected Move centred on the open rather than the current price?",
       a:"Because it measures the range expected for the whole session. Centring it on live price would make it drift all day and lose its meaning."},
      {q:"What happens if an update fails?",
       a:"Backup runs take over shortly after. The system prefers keeping valid levels over publishing stale ones."}]}]}
]}};

/* ───── aperçu interactif des familles de niveaux ───── */
const FAM_COLOR = {gex:"#F0B90B", em:"#26A69A", open:"#8B5CF6"};
const FAM_LINES = {
  gex: [{p:29500, l:"CW", c:"#EF5350"}, {p:29350, l:"HGEX", c:"#8A8A94"},
        {p:29180, l:"Flip", c:"#F0B90B"}, {p:28800, l:"PW", c:"#26A69A"}],
  em:  [{p:29420, l:"EM+", c:"#26A69A"}, {p:29215, l:"EM +50%", c:"#1E6F68", d:1},
        {p:29005, l:"EM −50%", c:"#1E6F68", d:1}, {p:28800, l:"EM−", c:"#26A69A"}],
  open:[{p:29530, l:"σ+2", c:"#EF5350", d:1}, {p:29320, l:"σ+1", c:"#EF5350", d:1},
        {p:29110, l:"Open", c:"#F0B90B", s:1}, {p:28900, l:"σ−1", c:"#26A69A", d:1},
        {p:28690, l:"σ−2", c:"#26A69A", d:1}]
};
const FAM_PATH = [29105,29088,29120,29142,29118,29095,29070,29085,29130,29168,
                  29195,29172,29140,29155,29188,29225,29260,29238,29205,29180,
                  29160,29195,29230,29268,29245,29212,29190,29215,29250,29285,
                  29262,29230,29205,29228,29255,29240,29218,29245,29270,29255];
function famSvg(key){
  const W = 620, H = 210, PAD = 92, LO = 28620, HI = 29600;
  const Y = p => 14 + (HI - p) / (HI - LO) * (H - 30);
  const pts = FAM_PATH.map((v, i) =>
    `${16 + i * (W - PAD - 22) / (FAM_PATH.length - 1)},${Y(v).toFixed(1)}`).join(" ");
  const lines = FAM_LINES[key].map(l => {
    const y = Y(l.p).toFixed(1);
    return `<line x1="10" y1="${y}" x2="${W - PAD}" y2="${y}" stroke="${l.c}"
              stroke-width="${l.s ? 1.6 : 1}" ${l.d ? 'stroke-dasharray="4 4"' : ""}
              opacity="${l.s ? .95 : .8}"/>
            <text x="${W - PAD + 8}" y="${+y + 3.5}" fill="${l.c}"
              font-family="IBM Plex Mono, monospace" font-size="10.5">${l.l}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    ${lines}
    <polyline points="${pts}" fill="none" stroke="#ECEAE4" stroke-width="1.4"
      stroke-linejoin="round" opacity=".92"/>
    <circle cx="${16 + (FAM_PATH.length - 1) * (W - PAD - 22) / (FAM_PATH.length - 1)}"
      cy="${Y(FAM_PATH[FAM_PATH.length - 1]).toFixed(1)}" r="3" fill="#F0B90B"/>
  </svg>`;
}
function famPane(fam){
  return `<div class="fx">${fam.x}</div>${famSvg(fam.k)}
    <div class="famcodes">${fam.codes.map(c =>
      `<div class="cx"><div class="kk" style="color:${FAM_COLOR[fam.k]}">${c.k}</div>
        <div><div class="nn">${c.n}</div><div class="dd">${c.d}</div></div></div>`).join("")}</div>`;
}
function wireFam(root){
  const btns = root.querySelectorAll(".famtabs button");
  btns.forEach(b => b.onclick = () => {
    btns.forEach(x => x.classList.toggle("on", x === b));
    const fam = FAM_DATA[b.dataset.k];
    root.querySelector(".fampane").innerHTML = famPane(fam);
  });
}
let FAM_DATA = {};

/* ───── scénarios Flux : impact du positionnement dealer sur un mini-chart de
   prix statique, même langage visuel que famSvg ci-dessus mais plus simple
   (une seule ligne de niveau, une zone ombrée) -- le but est de RENDRE VISIBLE
   ce que "gamma positif/négatif" et "charm" font concrètement au prix, pas
   seulement de le décrire en mots. ───── */
const SCEN_SHAPE = {
  pin: {
    lo:28950, hi:29520,
    path:[29050,29120,29200,29280,29350,29400,29430,29410,29360,29290,
          29220,29160,29110,29140,29210,29290,29360,29410,29440,29420,
          29370,29300,29230,29170,29130,29160,29230,29310,29380,29425],
    wallY:29460, wallLabel:"CW", wallColor:"#26A69A"},
  brk: {
    lo:28950, hi:30500,
    path:[29050,29080,29120,29150,29190,29230,29270,29310,29350,29380,
          29400,29415,29440,29480,29530,29590,29660,29740,29830,29930,
          30040,30160,30290,30430],
    wallY:29400, wallLabel:"CW", wallColor:"#F0B90B", shadeFromIdx:10, shadeColor:"#EF5350"},
  drift: {
    lo:29130, hi:29400,
    path:[29200,29210,29195,29205,29215,29200,29190,29205,29220,29210,
          29195,29200,29215,29225,29210,29200,29215,29230,29245,29260,
          29275,29290,29310,29330,29350,29370],
    shadeFromIdx:18, shadeColor:"#F0B90B"}
};
function fluxScenSvg(cfg){
  const W = 560, H = 150, PAD = 14;
  const {lo, hi, path} = cfg;
  const Y = p => PAD + (hi - p) / (hi - lo) * (H - PAD * 2);
  const stepX = (W - PAD * 2) / (path.length - 1);
  const pts = path.map((v, i) => `${(PAD + i * stepX).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  let extra = "";
  if (cfg.shadeFromIdx != null){
    const x0 = PAD + cfg.shadeFromIdx * stepX;
    extra += `<rect x="${x0.toFixed(1)}" y="${PAD}" width="${(W - PAD - x0).toFixed(1)}" height="${H - PAD * 2}" fill="${cfg.shadeColor}" opacity=".1"/>`;
  }
  if (cfg.wallY != null){
    const wy = Y(cfg.wallY).toFixed(1);
    extra += `<line x1="${PAD}" y1="${wy}" x2="${W - PAD}" y2="${wy}" stroke="${cfg.wallColor}"
                stroke-width="1.4" stroke-dasharray="4 3" opacity=".85"/>
              <text x="${W - PAD - 4}" y="${+wy - 6}" fill="${cfg.wallColor}" text-anchor="end"
                font-family="IBM Plex Mono, monospace" font-size="10.5">${cfg.wallLabel}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    ${extra}
    <polyline points="${pts}" fill="none" stroke="#ECEAE4" stroke-width="1.6"
      stroke-linejoin="round" opacity=".95"/>
  </svg>`;
}

/* ───── rendu des blocs ───── */
function blockHtml(b){
  switch (b.t){
    case "p":  return `<p class="tx">${b.x}</p>`;
    case "h":  return `<p class="tx" style="color:var(--text);font-weight:600;font-size:12.5px;
                        letter-spacing:.06em;text-transform:uppercase;margin-top:20px">${b.x}</p>`;
    case "note": return `<div class="note">${b.x}</div>`;
    case "chips": return `<div class="chips">${b.items.map(i =>
      `<div class="chip ${i.c}"><span class="tg">${i.tag}</span><p>${i.x}</p></div>`).join("")}</div>`;
    case "scen": return `<div class="scen">${b.items.map(i =>
      `<div class="scen-card ${i.c}"><span class="tg">${i.tag}</span>
         ${fluxScenSvg(SCEN_SHAPE[i.k])}
         <p>${i.x}</p></div>`).join("")}</div>`;
    case "families": {
      b.items.forEach(f => { FAM_DATA[f.k] = f; });
      return `<div class="fam" data-fam="1">
        <div class="famtabs">${b.items.map((f, i) =>
          `<button data-k="${f.k}" class="${i === 0 ? "on" : ""}"
             style="color:${FAM_COLOR[f.k]}"><i></i>${f.tag}</button>`).join("")}</div>
        <div class="fampane">${famPane(b.items[0])}</div></div>`;
    }
    case "codes": return `<div class="codes">${b.items.map(i =>
      `<div class="cx"><div class="kk">${i.k}</div><div><div class="nn">${i.n}</div>
       <div class="dd">${i.d}</div></div></div>`).join("")}</div>`;
    case "steps": return `<ol class="steps">${b.items.map(i => `<li>${i}</li>`).join("")}</ol>`;
    case "ul": return `<ul class="pl">${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
    case "clocks": return `<div class="clocks">${b.items.map(i =>
      `<div class="clk ${i.c}"><div class="hh">${i.h}</div><div class="tt">${i.t}</div>
       <div class="rw"><span>${LANG === "fr" ? "Recalculé" : "Recomputed"}</span>${i.a}</div>
       <div class="rw"><span>${LANG === "fr" ? "Conservé" : "Kept"}</span>${i.b}</div></div>`).join("")}</div>`;
    case "faq": return `<div class="faq">${b.items.map(i =>
      `<details><summary>${i.q}</summary><div class="ans">${i.a}</div></details>`).join("")}</div>`;
    default: return "";
  }
}

function render(){
  const L = T[LANG];
  document.documentElement.lang = LANG;
  $("hTitle").textContent = L.title;
  $("nTerm").textContent = L.term;
  $("nDash").textContent = L.dash;
  $("nHeat").textContent = L.heat;
  $("heroT").textContent = L.heroT;
  $("heroP").textContent = L.heroP;
  $("cd1k").textContent = L.cd1k; $("cd1s").textContent = L.cd1s;
  $("cd2k").textContent = L.cd2k; $("cd2s").textContent = L.cd2s;
  $("foot").textContent = L.foot;
  $("bFr").className = LANG === "fr" ? "on" : "";
  $("bEn").className = LANG === "en" ? "on" : "";

  $("toc").innerHTML = `<div class="lbl">${L.toc}</div>` + L.secs.map((s, i) =>
    `<a href="#${s.id}" data-s="${s.id}"><i>${String(i + 1).padStart(2, "0")}</i>${s.t}</a>`).join("");
  $("body").innerHTML = L.secs.map((s, i) =>
    `<section id="${s.id}"><div class="shead"><i>${String(i + 1).padStart(2, "0")}</i>
       <h3>${s.t}</h3></div><div class="sbody">${s.b.map(blockHtml).join("")}</div></section>`).join("");

  document.querySelectorAll("[data-fam]").forEach(wireFam);

  syncToc();
  tickCd();
}
/* Surlignage du sommaire : calculé au scroll plutôt que par IntersectionObserver.
   L'observer ne déclenchait jamais pour les dernières sections — arrivé en bas
   de page, elles n'atteignent plus la bande de détection en haut de l'écran. */
function syncToc(){
  const secs = [...document.querySelectorAll("main section")];
  if (!secs.length) return;
  const bottom = window.innerHeight + window.scrollY >=
                 document.documentElement.scrollHeight - 4;
  let active = secs[0].id;
  if (bottom){
    active = secs[secs.length - 1].id;      // bas de page = dernière section
  } else {
    for (const s of secs) if (s.getBoundingClientRect().top <= 110) active = s.id;
  }
  document.querySelectorAll("#toc a").forEach(a =>
    a.classList.toggle("on", a.dataset.s === active));
}
window.addEventListener("scroll", syncToc, {passive:true});
window.addEventListener("resize", syncToc);

function setLang(l){
  LANG = l;
  try{ localStorage.setItem("gexLang", l); }catch(_){}
  render();
}
$("bFr").onclick = () => setLang("fr");
$("bEn").onclick = () => setLang("en");
render();
setInterval(tickCd, 1000);
</script>
