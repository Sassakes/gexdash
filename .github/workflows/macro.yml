name: Macro snapshot

# FRED is reachable from GitHub runners (blocked from Vercel's edge), so we compute
# macro.json here and commit it — the /news Macro Synthesis banner reads it statically.
# Commit is authored as the repo owner so Vercel (Hobby) builds it.

on:
  schedule:
    - cron: "30 12 * * 1-5"   # avant l'ouverture US (données de 8h30 ET)
    - cron: "30 16 * * 1-5"   # milieu de séance : valeurs publiées du jour
    - cron: "30 20 * * 1-5"   # après la clôture US
    - cron: "0 6 * * 1"       # lundi matin : calendrier de la semaine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro
  cancel-in-progress: false

jobs:
  macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Compute macro.json
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/macro_snapshot.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro.json calendar.json
          git diff --staged --quiet && echo "rien a publier" && exit 0
          git commit -m "macro + calendrier $(date -u +%FT%TZ)"
          # Le depot peut avoir avance pendant l'execution (un push de ta part) :
          # sans reprise, le job echoue et le fichier genere est PERDU. On
          # rejoue donc le commit par-dessus les nouveautes, avec plusieurs
          # tentatives, ce qui rend la publication insensible aux collisions.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "collision, nouvelle tentative ($i)"
            sleep $((i * 5))
          done
          echo "publication impossible apres 5 tentatives"; exit 1
