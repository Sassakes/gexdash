<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GexDash — Politique de confidentialité</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="description" content="Politique de confidentialité de gexdash (TheHub) et de l'extension Chrome TheHub — GEX Levels Autofill.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Palette : le :root vit dans theme.css, source unique partagée par
     toutes les pages. Ne pas redéclarer de token de couleur ici. -->
<link rel="stylesheet" href="/theme.css">
<script src="/shell.js"></script>
<style>
  /* GARDE-FOU : l'attribut hidden doit toujours l'emporter. Sans cette règle,
     une déclaration display: sur un id ou une classe le neutralise.
     Dupliqué depuis theme.css à dessein : si la feuille partagée ne
     charge pas, la règle doit tenir quand même. */
  [hidden]{display:none !important}

  *{box-sizing:border-box; margin:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.62}
  a{color:var(--gold)}


  .hero{padding:34px 20px 6px; max-width:760px; margin:0 auto}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--gold); display:flex; align-items:center; gap:9px; margin-bottom:12px}
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(var(--gold-rgb),.4)}
  .hero h2{font-size:23px; font-weight:600; letter-spacing:-.01em}
  .hero p{color:var(--muted); font-size:14px; margin-top:8px; max-width:62ch}
  .hero .upd{font-family:var(--mono); font-size:11px; color:var(--faint); margin-top:14px}

  main{max-width:760px; margin:0 auto; padding:22px 20px 90px}
  section{margin-bottom:14px; scroll-margin-top:70px; background:var(--surface); border:1px solid var(--line)}
  .shead{display:flex; align-items:center; gap:12px; padding:15px 20px;
    border-bottom:1px solid var(--line); background:var(--surface2)}
  .shead i{font-family:var(--mono); font-size:11px; color:var(--gold); font-style:normal;
    border:1px solid rgba(var(--gold-rgb),.35); padding:3px 8px}
  .shead h3{font-size:14.5px; font-weight:600}
  .sbody{padding:18px 20px}
  .sbody > * + *{margin-top:12px}
  p.tx{font-size:13.5px; color:var(--muted); max-width:66ch}
  p.tx b{color:var(--text); font-weight:600}
  code{font-family:var(--mono); font-size:12px; background:var(--surface3);
    border:1px solid var(--line-strong); padding:1px 6px; color:var(--text)}

  ul.pl{list-style:none}
  ul.pl li{font-size:13.5px; color:var(--muted); padding:6px 0 6px 17px; position:relative; max-width:66ch}
  ul.pl li::before{content:"—"; position:absolute; left:0; color:var(--faint)}
  ul.pl li b{color:var(--text); font-weight:600}

  .note{background:var(--surface2); border:1px solid var(--line); border-left:2px solid var(--gold);
    padding:13px 16px; font-size:12.5px; color:var(--muted)}

  footer{border-top:1px solid var(--line); padding:20px; text-align:center;
    color:var(--faint); font-size:11px}

  @media (max-width:560px){
    header{padding:11px 14px; gap:9px}
    header h1{font-size:11px; letter-spacing:.14em}
    .topnav a{padding:6px 8px; font-size:11.5px}
    .hero{padding:22px 14px 4px}
    .hero h2{font-size:19px}
    main{padding:16px 14px 60px}
    .shead{padding:13px 15px}
    .sbody{padding:15px}
  }
</style>
</head>
<body>
<header class="appheader">
  <h1><b>Gex</b>Dash · <span id="hTitle">Confidentialité</span></h1>
  <nav class="topnav" id="appnav"></nav>
  <div id="community"></div>
  <span id="langSel"></span>
</header>

<div class="hero">
  <div class="eyebrow"><span class="dot"></span><span id="eyebrow"></span></div>
  <h2 id="heroT"></h2>
  <p id="heroP"></p>
  <div class="upd" id="upd"></div>
</div>

<main id="body"></main>
<footer id="foot"></footer>

function blockHtml(b){
  switch (b.t){
    case "p": return `<p class="tx">${b.x}</p>`;
    case "note": return `<div class="note">${b.x}</div>`;
    case "ul": return `<ul class="pl">${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
    default: return "";
  }
}

function render(){
  const L = T[LANG];
  document.documentElement.lang = LANG;
  $("hTitle").textContent = L.title;
  Shell.mount("appnav"); Shell.mountCommunity("community"); Shell.setLang(LANG);
    $("eyebrow").textContent = L.eyebrow;
  $("heroT").textContent = L.heroT;
  $("heroP").textContent = L.heroP;
  $("upd").textContent = L.upd;
  $("foot").textContent = L.foot;

  $("body").innerHTML = L.secs.map((s, i) =>
    `<section id="${s.id}"><div class="shead"><i>${String(i + 1).padStart(2, "0")}</i>
       <h3>${s.t}</h3></div><div class="sbody">${s.b.map(blockHtml).join("")}</div></section>`).join("");
}

function setLang(l){
  LANG = l;
  try{ localStorage.setItem("gexLang", l); }catch(_){}
  render();
}
Shell.mountLang("langSel");
Shell.onLang(setLang);
render();
</script>
</body>
</html>
