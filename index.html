<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheHub - GexDashboard</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="description" content="Gamma Levels et GEX Levels quotidiens pour NQ, ES et SPX : call wall, put wall, gamma flip, expected move et grille sigma, en temps réel pendant la session US.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/ui.js"></script>
<script src="/loader.js"></script>
<script src="/flux-panel.js"></script>
<!-- Palette : le :root vit dans theme.css, source unique partagée par
     toutes les pages. Ne pas redéclarer de token de couleur ici. -->
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<script src="/shell.js"></script>
<style>
  /* GARDE-FOU : l'attribut hidden doit toujours l'emporter. Sans cette règle,
     une déclaration display: sur un id ou une classe le neutralise — c'est ce
     qui affichait la fenêtre de connexion en permanence, sans pouvoir la
     fermer. Le !important est ici volontaire et sûr. */
  [hidden]{display:none !important}

  
  *{box-sizing:border-box; margin:0; padding:0}
  html{scrollbar-color:var(--line-strong) var(--bg)}
  body{
    background:
      radial-gradient(1100px 420px at 50% -180px, rgba(var(--gold-rgb),.055), transparent 62%),
      var(--bg);
    color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0 0 auto 0; height:1px; z-index:10;
    background:linear-gradient(90deg, transparent, var(--gold-glow), transparent);
  }
  main{max-width:880px; margin:0 auto; padding:26px 20px 56px}
  ::selection{background:var(--gold-soft); color:var(--gold)}
  a{color:var(--gold)}
  button, input{font-family:var(--mono)}

  /* ============ header ============ */
  /* Header en DEUX bandes empilees, chacune avec un role lisible :
     "qui je suis" en haut (marque, compte, appel au don, etat de la
     donnee), "ou je vais" en bas (navigation + outils). Avant, tout
     partageait une seule rangee a repli libre : la marque restait a
     gauche pendant que le reste etait pousse a droite, d'ou le decalage
     visible, et l'ajout du bouton de don faisait basculer sur une
     troisieme ligne. */
  header{
    display:flex; flex-direction:column; gap:var(--sp-2);
    padding-bottom:18px; margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .mark{width:30px; height:30px; flex:none}
  .brand{display:flex; flex-direction:column; gap:1px; margin-right:4px}
  .brand h1{
    font-family:var(--sans); font-size:16px; font-weight:700;
    letter-spacing:.22em; color:var(--text); text-transform:uppercase; white-space:nowrap;
  }
  .brand h1 em{font-style:normal; color:var(--gold)}
  .brand .sub{font-size:10.5px; color:var(--faint); letter-spacing:.08em}
  #statusPill{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line-strong); background:var(--surface);
    padding:5px 12px; font-size:11px; letter-spacing:.06em; color:var(--muted);
    white-space:nowrap;
  }
  #statusPill .dot{width:6px; height:6px; border-radius:50%; background:var(--faint); flex:none}
  #statusPill.live{border-color:rgba(var(--gold-rgb),.45); color:var(--gold)}
  #statusPill.live .dot{background:var(--gold); box-shadow:0 0 8px var(--gold-glow)}
  @media(prefers-reduced-motion:no-preference){
    #statusPill.live .dot{animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  }

  /* ============ ligne d'outils du header ============
     Trois familles, separees par un filet, dans l'ordre de leur poids :
     communaute (le plus discret) -> reglages -> compte, puis l'appel au
     don en dernier. Avant, ces elements etaient melanges aux liens de
     navigation dans une seule rangee : le bouton Soutenir s'y perdait
     alors que c'est le seul element qui demande une action. */
  .hdr-id{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .hdr-bar{display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap}
  /* Etat de la donnee : remonte de la barre de contexte vers la ligne
     d'identite. Il decrit la fraicheur du payload, pas le marche choisi
     -- il appartient donc a "qui je suis", pas a "quel marche". Ca libere
     aussi la place a droite, que la ligne d'identite laissait vide. */
  .hdr-id #statusPill{margin-left:auto}
  .hdrtools{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    flex-wrap:wrap;
  }
  /* Resserre a 2px de part et d'autre : la rangee complete (communaute,
     reglages, compte, appel au don) depassait la largeur utile de DEUX
     pixels et basculait le header sur une troisieme ligne. Le filet reste
     lisible, et la rangee gagne ~30px de marge -- de quoi encaisser des
     libelles anglais un peu plus longs sans rebasculer. */
  .hdrdiv{
    width:1px; height:16px; background:var(--hair-strong);
    flex:0 0 auto; margin:0 2px;
  }

  /* — communaute : volontairement le plus leger de la rangee. La pastille
       porte la couleur de marque, elle suffit a identifier le service
       sans que le libelle ait besoin de crier. — */
  .community{display:flex; align-items:center; gap:0}
  .community a{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    color:var(--faint); font-size:var(--fs-sm); white-space:nowrap;
    padding:5px 5px; border-radius:var(--r-xs);
    transition:color var(--t-fast), background var(--t-fast);
  }
  .community a .dot{
    width:6px; height:6px; border-radius:var(--r-full); flex:0 0 auto;
  }
  .community a.dc .dot{background:#5865F2}   /* bleu de marque Discord */
  .community a.tv .dot{background:#2962FF}   /* bleu de marque TradingView */
  .community a:hover{color:var(--text); background:rgba(var(--white-rgb),var(--a-faint))}

  /* — reglages — */
  #tzTop{
    background:none; border:1px solid transparent; color:var(--muted);
    font:inherit; font-size:var(--fs-sm); padding:5px 2px;
    cursor:pointer; border-radius:var(--r-xs);
  }
  #tzTop:hover{color:var(--text); border-color:var(--hair-strong)}
  #tzTop:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .hdrtools .ivs{opacity:.85}
  .hdrtools .ivs:hover{opacity:1}

  /* — appel au don : SEUL element plein de tout le header, donc le seul
       que l'oeil lit comme cliquable avant meme d'avoir lu le libelle.
       C'est aussi le seul endroit ou je garde un halo anime : ici il ne
       decore pas, il designe l'unique action demandee a l'utilisateur.
       Il respire lentement (4s) pour rester une invitation et non un
       clignotant. — */
  .cta-support{
    display:inline-flex; align-items:center; gap:7px; text-decoration:none;
    color:var(--bg); background:var(--gold);
    font-size:var(--fs-sm); font-weight:var(--fw-bold);
    padding:7px 13px; border-radius:var(--r-sm); white-space:nowrap;
    box-shadow:0 2px 10px -4px rgba(var(--gold-rgb),var(--a-strong));
    animation:donBreath 4s ease-in-out infinite;
    transition:background var(--t-fast), transform var(--t-fast),
               box-shadow var(--t-fast);
  }
  .cta-support .hrt{font-size:13px; line-height:1}
  .cta-support:hover{
    background:var(--gold-hi); animation:none; transform:translateY(-1px);
    box-shadow:0 6px 18px -6px rgba(var(--gold-rgb),.55);
  }
  .cta-support:active{transform:none}
  .cta-support:focus-visible{outline:2px solid var(--gold-hi); outline-offset:3px}
  @keyframes donBreath{
    0%,100%{box-shadow:0 2px 10px -4px rgba(var(--gold-rgb),var(--a-strong))}
    50%    {box-shadow:0 2px 20px -2px rgba(var(--gold-rgb),.55)}
  }
  @media (prefers-reduced-motion:reduce){ .cta-support{animation:none} }
  .ctxbar{
    display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;
  }
  /* statusPill est remonte dans le header : c'est String Pine qui ferme
     desormais la barre de contexte. */
  .ctxbar #pineTopBtn{margin-left:auto}
  #pineTopBtn{
    background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold);
    font-size:12px; font-weight:500; padding:7px 14px; cursor:pointer;
    transition:background .12s ease; white-space:nowrap;
  }

  /* ============ onglets marche ============
     Meme forme que la barre de navigation : un segment unique plutot que
     quatre boutons accoles. Le trait dore sous l'onglet actif et le halo
     ont ete retires — le fond teinte suffit a designer l'actif, et c'est
     le halo qui datait le plus le rendu. */
  .tabs{
    display:inline-flex; align-items:center; gap:2px; padding:2px;
    background:var(--surface2); border:1px solid var(--hair);
    border-radius:var(--r-sm);
  }
  .tabs button{
    background:transparent; color:var(--muted); border:0; cursor:pointer;
    font-family:var(--mono); font-size:var(--fs-sm); font-weight:var(--fw-medium);
    letter-spacing:var(--ls-label); padding:6px 20px; min-height:32px;
    border-radius:var(--r-xs);
    transition:color var(--t-fast), background var(--t-fast);
  }
  .tabs button:hover{color:var(--text); background:rgba(var(--white-rgb),var(--a-faint))}
  .tabs button.on{
    background:rgba(var(--gold-rgb),var(--a-subtle));
    color:var(--gold); font-weight:var(--fw-bold);
  }
  .tabs button:focus-visible{outline:2px solid var(--gold); outline-offset:-2px}

  /* ============ echelle de l'or ============
     GC (future) et XAUUSD (comptant) sont deux marches DISTINCTS calcules
     depuis la meme chaine GLD, pas deux affichages d'un meme marche : le
     future cote au-dessus du comptant et l'ecart atteint plusieurs
     dizaines de dollars. C'est donc un vrai choix, mais subordonne a
     l'onglet GOLD — d'ou un segment plus petit et en retrait, introduit
     par un chevron pour qu'on lise "GOLD > GC | XAUUSD" plutot qu'un
     cinquieme marche pose a cote des quatre autres. L'onglet GOLD reste
     allume sur les deux echelles (cf. paintTabs). */
  .goldsel{
    display:inline-flex; align-items:center; gap:2px; padding:2px;
    background:var(--surface); border:1px solid var(--hair);
    border-radius:var(--r-sm); animation:gsIn .18s ease-out;
  }
  .goldsel::before{
    content:"\203A"; color:var(--faint); font-size:13px; line-height:1;
    padding:0 3px 2px 5px;
  }
  @keyframes gsIn{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
  .goldsel button{
    background:transparent; border:0; cursor:pointer;
    font-family:var(--mono); font-size:var(--fs-xs); letter-spacing:var(--ls-label);
    color:var(--faint); padding:5px 13px; min-height:28px; border-radius:var(--r-xs);
    transition:color var(--t-fast), background var(--t-fast);
  }
  .goldsel button:hover{color:var(--text); background:rgba(var(--white-rgb),var(--a-faint))}
  .goldsel button.on{
    background:rgba(var(--gold-rgb),var(--a-faint));
    color:var(--gold); font-weight:var(--fw-bold);
  }
  .goldsel button:focus-visible{outline:2px solid var(--gold); outline-offset:-2px}

  /* ============ bouton FLUX ============
     Il ne selectionne pas un marche : il bascule le panneau central entre
     chart de prix et gamma projete. Il reste donc HORS du segment des
     marches — l'y integrer le ferait lire comme un cinquieme marche. */
  .fluxToggle{
    position:relative; display:inline-flex; align-items:center;
    background:var(--surface2); color:var(--muted); border:1px solid var(--hair);
    font-family:var(--mono); font-size:var(--fs-sm); font-weight:var(--fw-bold);
    letter-spacing:var(--ls-label); padding:7px 20px; min-height:36px;
    border-radius:var(--r-sm); cursor:pointer;
    transition:color var(--t-fast), background var(--t-fast), border-color var(--t-fast);
  }
  .fluxToggle::before{
    content:""; position:absolute; left:-7px; top:20%; bottom:20%;
    width:1px; background:var(--hair-strong);
  }
  .fluxToggle:hover{color:var(--text); border-color:var(--hair-strong)}
  .fluxToggle.on{
    color:var(--gold); background:rgba(var(--gold-rgb),var(--a-subtle));
    border-color:rgba(var(--gold-rgb),var(--a-medium));
  }
  .fluxToggle:focus-visible{outline:2px solid var(--gold); outline-offset:-2px}
  /* bascule au clic : 220ms, sobre — un aller-retour d'échelle/opacité, pas
     un effet appuyé */
  .fluxToggle.swap{animation:fluxSwap .22s ease-out}
  @keyframes fluxSwap{
    0%{opacity:.4; transform:scale(.93)}
    100%{opacity:1; transform:none}
  }
  @media(prefers-reduced-motion:reduce){ .fluxToggle.swap{animation:none} }

  /* ============ pine top + hint ============ */
  #pineTopBtn:hover{background:rgba(var(--gold-rgb),.24)}
  #pineTopBtn:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  /* ============ stat strip ============ */
  .stats{
    display:grid; grid-template-columns:minmax(190px, 1.4fr) repeat(5, 1fr);
    border:1px solid var(--line); background:var(--surface); margin-bottom:16px;
  }
  .cell{
    padding:12px 16px 11px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:2px; min-width:0;
  }
  .cell:last-child{border-right:none}
  .cell .lbl{
    font-family:var(--sans); font-size:9.5px; font-weight:600; letter-spacing:.18em;
    text-transform:uppercase; color:var(--faint); white-space:nowrap;
  }
  /* Delta intrajournalier : discret, il complète la valeur sans la concurrencer */
  .dlt{font-size:9.5px; font-weight:600; margin-left:3px; opacity:.85;
    font-family:var(--mono)}
  .dlt.pos{color:var(--teal)} .dlt.neg{color:var(--red)}
  .dlt.warn{color:var(--gold); font-size:11px}
  .cell .val{font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
  .cell.price .val{font-size:26px; line-height:1.15; color:var(--gold); letter-spacing:-.01em}
  .cell .val.pos{color:var(--teal)} .cell .val.neg{color:var(--red)}
  @media(max-width:760px){
    .stats{grid-template-columns:repeat(3, 1fr)}
    .cell{min-width:0}
  .cell .val{overflow-wrap:anywhere}
  .cell .val .src{font-size:10px; color:var(--muted); letter-spacing:.02em}
  .cell.price{grid-column:1 / -1}
  }

  /* ============ panels ============ */
  .panel{
    background:linear-gradient(180deg, var(--card-top), var(--card-bottom));
    border:1px solid var(--line); margin-bottom:16px;
  }
  .panel > h2{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    font-family:var(--sans); font-size:10px; font-weight:600; letter-spacing:.2em;
    text-transform:uppercase; color:var(--muted);
    padding:11px 16px; border-bottom:1px solid var(--line);
  }
  .panel > h2::before{content:"▪"; color:var(--gold); margin-right:8px; font-size:8px}
  .panel > h2 .note{font-family:var(--mono); letter-spacing:0; text-transform:none; font-weight:400; font-size:11px; color:var(--faint)}
  .pad{padding:14px 16px}

  /* ============ chart ============ */
  .chartbox{height:400px; position:relative}

  /* ============ flux (gamma dealer, projection prix x temps) ============ */
  /* hauteur du conteneur = contenu (bar/synth/volctx + canevas) ; c'est le
     canevas lui-meme qui est cale sur la meme dimension que .chartbox, pas
     le panneau entier -- sinon un min-height sur le panneau grossit sans
     borne des que le contenu au-dessus (synth/volctx) prend plus de place */
  .fluxbox{display:flex; flex-direction:column}
  .fluxbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 16px; border-bottom:1px solid var(--line); flex:none;
  }
  .fluxleft{display:inline-flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:0}
  .fluxlegend{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono);
    font-size:10.5px; color:var(--muted); white-space:nowrap}
  .fluxsw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-left:10px}
  .fluxsw:first-child{margin-left:0}
  .fluxsw-pos{background:var(--teal)} .fluxsw-neg{background:var(--red)}
  /* trois canevas empilés : cvBg (dégradé) et cvMain (grille/niveaux) ne
     reçoivent aucun événement, seul cvCursor (réticule/infobulle) est
     interactif -- le glisser tactile ne doit jamais scroller la page. */
  .fluxCanvasWrap{position:relative; flex:none; width:100%; height:400px}
  .fluxCanvasWrap canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #fluxCvBg, #fluxCvMain{pointer-events:none}
  /* défaut hors zone de tracé ; "crosshair" (survol) / "grabbing" (glisser)
     appliqués en JS selon la position réelle du pointeur, cf. bindFluxHover */
  #fluxCvCursor{cursor:default; touch-action:none}
  /* rond de chargement : logo + anneau tournant, posé le temps du tout
     premier /api/flow (masqué ensuite pour de bon, cf. loadFlux) -- jamais
     remontré à chaque poll ou changement de marché, où le texte de #fluxNote
     suffit déjà. */
  .fluxloader{position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; background:var(--bg); z-index:5}
  .fluxloader[hidden]{display:none}
  .fluxloader svg, .fluxloader-mark{position:absolute}
  .fluxloader-ring{width:52px; height:52px; animation:fluxloader-spin 1.1s linear infinite}
  .fluxloader-mark{width:34px; height:34px; object-fit:contain; border-radius:50%}
  @keyframes fluxloader-spin{to{transform:rotate(360deg)}}

  /* ---- fluxsynth : verdict unique + une ligne par grecque, JAMAIS moyennees
     (unites differentes) -- meme traitement que le bloc de lecture MAG7 de
     news.html (.verdict/.reads) ---- */
  .fluxsynth{padding:10px 16px 12px; border-top:1px solid var(--line);
    border-bottom:1px solid var(--line); flex:none}
  .fluxsynth .verdict{display:flex; align-items:baseline; gap:10px; margin-bottom:9px}
  .fluxsynth .vlab{font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--faint)}
  .fluxsynth .vval{font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.04em}
  .fluxsynth .verdict.cmp .vval{color:var(--teal)}
  .fluxsynth .verdict.acc .vval{color:var(--red)}
  .fluxsynth .verdict.drf .vval{color:var(--gold)}
  .fluxsynth .verdict.dvg .vval{color:var(--muted)}
  .fluxsynth .fsrows{display:flex; gap:20px; flex-wrap:wrap}
  .fluxsynth .fsrow{display:flex; align-items:baseline; gap:7px; font-family:var(--mono); font-size:11px}
  .fluxsynth .fsk{color:var(--faint); letter-spacing:.06em; text-transform:uppercase; font-size:9.5px}
  .fluxsynth .fsval{font-weight:600}
  .fluxsynth .fsrow.pos .fsval{color:var(--teal)}
  .fluxsynth .fsrow.neg .fsval{color:var(--red)}
  .fluxsynth .fsrow.flat .fsval{color:var(--muted)}
  .fluxsynth .fssens{color:var(--muted); font-size:10px}

  /* ---- fluxvolctx : contexte live volume du jour vs OI figé -- même
     enveloppe que fluxsynth, sous elle ---- */
  .fluxvolctx{padding:8px 16px 12px; border-bottom:1px solid var(--line); flex:none;
    font-family:var(--mono)}
  .fluxvolctx .fvbias{display:flex; align-items:baseline; gap:8px; margin-bottom:8px;
    font-size:11px; flex-wrap:wrap}
  .fluxvolctx .fvbias .fvlab{font-size:9px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--faint)}
  .fluxvolctx .fvbias .fvval{font-weight:700}
  .fluxvolctx .fvbias .fvval.call{color:var(--teal)}
  .fluxvolctx .fvbias .fvval.put{color:var(--red)}
  .fluxvolctx .fvcols{display:flex; gap:18px; flex-wrap:wrap}
  .fluxvolctx .fvcol{flex:1 1 220px; min-width:0}
  .fluxvolctx .fvcol .fvhead{font-size:9px; letter-spacing:.13em; text-transform:uppercase;
    margin-bottom:4px}
  .fluxvolctx .fvcol.call .fvhead{color:var(--teal)}
  .fluxvolctx .fvcol.put .fvhead{color:var(--red)}
  .fluxvolctx .fvrow{font-size:10.5px; padding:1.5px 0; color:var(--muted)}
  .fluxvolctx .fvrow .fvk{color:var(--text); font-weight:600}
  .fluxvolctx .fvrow .fvd{color:var(--faint)}
  .fluxvolctx .fvrow .fvr{padding:0 4px; border-radius:3px; margin-left:2px}
  .fluxvolctx .fvrow.hi{color:var(--text)}
  .fluxvolctx .fvrow.hi .fvr{background:var(--gold-soft); color:var(--gold); font-weight:700}
  .fluxvolctx .fvempty{color:var(--faint); font-size:10.5px}
  .dp{display:flex; gap:22px; align-items:center; flex-wrap:wrap}
  .dp-big{font-family:var(--mono); font-size:30px; color:var(--text); line-height:1}
  .dp-sub{font-size:11px; color:var(--muted); margin-top:5px}
  .dp-tag{
    display:inline-block; margin-top:8px; padding:3px 10px; font-size:9.5px;
    letter-spacing:.16em; text-transform:uppercase; border:1px solid var(--line-strong);
  }
  .dp-tag.up{color:var(--teal); border-color:rgba(var(--teal-rgb),.45)}
  .dp-tag.dn{color:var(--red); border-color:rgba(var(--red-rgb),.45)}
  .dp-tag.mid{color:var(--muted)}
  #dpSpark{flex:none}
  /* Barre-séparateur repliable, réutilisable (dark pool, et gamma plus tard) */
  .gtog{display:flex; align-items:center; gap:12px; margin:4px 0 14px}
  .gtog .gline{flex:1; height:1px; background:var(--line)}
  .gtog button{background:transparent; border:1px solid var(--line-strong); border-radius:16px;
    color:var(--muted); font-family:inherit; font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; padding:4px 13px; cursor:pointer; display:inline-flex;
    align-items:center; gap:7px; transition:color .15s, border-color .15s}
  .gtog button:hover{color:var(--gold); border-color:rgba(var(--gold-rgb),.4)}
  .gtog .arw{font-size:8px; transition:transform .2s}
  .gtog.open .arw{transform:rotate(180deg)}
  .gtog.open button{color:var(--gold); border-color:rgba(var(--gold-rgb),.4)}
  /* Carte de contexte dark pool : verte accumulation, rouge distribution */
  #dpCtx{border:1px solid var(--line-strong); border-radius:10px; padding:13px 16px; margin-top:2px}
  #dpCtx.up{border-color:rgba(var(--teal-rgb),.45); background:rgba(var(--teal-rgb),.06)}
  #dpCtx.dn{border-color:rgba(var(--red-rgb),.45); background:rgba(var(--red-rgb),.06)}
  #dpCtx.mid{border-color:var(--line-strong); background:transparent}
  #dpCtx .gc-h{font-size:14px; font-weight:600; margin-bottom:5px}
  #dpCtx.up .gc-h{color:var(--teal)}
  #dpCtx.dn .gc-h{color:var(--red)}
  #dpCtx.mid .gc-h{color:var(--muted)}
  #dpCtx .gc-b{font-size:12.5px; line-height:1.5; color:var(--text)}
  #dpCtx .gc-f{font-size:9.5px; letter-spacing:.06em; color:var(--faint);
    text-transform:uppercase; margin-top:7px}
  .cbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 12px; border-bottom:1px solid var(--line);
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .cbar::-webkit-scrollbar{display:none}
  .ivs{display:inline-flex; border:1px solid var(--line); background:var(--surface2); flex:none}
  .ivs button{
    background:transparent; color:var(--faint); border:none;
    border-right:1px solid var(--line); padding:6px 13px; font-size:11px;
    cursor:pointer; letter-spacing:.04em; font-family:var(--mono);
    min-height:30px; transition:color .12s ease, background .12s ease;
  }
  .ivs button:last-child{border-right:none}
  .ivs button:hover{color:var(--text)}
  .ivs button.on{color:var(--gold); background:var(--gold-soft); font-weight:600}
  .ivs button:focus-visible{outline:2px solid var(--gold); outline-offset:-2px}
  .chips{display:inline-flex; gap:8px; flex:none}
  .chips button{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface2); border:1px solid var(--line); color:var(--faint);
    font:inherit; font-size:11px; letter-spacing:.05em; padding:6px 14px;
    min-height:30px; cursor:pointer; transition:all .12s ease;
  }
  .chips button:hover{color:var(--text); border-color:var(--line-strong)}
  .chips button.on{
    color:var(--gold); border-color:rgba(var(--gold-rgb),.5);
    background:linear-gradient(180deg, rgba(var(--gold-rgb),.14), rgba(var(--gold-rgb),.06));
  }
  .chips .led{
    width:7px; height:7px; border-radius:50%; background:var(--line-hi); flex:none;
    transition:all .12s ease;
  }
  .chips button.on .led{background:var(--gold); box-shadow:0 0 7px var(--gold-glow)}
  .chips button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  /* CODE COULEUR PAR FAMILLE : or = GEX, teal = EM, violet = Open.
     La pastille garde une teinte même éteinte, pour identifier la famille
     d'un coup d'œil sans avoir à l'activer. */
  .chips button[data-g="gex"] .led{background:rgba(var(--gold-rgb),.28)}
  .chips button[data-g="gex"]:hover{border-color:rgba(var(--gold-rgb),.45)}
  .chips button[data-g="gex"].on{
    color:var(--gold); border-color:rgba(var(--gold-rgb),.5);
    background:linear-gradient(180deg, rgba(var(--gold-rgb),.15), rgba(var(--gold-rgb),.05));
  }
  .chips button[data-g="gex"].on .led{background:var(--gold); box-shadow:0 0 8px rgba(var(--gold-rgb),.6)}
  .chips button[data-g="em"] .led{background:rgba(var(--teal-rgb),.28)}
  .chips button[data-g="em"]:hover{border-color:rgba(var(--teal-rgb),.45)}
  .chips button[data-g="em"].on{
    color:var(--teal); border-color:rgba(var(--teal-rgb),.5);
    background:linear-gradient(180deg, rgba(var(--teal-rgb),.15), rgba(var(--teal-rgb),.05));
  }
  .chips button[data-g="em"].on .led{background:var(--teal); box-shadow:0 0 8px rgba(var(--teal-rgb),.6)}
  .chips button[data-g="open"] .led{background:rgba(var(--violet-rgb),.28)}
  .chips button[data-g="open"]:hover{border-color:rgba(var(--violet-rgb),.45)}
  .chips button[data-g="open"].on{
    color:var(--violet); border-color:rgba(var(--violet-rgb),.5);
    background:linear-gradient(180deg, rgba(var(--violet-rgb),.15), rgba(var(--violet-rgb),.05));
  }
  .chips button[data-g="open"].on .led{background:var(--violet); box-shadow:0 0 8px rgba(var(--violet-rgb),.6)}
  /* ============ table ============ */
  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
  thead th{
    font-family:var(--sans); font-size:9.5px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--faint); text-align:left;
    padding:9px 16px; border-bottom:1px solid var(--line);
  }
  thead th:not(:first-child){text-align:right}
  td{padding:7px 16px; border-bottom:1px solid var(--line); font-size:12.5px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .1s ease}
  tbody tr:hover{background:rgba(var(--white-rgb),.018)}
  td.price{font-weight:600; text-align:right; white-space:nowrap}
  td.dist{color:var(--muted); text-align:right; white-space:nowrap; width:92px; font-size:11.5px}
  .tick{display:inline-block; width:8px; height:8px; margin-right:9px; vertical-align:baseline; border:1.5px solid currentColor}
  .k-res{color:var(--teal)} .k-sup{color:var(--red)} .k-flip{color:var(--gold)}
  .k-res0{color:var(--teal); opacity:.75} .k-sup0{color:var(--red); opacity:.75}
  .k-gpos{color:var(--teal); opacity:.55} .k-gneg{color:var(--red); opacity:.55}
  .k-emh,.k-eml{color:var(--text); opacity:.85} .k-emb{color:var(--text); opacity:.55}
  .k-ivh,.k-ivl{color:var(--muted)} .k-mpain{color:var(--gold); opacity:.75}
  .k-flip .tick, .k-mpain .tick{transform:rotate(45deg)}
  .k-hgex{color:var(--gold)}
  .k-hgex .tick{background:currentColor}
  .k-res .tick, .k-res0 .tick, .k-gpos .tick{background:currentColor}
  .k-sup .tick, .k-sup0 .tick, .k-gneg .tick{background:currentColor}

  /* ============ two-column EM / Pine ============ */
  .duo{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  @media(max-width:820px){.duo{grid-template-columns:1fr}}
  .duo .panel{margin-bottom:0}
  .em-band{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface2); border:1px solid var(--line); padding:12px 14px; margin-bottom:12px;
  }
  .em-band .v{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
  .em-band .up{color:var(--teal)} .em-band .dn{color:var(--red)}
  .em-mid{text-align:center; color:var(--muted); font-size:11px}
  .em-mid b{color:var(--gold); font-size:14px; display:block}
  .em-sub{color:var(--muted); font-size:11.5px; padding:2px 0; font-variant-numeric:tabular-nums}
  .em-sub .dn{color:var(--red)} .em-sub .up{color:var(--teal)}
  #pineStr{
    background:var(--surface2); border:1px solid var(--line); padding:11px 12px;
    font-size:10.5px; line-height:1.7; color:var(--muted); word-break:break-all;
    max-height:118px; overflow:auto; margin-bottom:12px;
  }
  #copyBtn{
    width:100%; background:var(--gold-soft); color:var(--gold);
    border:1px solid var(--gold); font-size:12px; font-weight:500;
    padding:9px 14px; cursor:pointer; transition:background .12s ease;
  }
  #copyBtn:hover{background:rgba(var(--gold-rgb),.24)}
  #copyBtn:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  /* ============ states / footer ============ */
  #status{
    color:var(--muted); padding:36px 0; text-align:center;
    border:1px dashed var(--line); background:var(--surface);
  }
  footer{
    margin-top:26px; padding-top:14px; border-top:1px solid var(--line);
    color:var(--faint); font-size:11px; line-height:1.7;
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  footer a{color:var(--faint); text-decoration:none}
  footer a:hover{color:var(--gold)}
  @media(prefers-reduced-motion:no-preference){
    .panel, .stats{animation:rise .28s ease-out both}
    @keyframes rise{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}
  }

  /* ============ mobile ============ */
  @media(max-width:640px){
    main{padding:16px 12px 40px}
    /* cibles tactiles confortables + pas de zoom auto iOS sur les champs */
    .chips button, .ivs button, .tabs button, .fluxToggle, #tzTop{min-height:40px}
    .chips button{padding:8px 13px; font-size:11.5px}
    .fluxToggle{width:100%; margin:2px 0 16px; justify-content:center}
    .fluxToggle::before{display:none}
    input, select, textarea{font-size:16px}
    /* le sélecteur de fuseau et la langue passent à la ligne proprement */
    .hdrtools{flex-wrap:wrap; row-gap:6px}
    .hdrdiv{display:none}
    header{gap:10px; padding-bottom:14px; margin-bottom:14px}
    .brand h1{font-size:14px; letter-spacing:.16em}
    .brand .sub{font-size:10px}
    .hdrtools{width:100%; margin-left:0; justify-content:flex-start}
    .community a{padding:6px 8px}
    /* L'appel au don ferme la rangee et reste pleine cible tactile. */
    .cta-support{margin-left:auto; min-height:40px}
    .hdr-id #statusPill{margin-left:0}
    #pineTopBtn{padding:9px 12px; margin-left:auto}
    .tabs button{padding:10px 0; flex:1; min-width:64px}
    .tabs{display:flex; width:100%}
    .stats{grid-template-columns:repeat(2, 1fr)}
    .cell{padding:10px 12px}
    .cell.price .val{font-size:22px}
    .chartbox{height:300px}
    .fluxCanvasWrap{height:300px}
    .fluxsynth{padding:8px 10px 10px}
    .fluxsynth .fsrows{flex-direction:column; gap:5px}
    .fluxvolctx{padding:8px 10px 10px}
    .fluxvolctx .fvcols{flex-direction:column; gap:8px}
    /* fvcol portait flex:1 1 220px pour le cote-a-cote desktop -- une fois
       empile en colonne (flex-direction:column ci-dessus), ce 220px devient
       une hauteur MINIMALE (flex-basis suit l'axe principal, qui bascule en
       vertical) : un grand vide entre CALLS et PUTS, meme quand les lignes
       ne remplissent pas 220px de haut. */
    .fluxvolctx .fvcol{flex:none}
    /* barre de controles Flux : chaque groupe (note, modes, strikes/histo,
       legende) sur sa propre ligne pleine largeur plutot qu'un flex-wrap
       "en vrac" ou l'espacement uniforme (gap) ne distingue pas les groupes
       -- correspond au constat "aucun sens" en usage reel. */
    .fluxbar{padding:8px 10px; flex-wrap:wrap; row-gap:8px; align-items:flex-start}
    .fluxleft{width:100%; gap:8px}
    .fluxleft .note{width:100%}
    .fluxleft .chips{width:100%}
    #fluxModeChips button{flex:1; text-align:center}
    .fluxlegend{width:100%; justify-content:flex-end; margin-top:2px}
    .cbar{padding:8px 10px}
    .ivs button{padding:8px 12px; min-height:36px}
    thead th, td{padding-left:12px; padding-right:12px}
    td.dist{width:auto; font-size:11px}
    .em-band .v{font-size:15px}
    footer{flex-direction:column; gap:4px}
  }

  /* ═══════════════ couche de raffinement ═══════════════ */
  /* — profondeur d'ambiance : lueur froide basse en écho au beam doré haut — */
  body{
    background:
      radial-gradient(1100px 420px at 50% -180px, rgba(var(--gold-rgb),.055), transparent 62%),
      radial-gradient(900px 500px at 50% 118%, rgba(var(--teal-rgb),.035), transparent 60%),
      var(--bg);
  }
  ::-webkit-scrollbar{width:9px; height:9px}
  ::-webkit-scrollbar-thumb{background:var(--scroll-thumb); border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--line-hi)}
  ::-webkit-scrollbar-track{background:transparent}

  .brand h1 em{text-shadow:0 0 22px var(--gold-glow)}
  .brand .sub{font-variant-numeric:tabular-nums}


  #statusPill{min-height:32px; font-variant-numeric:tabular-nums}
  #pineTopBtn{min-height:32px}

  .stats{
    box-shadow:inset 0 1px 0 rgba(var(--white-rgb),.03), 0 14px 34px -18px rgba(var(--black-rgb),.65);
  }
  .cell{transition:background .14s ease}
  .cell:hover{background:rgba(var(--white-rgb),.016)}
  .cell.price{
    background:radial-gradient(340px 130px at 18% 0%, rgba(var(--gold-rgb),.09), transparent 70%);
  }
  .cell.price .val{font-size:28px; letter-spacing:-.015em; text-shadow:0 0 26px rgba(var(--gold-rgb),.22)}
  .cell .lbl{padding-bottom:1px}

  .panel{
    box-shadow:inset 0 1px 0 rgba(var(--white-rgb),.03), 0 14px 34px -18px rgba(var(--black-rgb),.65);
  }
  .panel > h2{
    background:linear-gradient(180deg, rgba(var(--white-rgb),.015), transparent);
  }
  .panel > h2::before{text-shadow:0 0 8px var(--gold-glow)}

  .cbar{background:linear-gradient(180deg, rgba(var(--white-rgb),.012), transparent)}
  .ivs button, .chips button{min-height:32px}
  .ivs button:active, .chips button:active, #pineTopBtn:active, .tabs button:active,
  .fluxToggle:active{
    transform:translateY(1px);
  }

  tbody tr:hover{
    background:rgba(var(--white-rgb),.02);
    box-shadow:inset 2px 0 0 rgba(var(--gold-rgb),.5);
  }
  tbody tr{box-shadow:inset 2px 0 0 transparent; transition:background .12s ease, box-shadow .12s ease}
  td.price{font-size:13px}
  thead th{border-bottom:1px solid var(--line-strong)}

  #pineStr{
    box-shadow:inset 0 2px 8px rgba(var(--black-rgb),.4);
    scrollbar-width:thin;
  }
  #copyBtn{
    background:linear-gradient(180deg, rgba(var(--gold-rgb),.2), rgba(var(--gold-rgb),.1));
  }
  #copyBtn:hover{background:linear-gradient(180deg, rgba(var(--gold-rgb),.3), rgba(var(--gold-rgb),.16))}
  #copyBtn:active{transform:translateY(1px)}

  .em-band{
    box-shadow:inset 3px 0 0 rgba(var(--red-rgb),.45), inset -3px 0 0 rgba(var(--teal-rgb),.45);
  }
  .em-mid b{font-size:15px}

  footer{position:relative; border-top:none; padding-top:16px}
  footer::before{
    content:""; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, var(--line), rgba(var(--gold-rgb),.28), var(--line));
  }

  @media(prefers-reduced-motion:no-preference){
    .stats{animation-delay:.02s}
    .panel:nth-of-type(1){animation-delay:.06s}
    .panel:nth-of-type(2){animation-delay:.1s}
    .duo .panel:nth-child(1){animation-delay:.14s}
    .duo .panel:nth-child(2){animation-delay:.18s}
  }

  /* ═══════════════ couche premium ═══════════════ */
  /* — mesh gradient ambiant : deux nappes dérivant lentement derrière le verre — */
  html::before, html::after{
    content:""; position:fixed; z-index:-2; border-radius:50%;
    filter:blur(90px); pointer-events:none;
  }
  html::before{
    width:820px; height:520px; top:-260px; left:50%; margin-left:-500px;
    background:radial-gradient(closest-side, rgba(var(--gold-rgb),.14), transparent 70%);
    animation:drift1 46s ease-in-out infinite alternate;
  }
  html::after{
    width:760px; height:560px; bottom:-320px; right:-180px;
    background:
      radial-gradient(closest-side, rgba(var(--teal-rgb),.11), transparent 70%),
      radial-gradient(closest-side, rgba(99,102,241,.07), transparent 75%);
    animation:drift2 58s ease-in-out infinite alternate;
  }
  @keyframes drift1{from{transform:translate(0,0) scale(1)} to{transform:translate(140px,60px) scale(1.12)}}
  @keyframes drift2{from{transform:translate(0,0) scale(1)} to{transform:translate(-120px,-80px) scale(1.08)}}
  /* trame d'ingénierie à peine perceptible */
  body{
    background:
      linear-gradient(rgba(var(--white-rgb),.014) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--white-rgb),.014) 1px, transparent 1px),
      radial-gradient(1100px 420px at 50% -180px, rgba(var(--gold-rgb),.05), transparent 62%),
      var(--bg);
    background-size:44px 44px, 44px 44px, auto, auto;
  }

  /* — panneaux verre + bordure en dégradé — */
  .panel, .stats{
    background:
      linear-gradient(180deg, var(--card-top), var(--card-bottom)) padding-box,
      linear-gradient(135deg, rgba(var(--gold-rgb),.32), rgba(var(--white-rgb),.06) 34%,
                      rgba(var(--white-rgb),.04) 66%, rgba(var(--teal-rgb),.22)) border-box;
    border:1px solid transparent;
  }



  /* — LIVE : liseré conique rotatif — */
  #statusPill{position:relative; background:var(--surface); border:1px solid transparent; overflow:visible}
  #statusPill::before{
    content:""; position:absolute; inset:-1px; z-index:-1; padding:1px;
    background:conic-gradient(from var(--pa, 0deg),
      rgba(var(--gold-rgb),.0), rgba(var(--gold-rgb),.7), rgba(var(--gold-rgb),.0) 32%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .3s ease;
  }
  @property --pa{syntax:"<angle>"; initial-value:0deg; inherits:false}
  #statusPill.live::before{opacity:1; animation:ring 3.2s linear infinite}
  @keyframes ring{to{--pa:360deg}}

  /* — wordmark : reflet doré balayant — */
  .brand h1 em{
    background:linear-gradient(100deg, var(--gold) 42%, var(--gold-pale) 50%, var(--gold) 58%);
    background-size:230% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 7s ease-in-out infinite;
  }
  @keyframes shine{0%, 55%{background-position:120% 0} 85%, 100%{background-position:-40% 0}}

  /* — lueur au survol — */
  #pineTopBtn:hover, .chips button.on:hover{box-shadow:0 8px 22px -10px var(--gold-glow)}

  /* — cellule prix : halo respirant discret — */
  @media(prefers-reduced-motion:no-preference){
    /* entrées en scène : blur-in */
    .panel, .stats{animation-name:riseblur}
    @keyframes riseblur{
      from{opacity:0; transform:translateY(7px); filter:blur(5px)}
      to{opacity:1; transform:none; filter:blur(0)}
    }
  }
  @media(prefers-reduced-motion:reduce){
    html::before, html::after{animation:none}
    .brand h1 em{animation:none; color:var(--gold); background:none}
    #statusPill.live::before{animation:none}
  }
  /* Bouton de soutien : même gabarit que les autres liens de la barre,
     juste souligné d'un liseré doré et d'un halo qui respire lentement.
     Aucun pop-up, aucune interruption : un simple lien externe. */
  /* Accès membre : chip près du logo, dans la même famille visuelle que les
     liens de navigation. Deux cibles de clic distinctes et sans ambiguïté :
     le corps du bouton mène toujours au profil (ou ouvre la connexion si
     déconnecté), le caret ouvre un petit menu où "Se déconnecter" est une
     action séparée et explicite — jamais accidentelle. */
  .authChip{position:relative; display:inline-flex; align-items:center; margin-left:14px}
  #authBtn{
    background:var(--surface2); border:1px solid var(--line-strong);
    color:var(--muted); font:inherit; font-size:11.5px; padding:5px 12px 5px 6px;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    white-space:nowrap; transition:color .12s ease, border-color .12s ease;
  }
  #authBtn:hover{color:var(--gold); border-color:rgba(var(--gold-rgb),.5)}
  #authBtn.on{color:var(--text); border-color:rgba(var(--teal-rgb),.5)}
  #authBtn:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .authAvatar{
    width:20px; height:20px; border-radius:50%; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600; background:var(--gold-soft); color:var(--gold);
    transition:background .12s ease, color .12s ease;
  }
  #authBtn.on .authAvatar{background:rgba(var(--teal-rgb),.16); color:var(--teal)}
  .authCaret{
    background:var(--surface2); border:1px solid var(--line-strong); border-left:none;
    color:var(--muted); cursor:pointer; padding:0 8px; align-self:stretch;
    display:inline-flex; align-items:center; font-size:9px;
    transition:color .12s ease, border-color .12s ease;
  }
  .authCaret:hover{color:var(--gold); border-color:rgba(var(--gold-rgb),.5)}
  .authCaret[aria-expanded="true"]{color:var(--gold)}
  .authCaret:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .authMenu{
    position:absolute; top:calc(100% + 6px); left:0; min-width:180px; z-index:70;
    background:var(--surface); border:1px solid var(--line-strong);
    box-shadow:0 14px 32px -14px rgba(var(--black-rgb),.6);
    display:flex; flex-direction:column; padding:6px;

async function loadDark(){
  const big = $("dpRatio"), sub = $("dpDelta"), tag = $("dpTag");
  // FINRA ne couvre pas le COMEX : pas d'équivalent Dark Pool pour l'or,
  // ce n'est pas un manque temporaire — ne pas appeler /api/dark (400 garanti).
  if (IS_GOLD(TARGET)){
    big.textContent = "—";
    sub.textContent = t("dpGoldUnavail");
    tag.hidden = true;
    LAST_DARK = null;
    renderDark(null);
    const cv = $("dpSpark"), sctx = cv.getContext("2d");
    sctx.clearRect(0, 0, cv.width, cv.height);
    return;
  }
  try{
    const r = await fetch(`/api/dark?target=${TARGET}`);
    const d = await r.json();
    if (!d.last){
      big.textContent = "—";
      sub.textContent = t("dpBuild");
      tag.hidden = true; LAST_DARK = d; renderDark(d);
      return;
    }
    LAST_DARK = d;
    const m = darkMetrics(d);
    big.textContent = d.last.r.toFixed(1) + "%";
    const dd = m ? m.dd : (d.avg20 != null ? d.last.r - d.avg20 : 0);
    sub.textContent = `${d.sym} · ${d.last.d.slice(6)}/${d.last.d.slice(4,6)} · ${t("dpAvg")} ${d.avg20 != null ? d.avg20.toFixed(1) + "%" : "—"} (${dd >= 0 ? "+" : ""}${dd.toFixed(1)} pt)`;
    tag.hidden = false;
    // Régime issu de darkMetrics (bande ±1σ) : la pastille et la carte ne
    // peuvent plus se contredire, et le seuil s'adapte à chaque symbole
    // au lieu d'un ±1,5 pt fixe qui n'a pas le même sens sur QQQ et SPY.
    const reg = m ? m.regime : "mid";
    if (reg === "up"){ tag.textContent = t("dpAcc"); tag.className = "dp-tag up"; }
    else if (reg === "dn"){ tag.textContent = t("dpDist"); tag.className = "dp-tag dn"; }
    else { tag.textContent = t("dpNeu"); tag.className = "dp-tag mid"; }
    renderDark(d);
    const cv = $("dpSpark"), ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const W = 320, H = 66;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const rows = d.days.filter(x => x.r != null);
    if (rows.length >= 2){
      const vs = rows.map(x => x.r);
      const lo = Math.min(...vs) - .5, hi = Math.max(...vs) + .5;
      const X = i => 6 + i * (W - 12) / (rows.length - 1);
      const Y = v => H - 8 - (v - lo) / (hi - lo) * (H - 16);
      if (d.avg20 != null){
        ctx.strokeStyle = "rgba(240,185,11,.4)"; ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(6, Y(d.avg20)); ctx.lineTo(W - 6, Y(d.avg20)); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.strokeStyle = C.teal; ctx.lineWidth = 1.6;
      ctx.beginPath();
      rows.forEach((x, i) => { const px = X(i), py = Y(x.r); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.stroke();
      const lx = X(rows.length - 1), ly = Y(rows[rows.length - 1].r);
      ctx.fillStyle = C.gold;
      ctx.beginPath(); ctx.arc(lx, ly, 2.6, 0, 7); ctx.fill();
    }
  }catch(_){
    big.textContent = "—"; sub.textContent = t("dpUnavail"); tag.hidden = true;
    LAST_DARK = null; renderDark(null);
  }
}

/* ═══ CONTEXTE DARK POOL ═══════════════════════════════════════════════
   Métriques dérivées de ce que /api/dark renvoie déjà (days, last, avg20) :
   série de séances du même côté, pente 5 jours, position dans le range, et
   surtout une bande ±1σ qui remplace le seuil fixe de ±1,5 pt — un même
   écart n'a pas la même signification sur QQQ et sur SPY. Un plancher de
   1 pt évite qu'une série quasi plate bascule sur du bruit. */
function darkMetrics(d){
  if (!d || !d.last || d.avg20 == null) return null;
  const rows = (d.days || []).filter(x => x.r != null);
  if (rows.length < 2) return null;
  const vals = rows.map(x => x.r);
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const sd = Math.sqrt(vals.reduce((a, b) => a + (b - mean) * (b - mean), 0) / vals.length) || 0;
  const band = Math.max(sd, 1.0);
  const dd = d.last.r - d.avg20;
  const z = dd / band;
  const side = dd >= 0 ? 1 : -1;
  let streak = 0;
  for (let i = rows.length - 1; i >= 0; i--){
    if (Math.sign(rows[i].r - d.avg20) === side) streak++; else break;
  }
  const prev = rows[Math.max(0, rows.length - 1 - 5)];
  const d5 = d.last.r - prev.r;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pct = hi > lo ? Math.round((d.last.r - lo) / (hi - lo) * 100) : 50;
  const regime = dd >= band ? "up" : dd <= -band ? "dn" : "mid";
  return {r: d.last.r, dd, z, band, sd, streak, d5, pct, regime};
}

function renderDark(d){
  const el = $("dpCtx");
  if (!el) return;
  if (IS_GOLD(TARGET)){
    el.className = "mid";
    el.innerHTML = `<div class="gc-b">${t("dpGoldUnavail")}</div>`;
    return;
  }
  const m = darkMetrics(d);
  if (!m){
    el.className = "mid";
    el.innerHTML = `<div class="gc-b">${t("dpBuild")}</div>`;
    return;
  }
  el.className = m.regime;
  const head = m.regime === "up" ? t("dpAcc") : m.regime === "dn" ? t("dpDist") : t("dpNeu");
  el.innerHTML = `<div class="gc-h">${head}</div>`
    + `<div class="gc-b">${t("dpBody")(m)}</div>`
    + `<div class="gc-f">${t("dpExp")(d.sym, TARGET)}</div>`;
}

// Jeton de course : un clic rapide sur un autre onglet pendant qu'un switch
// est encore en vol ne doit jamais laisser la réponse la plus LENTE écraser
// l'affichage après la plus rapide. Chaque loadTarget() capture son propre
// numéro et vérifie qu'il est toujours le plus récent avant de toucher au DOM.
let TARGET_SEQ = 0;

async function loadTarget(){
  const mySeq = ++TARGET_SEQ;
  paintTabs();
  const _t0 = PageLoader.begin($("stage"));
  $("status").style.display = "block";
  $("status").textContent = t("loading") + " " + TARGET + "…";
  $("app").style.display = "none";
  // levels.json et les bougies (/api/chart, /api/quote) sont trois payloads
  // indépendants -- les enchaîner (comme avant : levels -> chart -> quote)
  // coûtait 3 allers-retours réseau au switch de marché. Démarrer les
  // bougies ICI, en parallèle du fetch des niveaux, ramène ça à un seul
  // aller-retour perçu.
  const barsFetch = prefetchBars(TARGET, CHART.iv);
  let data;
  try{
    data = await (await fetch("levels.json?target=" + TARGET + "&t=" + Date.now())).json();
  }catch(e){}
  if (mySeq !== TARGET_SEQ) return;   // un switch plus récent a pris le relais entre-temps
  if (data && !data.error){ await show(data, barsFetch); }
  else {
    $("status").textContent = t("noSnap")(TARGET);
  }
  if (mySeq !== TARGET_SEQ) return;
  // plancher de durée : masque le blanc/texte brut sous le rond de marque,
  // même quand la réponse est déjà en cache et revient quasi instantanément
  await PageLoader.end($("stage"), _t0);
}

/* ═══ ACCÈS MEMBRE ══════════════════════════════════════════════════════
   Le mot de passe ne transite qu'une fois, vers /api/auth ; la session vit
   ensuite dans un cookie HttpOnly que le JavaScript ne peut pas lire — c'est
   volontaire, cela protège la session même en cas de faille d'affichage. */
let AUTH_USER = null, AUTH_MODE = "login";

function authPaint(){
  const btn = $("authBtn"), lbl = $("authLbl"), avatar = $("authAvatar"), caret = $("authCaret");
  if (!btn) return;

  if (avatar) avatar.textContent = AUTH_USER ? AUTH_USER.slice(0, 1).toUpperCase() : "⬡";
  Shell.setAuth(!!AUTH_USER);   // retire le cadenas des destinations gardées
  btn.title = AUTH_USER ? t("authProfileTip") : t("authInTip");
  if (caret) { caret.hidden = !AUTH_USER; caret.title = t("authMenuAria"); }
  const mpl = $("authMenuProfileLbl"); if (mpl) mpl.textContent = t("authProfileTip");
  const mll = $("authMenuLogoutLbl"); if (mll) mll.textContent = t("authLogout");
  if (!AUTH_USER) closeAuthMenu();
}

function closeAuthMenu(){
  const menu = $("authMenu"), caret = $("authCaret");
  if (menu) menu.hidden = true;
  if (caret) caret.setAttribute("aria-expanded", "false");
}

function toggleAuthMenu(){
  const menu = $("authMenu"), caret = $("authCaret");
  if (!menu || !caret) return;
  const willOpen = menu.hidden;
  menu.hidden = !willOpen;
  caret.setAttribute("aria-expanded", String(willOpen));
}

async function authSubmit(){
  const msg = $("authMsg"), go = $("authGo");
  const user = $("authUser").value.trim();
  const pass = $("authPass").value;
  const code = $("authCode").value.trim();
  const email = $("authEmail").value.trim();
  if (!user || !pass){ msg.className = "err"; msg.textContent = t("authFill"); return; }
  go.disabled = true;
  msg.className = ""; msg.textContent = "…";
  try{
    const r = await fetch(`/api/auth?action=${AUTH_MODE}`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user, pass, code, email}),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Erreur");
    AUTH_USER = d.user;
    authPaint();
    msg.className = "ok"; msg.textContent = t("authWelcome");
    setTimeout(() => {
      $("authWrap").hidden = true;
      const u = new URL(location.href);
      const next = u.searchParams.get("next");
      if (next) location.href = next;          // retour vers la page demandée
    }, 500);
  }catch(e){
    msg.className = "err"; msg.textContent = e.message;
  }finally{
    go.disabled = false;
  }
}

(function wireAuth(){
  const btn = $("authBtn");
  if (!btn || btn._wired) return;
  btn._wired = true;
  btn.onclick = () => {
    if (!AUTH_USER) return authOpen("login");
    location.href = "/profile";
  };
  const caret = $("authCaret");
  if (caret) caret.onclick = (e) => { e.stopPropagation(); toggleAuthMenu(); };
  $("authMenuLogout").onclick = () => { closeAuthMenu(); authLogout(); };
  document.addEventListener("click", (e) => {
    const chip = $("authChip");
    if (chip && !chip.contains(e.target)) closeAuthMenu();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAuthMenu(); });
  $("authClose").onclick = () => { $("authWrap").hidden = true; };
  $("authWrap").onclick = e => { if (e.target === $("authWrap")) $("authWrap").hidden = true; };
  $("authSwap").onclick = () => authOpen(AUTH_MODE === "login" ? "register" : "login");
  $("authGo").onclick = authSubmit;
  for (const id of ["authUser", "authPass", "authCode", "authEmail"])
    $(id).addEventListener("keydown", e => { if (e.key === "Enter") authSubmit(); });
  // état de session + ouverture automatique si on vient d'une page protégée
  fetch("/api/auth").then(r => r.ok ? r.json() : null).then(d => {
    AUTH_USER = d && d.user ? d.user : null;
    authPaint();
    if (!AUTH_USER && new URL(location.href).searchParams.get("login")) authOpen("login");
  }).catch(() => authPaint());
})();
