<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GexDash — Macro</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<!-- Palette : le :root vit dans theme.css, source unique partagée par
     toutes les pages. Ne pas redéclarer de token de couleur ici. -->
<link rel="stylesheet" href="/theme.css">
<script src="/shell.js"></script>
<style>
  /* GARDE-FOU : l'attribut hidden doit toujours l'emporter. Sans cette règle,
     une déclaration display: sur un id ou une classe le neutralise — c'est ce
     qui affichait la fenêtre de connexion en permanence, sans pouvoir la
     fermer. Le !important est ici volontaire et sûr. */
  [hidden]{display:none !important}

  
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); height:100vh; overflow:hidden; position:relative}

  .sess{display:flex; align-items:center; gap:6px; font-size:10px; color:var(--muted); letter-spacing:.08em; font-family:var(--mono)}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--faint)}
  .dot.live{background:var(--teal); box-shadow:0 0 7px rgba(var(--teal-rgb),.85); animation:pulse 1.8s infinite}
  .dot.pre,.dot.post{background:var(--gold)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ── macro synthesis banner ─────────────────────────────────── */
  .macro{margin:14px 20px 0; border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:14px 18px}
  .macro-h{display:flex; align-items:center; gap:9px; font-size:12px; letter-spacing:.06em; color:var(--text); margin-bottom:12px}
  .macro-h .ic{color:var(--teal)}
  .metrics{display:flex; gap:10px; flex-wrap:wrap}
  .metric{flex:1 1 0; min-width:120px; text-align:center; padding:4px 6px}
  .metric .ml{font-size:11px; color:var(--muted); margin-bottom:5px}
  .metric .mv{font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:.02em}
  .metric .mt{font-family:var(--mono); font-size:11px; margin-top:3px; display:flex; align-items:center; justify-content:center; gap:4px}
  .mt.rising{color:var(--teal)} .mt.falling{color:var(--red)} .mt.stable{color:var(--faint)}
  .scen{margin-top:13px; padding-top:13px; border-top:1px solid var(--line)}
  .scen-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .scen-row .lab{font-size:13px; font-weight:600}
  .scen-row .lab .ic{color:var(--teal); margin-right:6px}
  .bias{margin-left:auto; display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px}
  .biaschip{padding:3px 10px; border:1px solid; border-radius:6px; font-size:11px; letter-spacing:.06em; font-weight:600}
  .biaschip.bullish{color:var(--teal); border-color:rgba(var(--teal-rgb),.5)}
  .biaschip.bearish{color:var(--red); border-color:rgba(var(--red-rgb),.5)}
  .biaschip.neutral{color:var(--muted); border-color:var(--line-strong)}
  .bar{height:5px; border-radius:3px; background:var(--surface3); margin-top:10px; overflow:hidden}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--teal),#2FD3C4); border-radius:3px}
  .scen-foot{display:flex; justify-content:space-between; margin-top:7px; font-family:var(--mono); font-size:10.5px; color:var(--faint)}

  /* ── columns ────────────────────────────────────────────────── */
  /* Meme largeur que l'en-tete (--shell-w), pas plein bord : meme
     raisonnement que heatmap.html. */
  .wrap{display:flex; gap:14px; padding:14px 20px; height:calc(100vh - 250px); min-height:340px;
        max-width:var(--shell-w); margin:0 auto}
  /* Flux direct : pastille de source colorée par thème, mise en avant des
     événements à fort impact. */
  .feeditem{display:block; padding:9px 12px; border-bottom:1px solid var(--line);
    text-decoration:none; color:inherit; transition:background .12s}
  .feeditem:hover{background:rgba(var(--white-rgb),.03)}
  .feeditem.hot{border-left:2px solid var(--red); background:rgba(var(--red-rgb),.05)}
  .feeditem .ftop{display:flex; align-items:center; gap:7px; margin-bottom:3px}
  .feeditem .fsrc{font-size:9px; letter-spacing:.08em; text-transform:uppercase;
    padding:1px 6px; border-radius:2px; background:var(--surface2); color:var(--muted)}
  .feeditem .fsrc.macro{color:var(--violet)} .feeditem .fsrc.marché{color:var(--teal)}
  .feeditem .fsrc[data-t="banque centrale"]{color:var(--gold)}
  .feeditem[data-hot="1"] .fsrc{color:var(--red)}
  .feeditem .fago{margin-left:auto; font-size:9.5px; color:var(--faint);
    font-family:var(--mono)}
  .feeditem .ftitle{font-size:12.5px; line-height:1.45; color:var(--text)}
  .feeditem .fdesc{font-size:11px; color:var(--muted); margin-top:3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  /* Calendrier : widget FinancialJuice encastré dans la colonne. Il se rend
     dans une iframe qu'on force en pleine largeur, sinon elle garde sa taille
     fixe d'origine et laisse une bande vide à droite. */
  .cbody.nopad{padding:0; overflow:hidden}
  /* Le widget se rend dans une iframe à taille fixe : on force elle ET ses
     conteneurs intermédiaires à occuper toute la colonne, sinon une bande
     vide subsiste à droite ou en bas selon la largeur d'écran. */
  .fjwrap{height:100%; min-height:340px; position:relative; overflow:hidden;
    display:flex}
  .fjwrap > *{flex:1 1 auto; width:100% !important; max-width:100% !important;
    min-width:0}
  .fjwrap iframe{border:0 !important; width:100% !important; height:100% !important;
    min-height:340px; display:block; background:var(--surface); flex:1 1 auto}
  .col{background:var(--surface); border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column; overflow:hidden}
  /* Le widget du calendrier a une largeur naturelle d'environ 340px : lui en
     donner 32% de l'écran laissait une large bande vide. On le fixe à sa
     taille utile et on redistribue l'espace aux colonnes qui en profitent. */
  /* Deux colonnes à largeur FIXE (calendrier et MAG7 : leur contenu a une
     largeur utile connue), deux colonnes élastiques qui absorbent le reste.
     Le MAG7 est une liste de noms courts et de pourcentages : lui donner 22%
     d'un écran large créait un vide inutile. */
  .col.feed{flex:1 1 auto; min-width:280px}
  .col.news{flex:1 1 auto; min-width:280px}
  .col.cal{flex:0 0 356px; max-width:356px}
  .col.mag{flex:0 0 232px; max-width:232px}
  .chead{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); flex:none}
  .chead h2{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--text)}
  .chead .cnt{font-family:var(--mono); font-size:10px; color:var(--faint); margin-left:auto}
  .cbody{flex:1; overflow-y:auto}
  .cbody::-webkit-scrollbar{width:8px} .cbody::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:4px}
  .empty{padding:36px; text-align:center; color:var(--faint); font-size:12px}

  .item{display:block; padding:10px 14px; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; transition:background .1s}
  .item:hover{background:var(--surface2)}
  .item.pin{background:var(--red-soft); border-left:2px solid var(--red)}
  .item-top{display:flex; align-items:center; gap:8px; margin-bottom:4px}
  .src{font-family:var(--mono); font-size:9px; letter-spacing:.04em; color:var(--gold); background:var(--gold-soft); padding:1px 6px; border-radius:3px; text-transform:uppercase}
  .pintag{font-family:var(--mono); font-size:8px; letter-spacing:.06em; color:var(--red); background:var(--red-soft); border:1px solid rgba(var(--red-rgb),.4); padding:1px 5px; border-radius:3px}
  .ago{font-family:var(--mono); font-size:10px; color:var(--faint); margin-left:auto}
  .head{font-size:12px; line-height:1.35; font-weight:500}
  .item.pin .head{color:var(--red)}
  .item:hover .head{color:var(--gold)}
  .item.pin:hover .head{color:var(--red)}
  .sum{font-size:11px; line-height:1.4; color:var(--muted); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

  .cal-day{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--gold); text-transform:uppercase; padding:8px 14px 5px; position:sticky; top:0; background:var(--surface2); border-bottom:1px solid var(--line)}
  .crow{display:flex; align-items:center; gap:9px; padding:8px 14px; border-bottom:1px solid var(--line); font-family:var(--mono)}
  .crow .ct{font-size:10px; color:var(--faint); min-width:42px}
  .idot{width:8px; height:8px; border-radius:50%; flex:none}
  .idot.high{background:var(--red)} .idot.medium{background:var(--orange)} .idot.low{background:var(--yellow)}
  .crow .cttl{font-size:11px; color:var(--text); flex:1; font-family:var(--sans)}
  .crow .cfv{font-size:10px; color:var(--muted); text-align:right; white-space:nowrap}
  .crow .cfv b{color:var(--text)}

  /* Verdict : le seul élément mis en avant de la colonne. */
  .verdict{display:flex; align-items:baseline; gap:10px; padding:11px 13px 6px}
  .verdict .vlab{font-size:9px; letter-spacing:.15em; text-transform:uppercase;
    color:var(--faint)}
  .verdict .vval{margin-left:auto; font-family:var(--mono); font-size:14px;
    font-weight:600; letter-spacing:.04em}
  .verdict.up .vval{color:var(--teal)}
  .verdict.dn .vval{color:var(--red)}
  .verdict.mid .vval{color:var(--muted)}
  .reads{padding:2px 13px 11px; border-bottom:1px solid var(--line)}
  .rd{display:flex; align-items:flex-start; gap:7px; font-size:10.5px;
    line-height:1.5; color:var(--muted); padding:2.5px 0}
  .rd i{width:4px; height:4px; border-radius:50%; flex:none; margin-top:6px;
    background:var(--faint)}
  .rd.ok i{background:var(--teal)}
  .rd.warn i{background:var(--red)}
  /* En-têtes de liste : discrets, ils séparent sans peser. */
  .msep{padding:10px 13px 5px; font-size:9px; letter-spacing:.15em;
    text-transform:uppercase; color:var(--faint); background:transparent;
    border-top:1px solid var(--line); margin-top:2px}
  .msep.first{border-top:none; margin-top:0; padding-top:8px}
    .chelp{background:none; border:1px solid var(--line-strong); color:var(--faint);
    font:inherit; font-size:10px; width:19px; height:19px; border-radius:50%;
    cursor:pointer; margin-left:7px; line-height:1; padding:0}
  .chelp:hover{color:var(--gold); border-color:var(--gold)}
  .chelp.on{color:var(--gold); border-color:var(--gold)}
  .chelpbox{padding:11px 13px; font-size:11.5px; line-height:1.55; color:var(--muted);
    background:var(--surface2); border-bottom:1px solid var(--line-strong)}
  .msep{padding:9px 12px 6px; font-size:9px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint); border-top:1px solid var(--line-strong);
    margin-top:6px; background:var(--surface2)}
  .mrow{display:flex; align-items:center; gap:10px; padding:5px 13px;
    font-family:var(--mono); font-size:11.5px; line-height:1.5}
  .mrow:hover{background:rgba(var(--white-rgb),.02)}
  .msym{color:var(--text); flex:1 1 auto; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .mdp{flex:0 0 auto; text-align:right; min-width:56px; font-weight:600}
  .mrow .msym{font-size:12.5px; font-weight:600; flex:1}
  .mrow .mdp{font-size:12px; min-width:66px; text-align:right}
  .up{color:var(--teal)} .down{color:var(--red)}
  .magg{padding:12px 14px; border-top:2px solid var(--line-strong); background:var(--surface2)}
  .magg .al{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:8px}
  .magg .arow{display:flex; gap:8px}
  .magg .acell{flex:1; text-align:center}
  .magg .acell .k{font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase}
  .magg .acell .v{font-family:var(--mono); font-size:15px; font-weight:600; margin-top:3px}

  /* Barre d'onglets : masquée sur grand écran, où les colonnes cohabitent. */
  .mtabs{display:none}

  @media (max-width:920px){
    body{overflow:auto; height:auto}
    .wrap{flex-wrap:wrap; height:auto} .col{flex:1 1 100%} .cbody{max-height:56vh}
    .metric{min-width:calc(50% - 10px)}
  }

  /* ───────── TÉLÉPHONE ─────────
     Quatre colonnes empilées donnaient un défilement interminable, avec des
     zones qui défilent à l'intérieur d'une page qui défile aussi. On affiche
     donc UNE section à la fois, choisie par des onglets : chacune occupe
     l'écran, et le défilement redevient celui de la page. */
  @media (max-width:700px){
    header{padding:10px 14px; gap:8px; flex-wrap:wrap}
    header h1{font-size:12px; letter-spacing:.12em}
    .topnav a{font-size:11.5px; padding:5px 7px}
    .macro{margin:10px 12px 0; padding:11px 13px; border-radius:8px}
    .metric{min-width:calc(50% - 8px)}

    .mtabs{
      display:flex; gap:6px; margin:12px 12px 0; overflow-x:auto;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .mtabs::-webkit-scrollbar{display:none}
    .mtabs button{
      flex:1 0 auto; min-height:42px; padding:0 15px; white-space:nowrap;
      background:var(--surface); border:1px solid var(--line);
      color:var(--muted); font:inherit; font-size:12.5px; cursor:pointer;
      border-radius:8px;
    }
    .mtabs button.on{
      color:var(--gold); border-color:rgba(var(--gold-rgb),.5);
      background:rgba(var(--gold-rgb),.07);
    }

    .wrap{padding:10px 12px 24px; gap:0; height:auto; min-height:0}
    .col{display:none}
    .col.mshow{display:flex; flex:1 1 100%}
    /* la section occupe l'écran : plus de double défilement */
    .cbody{max-height:none; height:auto; min-height:60vh; overflow:visible}
    /* Une iframe ne défile pas à l'intérieur d'un conteneur sur mobile : son
       contenu est simplement coupé. On lui donne donc une hauteur suffisante
       pour tout afficher, et c'est la PAGE qui défile — comportement naturel
       au doigt, et plus de blocage en bas de liste. */
    .col.cal{flex:1 1 100%; max-width:none}
    /* On ne force PLUS la hauteur de l'iframe : elle est fixee a la
       construction du widget (voir FJ_MOBILE_H). Imposer une valeur
       differente en CSS laissait une bande vide sous le contenu. */
    .cbody.nopad{min-height:0; height:auto; overflow:visible}
    .fjwrap{height:auto; min-height:0; overflow:visible; display:block}
    .fjwrap iframe{width:100% !important; display:block; height:auto}

    /* cibles tactiles et lisibilité */
    .feeditem, .nitem{padding:11px 13px}
    .feeditem .ftitle{font-size:13px; line-height:1.5}
    .feeditem .fdesc{font-size:11.5px; -webkit-line-clamp:3}
    .chead{padding:11px 13px}
  }
</style>
<script src="/loader.js"></script>
</head>
<body>
<header class="appheader">
  <div class="appheader-id">
    <h1><b>Gex</b>Dash · <span>Macro</span></h1>
  </div>
  <div class="appheader-bar">
  <nav class="topnav" id="appnav"></nav>
    <div id="community"></div>
    <div id="langSel"></div>
  </div>
</header>

<section class="macro" id="macro">
  <div class="macro-h"><span class="ic">◎</span><b id="macroTitle">Environnement macro actuel</b>
    <span class="sess" style="margin-left:auto"><i class="dot" id="sessDot"></i><span id="sessTxt">—</span></span></div>
  <div class="metrics" id="metrics"><div class="empty">…</div></div>
  <div class="scen" id="scenBox" hidden>
    <div class="scen-row">
      <span class="lab"><span class="ic">◈</span><span id="scenName">—</span></span>
      <span class="bias"><span id="biasArrow"></span><span class="biaschip" id="biasChip">—</span></span>
    </div>
    <div class="bar"><i id="condBar" style="width:0%"></i></div>
    <div class="scen-foot"><span id="condTxt"></span><span id="confTxt"></span></div>
  </div>
</section>

<nav class="mtabs" id="mtabs" aria-label="Sections">
  <button data-c="feed" class="on">Flux</button>
  <button data-c="news">Actus</button>
  <button data-c="cal">Calendrier</button>
  <button data-c="mag">MAG7</button>
</nav>
<div class="wrap">
  <section class="col feed">
    <div class="chead"><h2 id="colFeed">Flux direct</h2><span class="cnt" id="feedCnt"></span></div>
    <div class="cbody" id="feedBody"><div class="empty">…</div></div>
  </section>
  <section class="col news">
    <div class="chead"><h2 id="colNews">Actualités marché</h2><span class="cnt" id="newsCnt"></span></div>
    <div class="cbody nopad" id="newsBody"><div class="fjwrap" id="fjNews"></div></div>
  </section>
  <section class="col cal">
    <div class="chead"><h2 id="colCal">Calendrier éco.</h2><span class="cnt" id="calCnt"></span></div>
    <div class="cbody nopad" id="calBody"><div class="fjwrap" id="fjCal"></div></div>
  </section>
  <section class="col mag">
    <div class="chead"><h2 id="colMag">MAG7</h2><span class="cnt" id="magUpd"></span><button class="chelp" id="magHelpBtn" type="button" aria-label="Aide">?</button></div>
    <div class="chelpbox" id="magHelpBox" hidden></div>
    <div class="magg" id="magAgg" hidden></div>
    <div class="cbody" id="magBody"><div class="empty">…</div></div>
  </section>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const T = {
  fr: { term:"Terminal", heat:"Heatmap", dash:"Dashboard", doc:"Doc",
    mtFeed:"Flux", mtNews:"Actus", mtCal:"Calendrier", mtMag:"MAG7",
    macroTitle:"Environnement macro actuel", colFeed:"Flux direct", colNews:"Actualités marché", colCal:"Calendrier éco.", colMag:"MAG7",
    live:"LIVE · RTH", pre:"PRÉ-MARCHÉ", post:"AFTER-HOURS", closed:"MARCHÉ FERMÉ",
    now:"à l'instant", unavail:"Indisponible", pinned:"ÉPINGLÉ",
    rising:"Hausse", falling:"Baisse", stable:"Stable",
    gdp:"Croissance PIB", cpi:"Inflation cœur", cpiHead:"Inflation (IPC)", unemp:"Chômage", fed:"Taux Fed", curve:"Courbe des taux",
    scenLbl:"Scénario le plus probable", condMet:"conditions remplies", conf:"confiance du modèle (heuristique)",
    biasBull:"BIAIS NQ HAUSSIER", biasBear:"BIAIS NQ BAISSIER", biasNeutral:"BIAIS NQ NEUTRE",
    sc_goldilocks:"Économie Goldilocks", sc_overheating:"Surchauffe", sc_stagflation:"Stagflation",

    fc:"prév.", pv:"préc.", aggLbl:"MAG7 · équipondéré (comme un ETF)", day:"Jour", week:"Sem.", month:"Mois·MTD",
    mkts:"Panorama marché", bias:"Biais", breadth:"Largeur",
    instSrc:"sources institutionnelles",
    nWide:  b => `Hausse LARGE — ${b}% du groupe participe`,
    nNarrow:(b, up) => up ? `Mouvement ÉTROIT — seuls ${b}% suivent`
                          : `Baisse LARGE — ${b}% seulement résistent`,
    nMixed: b => `Participation mitigée — ${b}% en hausse`,
    nSoxLead:v => `Semis en tête (${fmtPc(v)}) — cycle tech porteur`,
    nSoxLag: v => `Semis à la traîne (${fmtPc(v)}) — moteur qui faiblit`,
    nSoxFlat:v => `Semis alignés sur le groupe (${fmtPc(v)})`,
    nIwmOk:  (v, up) => up ? `Small caps confirment (${fmtPc(v)}) — hausse saine`
                          : `Small caps suivent (${fmtPc(v)}) — repli généralisé`,
    nIwmDiv: v => `Small caps divergent (${fmtPc(v)}) — rotation vers les méga-caps`,
    nIwmFlat:v => `Small caps neutres (${fmtPc(v)})`,
    nSpread:(a,x,b,y) => `Dispersion : ${a} ${fmtPc(x)} vs ${b} ${fmtPc(y)}`,
    b_risk_on:"RISK-ON", b_lean_on:"Penché risque", b_neutral:"Neutre",
    b_lean_off:"Penché défensif", b_risk_off:"RISK-OFF", b_incomplete:"Incomplet",
    magIncomplete:n => `Échantillon incomplet — ${n} valeur${n > 1 ? "s" : ""} manquante${n > 1 ? "s" : ""}, biais non calculé`,
    magHelp:"MAG7 — les sept plus grosses capitalisations technologiques, moteur "
      + "principal du Nasdaq 100. La moyenne équipondérée traite chaque titre à "
      + "poids égal : elle montre si la hausse est portée par l'ensemble du groupe "
      + "ou par une seule valeur. Le panorama en dessous replace le tout dans son "
      + "contexte — indices, taux, dollar, matières premières et volatilité.",
    macroNa:"Synthèse indisponible — source macro à configurer" },
  en: { term:"Terminal", heat:"Heatmap", dash:"Dashboard", doc:"Doc",
    mtFeed:"Feed", mtNews:"News", mtCal:"Calendar", mtMag:"MAG7",
    macroTitle:"Current Macro Environment", colFeed:"Live feed", colNews:"Market news", colCal:"Economic Calendar", colMag:"MAG7",
    live:"LIVE · RTH", pre:"PRE-MARKET", post:"AFTER-HOURS", closed:"MARKET CLOSED",
    now:"just now", unavail:"Unavailable", pinned:"PINNED",
    rising:"Rising", falling:"Falling", stable:"Stable",

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ago(ts){ const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if (s < 60) return t("now"); const m = Math.floor(s/60); if (m < 60) return m+"m";
  const h = Math.floor(m/60); if (h < 24) return h+"h"; return Math.floor(h/24)+"d"; }
function pctTxt(v){ return v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%"; }
function pctCls(v){ return v == null ? "" : v >= 0 ? "up" : "down"; }

function sessionState(){
  const et = new Date(new Date().toLocaleString("en-US", {timeZone:"America/New_York"}));
  if (et.getDay() === 0 || et.getDay() === 6) return "closed";
  const m = et.getHours()*60 + et.getMinutes();
  if (m >= 570 && m < 960) return "live"; if (m >= 240 && m < 570) return "pre";
  if (m >= 960 && m < 1200) return "post"; return "closed";
}
/* Onglets mobile : une seule colonne affichée à la fois. Le choix est
   mémorisé, et le calendrier — widget tiers qui se rend dans une iframe —
   n'est construit qu'au moment où son onglet devient visible, sinon il se
   dimensionne dans un conteneur masqué et s'affiche de travers. */
const MOBILE_Q = window.matchMedia("(max-width:700px)");
// Hauteur des widgets sur telephone : assez grande pour afficher le contenu
// sans defilement interne (une iframe ne defile pas dans son conteneur), la
// page prend alors le relais.
const FJ_MOBILE_H = 1100;

/* ═══ MONTAGE DES WIDGETS FINANCIALJUICE ═══════════════════════════════
   Ces widgets se figent à la taille demandée au moment de leur création.
   Deux pièges, qui expliquaient les rendus tantôt bons tantôt faux :

   1. mesurer trop tôt — au premier rendu la colonne n'a pas encore sa
      largeur définitive (mise en page flexible, polices en cours de
      chargement) ; on obtenait 0 ou une valeur provisoire ;
   2. reconstruire en double — l'observateur de taille se déclenche dès
      qu'on l'installe, ce qui relançait une construction par-dessus celle
      en cours, et c'est la course entre les deux qui rendait le résultat
      imprévisible.

   La fabrique ci-dessous règle les deux : elle réessaie jusqu'à obtenir une
   taille réelle, et mémorise la largeur utilisée pour ne reconstruire que
   si elle a vraiment changé. */
function mountFJ(hostId, options, onFail){
  const host = document.getElementById(hostId);
  if (!host || host._fj) return;
  host._fj = {w: 0, timer: 0};

  const attempt = () => {
    if (!window.FJWidgets) return false;
    const r = host.getBoundingClientRect();
    const w = Math.round(r.width);
    const h = MOBILE_Q.matches ? FJ_MOBILE_H : Math.round(r.height);
    if (w < 120 || h < 120) return false;          // pas encore dimensionné
    if (Math.abs(w - host._fj.w) < 24) return true; // déjà à la bonne taille
    host._fj.w = w;
    host.innerHTML = "";
    try{
      new window.FJWidgets.createWidget(Object.assign({}, options, {
        container: hostId,
        width: w + "px",
        height: h + "px",
        backColor: "111114",     // --surface
        fontColor: "8A8A94",     // --muted
      }));
    }catch(e){
      if (onFail) onFail();
      return true;
    }
    return true;
  };

  // on insiste sur quelques frames tant que la colonne n'a pas sa taille
  const settle = (n) => {
    if (attempt() || n > 40) return;
    requestAnimationFrame(() => settle(n + 1));
  };

  const start = () => {
    settle(0);
    // observateur installé APRÈS la première construction, et la largeur de
    // référence est déjà mémorisée : plus de reconstruction parasite
    if (!host._ro){
      host._ro = new ResizeObserver(() => {
        clearTimeout(host._fj.timer);
        host._fj.timer = setTimeout(() => attempt(), 220);
      });
      host._ro.observe(host);
    }
  };

  if (window.FJWidgets) return start();
  let s = document.getElementById("FJ-Widgets");
  if (s){                                   // script déjà en cours de chargement
    s.addEventListener("load", start);
    s.addEventListener("error", () => onFail && onFail());
    return;
  }
  s = document.createElement("script");
  s.id = "FJ-Widgets";
  s.src = "https://feed.financialjuice.com/widgets/widgets.js?r="
        + Math.floor(Math.random() * 10000);
  s.onload = start;
  s.onerror = () => onFail && onFail();
  document.head.appendChild(s);
}

const ARROW = { rising:"↗", falling:"↘", stable:"—" };

/* ── mag7 ── */
function fmtPc(v){
  if (v == null) return "—";
  return (v >= 0 ? "+" : "") + Number(v).toFixed(2) + "%";
}

function renderMag(){
  const box = $("#magBody");
  if (!MAG || !MAG.rows){ box.innerHTML = `<div class="empty">${t("unavail")}</div>`; return; }
  const line = (label, price, dp, title) =>
    `<div class="mrow"${title ? ` title="${esc(title)}"` : ""}>
       <span class="msym">${esc(label)}</span>
       <span class="mdp ${pctCls(dp)}">${pctTxt(dp)}</span></div>`;
  // Le prix nominal d'un ETF n'apprend rien (QQQ à 512 $ ?) : seule la
  // variation compte pour lire un régime. On le retire, la colonne respire.
  box.innerHTML = `<div class="msep first">${t("colMag")}</div>`
    + MAG.rows.map(r => line(r.sym, r.price, r.dp)).join("");
  const a = MAG.agg || {};
  const cell = (k,v) => `<div class="acell"><div class="k">${t(k)}</div><div class="v ${pctCls(v)}">${pctTxt(v)}</div></div>`;
  $("#magAgg").hidden = false;
  /* LECTURE DE MARCHÉ — la valeur n'est pas dans les chiffres bruts (déjà
     listés en dessous) mais dans ce qu'ils disent ensemble. On teste donc
     trois questions qu'un desk se pose :
       1. la hausse est-elle LARGE ou portée par une poignée de titres ?
       2. les semis CONFIRMENT-ils ? (ils mènent le cycle tech)
       3. le reste du marché SUIT-il ? (small caps, volatilité)
     Chaque réponse devient une ligne courte, colorée selon qu'elle conforte
     ou contredit le mouvement. */
  const bias = a.bias || "neutral";
  const bcls = bias === "incomplete" ? "mid" : bias.includes("on") ? "up" : bias.includes("off") ? "dn" : "mid";
  const d = a.day || 0, up = d >= 0;
  const notes = [];

  // Un biais ne se calcule que sur un groupe complet (cf. _news_mag7 côté
  // serveur) : sur échantillon partiel, on l'indique plutôt que d'afficher
  // un verdict qui n'a l'air complet que par accident.
  if (a.complete === false){
    const nMiss = (a.missing || []).length
      + [a.sox, a.iwm, a.vix].filter(v => v == null).length;
    notes.push({tone: "warn", txt: t("magIncomplete")(Math.max(1, nMiss))});
  }
  if (a.breadth != null){
    const wide = a.breadth >= 70, narrow = a.breadth <= 30;
    notes.push({
      tone: (wide && up) || (narrow && !up) ? "ok" : narrow ? "warn" : "mid",
      txt: t(wide ? "nWide" : narrow ? "nNarrow" : "nMixed")(a.breadth, up),
    });
  }
  if (a.sox != null){
    const lead = a.sox - d;                      // semis vs moyenne du groupe
    notes.push({
      tone: lead > 0.3 ? "ok" : lead < -0.3 ? "warn" : "mid",
      txt: t(lead > 0.3 ? "nSoxLead" : lead < -0.3 ? "nSoxLag" : "nSoxFlat")(a.sox),
    });
  }
  if (a.iwm != null){
    const conf = (up && a.iwm > 0.2) || (!up && a.iwm < -0.2);
    const div = (up && a.iwm < -0.2) || (!up && a.iwm > 0.2);
    notes.push({
      tone: conf ? "ok" : div ? "warn" : "mid",
      txt: t(conf ? "nIwmOk" : div ? "nIwmDiv" : "nIwmFlat")(a.iwm, up),
    });
  }

  // meneur et retardataire : la dispersion interne du groupe
  const rk = [...MAG.rows].filter(r => r.dp != null).sort((x, y) => y.dp - x.dp);
  const lead2 = rk[0], lag = rk[rk.length - 1];

  $("#magAgg").innerHTML =
    `<div class="verdict ${bcls}">
       <div class="vlab">${t("bias")}</div>
       <div class="vval">${t("b_" + bias)}</div>
     </div>
     <div class="reads">` +
    notes.map(n => `<div class="rd ${n.tone}"><i></i>${esc(n.txt)}</div>`).join("") +
    (lead2 && lag && lead2.sym !== lag.sym
      ? `<div class="rd mid"><i></i>${esc(t("nSpread")(lead2.sym, lead2.dp, lag.sym, lag.dp))}</div>`
      : "") +
    `</div>`;

  /* La colonne n'était remplie qu'au tiers par les 8 valeurs du MAG7. On la
     complète par un panorama de marché — indices, taux, dollar, or, pétrole,
     volatilité — qui donne le contexte que la tech seule ne montre pas. */
  const mk = MAG.markets || [];
  if (mk.length){
    box.innerHTML += `<div class="msep">${t("mkts")}</div>`
      + mk.map(r => line(r.name || r.sym, r.price, r.dp, r.sym)).join("");
  }
}

async function jget(u){ try{ return await (await fetch(u)).json(); }catch(_){ return null; } }
let FEED = [];
function renderFeed(){
  const box = $("#feedBody");

    box.innerHTML = `<div class="empty">${t("unavail")}</div>`;
    $("#feedCnt").textContent = ""; return;
  }

      href="${esc(x.url)}" target="_blank" rel="noopener">

  $("#feedCnt").textContent = FEED.length;
}

/* Colonne Actus : widget officiel FinancialJuice.
   Pourquoi le widget et pas leur RSS ? Les deux autres voies sont fermées :
   depuis le serveur leur flux nous limite (HTTP 429, adresses Vercel
   partagées), et depuis le navigateur la politique d'origine croisée
   interdit de lire un flux d'un autre domaine. Le widget contourne les deux
   puisque c'est le navigateur du visiteur qui appelle, avec sa propre
   adresse. Contrepartie assumée : il se rend dans une iframe, donc notre CSS
   ne s'y applique pas — seuls le fond et la couleur du texte sont réglables.
   Si le widget ne charge pas, on bascule sur une liste maison. */
let NEWS_SRC = "";        // "" = widget, "fallback" = liste maison

async function loadNews(){
  if (NEWS_SRC === "fallback") return loadNewsList();
  mountFJ("fjNews", {mode: "Dark", widgetType: "NEWS"}, newsFallback);
  const c = $("#newsCnt");
  if (c && NEWS_SRC !== "fallback") c.textContent = "Live";
}

function newsFallback(){
  NEWS_SRC = "fallback";
  const box = $("#newsBody");
  if (box) box.classList.remove("nopad");
  loadNewsList();
}

async function loadNewsList(){
  const d = await jget("/api/news?type=fj");
  NEWS = (d && d.news) || [];
  const box = $("#newsBody");
  if (!box) return;
  box.innerHTML = NEWS.length
    ? NEWS.map(x => {
        const ts = x.ts || x.datetime || 0;
        const title = x.title || x.headline || "";
        return `<a class="feeditem${x.impact === "high" ? " hot" : ""}"
          href="${esc(x.url || "#")}" target="_blank" rel="noopener">
          <div class="ftop"><span class="fsrc">${esc(x.source || "")}</span>
          <span class="fago">${ts ? ago(ts) : ""}</span></div>
          <div class="ftitle">${esc(title)}</div></a>`;
      }).join("")
    : `<div class="empty">${t("unavail")}</div>`;
  $("#newsCnt").textContent = NEWS.length
    ? `${NEWS.length} · ${(d && d.src) === "finnhub" ? "Finnhub"
        : (d && d.src) === "fj" ? "Live" : t("instSrc")}`
    : "";
}

async function loadMag(){ const d = await jget("/api/news?type=mag7"); MAG = (d&&d.mag7)||null; renderMag();
  $("#magUpd").textContent = new Date().toLocaleTimeString(loc(), {hour:"2-digit", minute:"2-digit"}); }
async function loadMacro(){ const d = await jget("/macro.json?t=" + Date.now()); MACRO = (d && d.metrics) ? d : null; renderMacro(); }

// Rond de marque unifié : masque les placeholders "…" par colonne tant que
// les fetches initiaux (parallèles, indépendants) n'ont pas tous résolu,
// plutôt que de laisser chaque section se peupler séparément et de manière
// visible à l'écran.
{
  const _t0 = PageLoader.begin(document.body);
  Promise.all([loadMacro(), loadFeed(), loadNews(), loadCal(), loadMag()])
    .finally(() => PageLoader.end(document.body, _t0));
}
/* Rythmes de rafraîchissement. Deux garde-fous :
   • rien ne tourne quand l'onglet est en arrière-plan — le navigateur bride
     déjà les minuteurs, mais on évite surtout la rafale au retour ;
   • au retour sur l'onglet après une absence, on recharge une fois pour
     rattraper ce qui a été manqué. */
function everyVisible(fn, ms){
  return setInterval(() => { if (!document.hidden) fn(); }, ms);
}
everyVisible(loadFeed, 120000);
everyVisible(loadNews, 90000);
everyVisible(loadMag, 45000);        // aligné sur le cache serveur
everyVisible(loadMacro, 3600000);
setInterval(updateSession, 60000);   // l'état ne change qu'aux bornes horaires

let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  if (Date.now() - hiddenAt > 60000){ loadFeed(); loadNews(); loadMag(); }
  updateSession();
});
